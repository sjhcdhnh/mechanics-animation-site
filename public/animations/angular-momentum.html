<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>动量矩守恒 · 可变转动惯量</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}
#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:8px;font-size:11px;line-height:1.9;backdrop-filter:blur(6px);border-left:4px solid #2563eb}
#p{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(6px)}
#p input{width:100px;accent-color:#2563eb}#p .v{color:#2563eb;font-weight:600}
#p button{width:100%;margin-top:4px;padding:5px;border-radius:6px;border:1px solid #2563eb;background:rgba(37,99,235,.08);color:#2563eb;font-size:12px;cursor:pointer}
#leg{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
</style></head><body>
<div id="hud"><b>动量矩守恒 L=Iω=const</b><br>滑块位置 r=<span style="color:#2563eb" id="vr">0.6</span> m<br>转动惯量 I=<span id="vi">--</span> kg·m²<br>角速度 ω=<span style="color:#dc2626" id="vw">--</span> rad/s<br>动量矩 L=<span style="color:#16a34a" id="vl">--</span> kg·m²/s</div>
<div id="p"><div>初始转速 ω₀<input type="range" id="sw" min="10" max="50" value="20" step="1"> <span class="v" id="lw">2.0</span> rad/s</div><div>滑块质量 m<input type="range" id="sm" min="5" max="30" value="15" step="1"> <span class="v" id="lm">1.5</span> kg</div><button onclick="rst()">⟳ 复位</button></div>
<div id="leg">转台(蓝)·滑块(红)·滑块外移→ω减小 &nbsp; 拖拽旋转</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">import * as T from "three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");
var C=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,25);C.position.set(0,3,10);C.lookAt(0,0,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,0,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.5));S.add(new T.DirectionalLight("#ffffff",4).position.set(4,8,5));
S.add(new T.GridHelper(8,16,"#bbb","#e0e0e0"));
var dG2=new T.CylinderGeometry(2.5,2.5,0.06,64);
var dM2=new T.Mesh(dG2,new T.MeshStandardMaterial({color:"#3b82f6",roughness:0.3,metalness:0.4}));dM2.rotation.x=-Math.PI/2;dM2.receiveShadow=true;S.add(dM2);
var rG2=new T.TorusGeometry(2.5,0.03,12,80);
var rM2=new T.Mesh(rG2,new T.MeshStandardMaterial({color:"#2563eb",roughness:0.2,metalness:0.6}));rM2.rotation.x=Math.PI/2;S.add(rM2);
S.add(new T.Mesh(new T.CylinderGeometry(0.06,0.06,0.4,12),new T.MeshStandardMaterial({color:"#4a4f5a",roughness:0.5})).translateZ(.25));
var mG2=new T.Group();S.add(mG2);
var s1G=new T.SphereGeometry(0.2,32,32);
var s1M=new T.Mesh(s1G,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.2,metalness:0.45}));s1M.castShadow=true;mG2.add(s1M);
var s2M=new T.Mesh(s1G,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.2,metalness:0.45}));s2M.castShadow=true;mG2.add(s2M);
var tG2=new T.BoxGeometry(4.5,0.04,0.06);
var tM=new T.Mesh(tG2,new T.MeshStandardMaterial({color:"#1e40af",roughness:0.5}));mG2.add(tM);
var tM2=new T.Mesh(tG2.clone(),new T.MeshStandardMaterial({color:"#1e40af",roughness:0.5}));tM2.rotation.z=Math.PI/2;mG2.add(tM2);
var ang=0;var omega=2.0;var rPos=0.8;var I0=2.0;var L0=0;
function rst(){omega=parseInt(document.getElementById("sw").value)/10;document.getElementById("lw").textContent=omega.toFixed(1);
var m2=parseInt(document.getElementById("sm").value)/10;document.getElementById("lm").textContent=m2.toFixed(1);
I0=1.5+2*m2*rPos*rPos;L0=I0*omega;
document.getElementById("vi").textContent=I0.toFixed(2);
document.getElementById("vw").textContent=omega.toFixed(2);
document.getElementById("vl").textContent=L0.toFixed(2);s1M.position.set(rPos,0,0);s2M.position.set(-rPos,0,0);}
window.rst=rst;document.getElementById("sw").addEventListener("input",rst);document.getElementById("sm").addEventListener("input",rst);
var dir=1;
function anim(){requestAnimationFrame(anim);ang+=omega*0.016;mG2.rotation.z=ang;
rPos+=dir*0.012;if(rPos>2.0){dir=-1;}if(rPos<0.2){dir=1;}
var m2=parseInt(document.getElementById("sm").value)/10;
var I=1.5+2*m2*rPos*rPos;omega=L0/I;
s1M.position.set(rPos,0,0);s2M.position.set(-rPos,0,0);
document.getElementById("vr").textContent=rPos.toFixed(2);
document.getElementById("vi").textContent=I.toFixed(2);
document.getElementById("vw").textContent=omega.toFixed(2);
O.update();R.render(S,C);}anim();rst();
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
