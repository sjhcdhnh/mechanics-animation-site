<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>对心正碰撞 · 恢复系数</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}
#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:8px;font-size:12px;line-height:1.8;backdrop-filter:blur(6px);border-left:4px solid #dc2626;min-width:200px}
#p{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(6px)}
#p input{width:100px;accent-color:#2563eb}#p span.v{color:#2563eb;font-weight:600}
#p button{width:100%;margin-top:4px;padding:5px;border-radius:6px;border:1px solid #2563eb;background:rgba(37,99,235,.08);color:#2563eb;font-size:12px;cursor:pointer}
#leg{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
#hint{position:absolute;bottom:16px;right:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
.sw{display:inline-block;width:10px;height:6px;border-radius:1px;margin-right:3px;border:1px solid rgba(0,0,0,.15)}
.b{color:#2563eb}.r{color:#dc2626}.y{color:#ca8a04}
</style></head><body>
<div id="hud"><b>对心正碰撞 · 恢复系数</b><br><span class="sw" style="background:#2563eb"></span>m₁=<span id="vm1">1.0</span> v₁=<span id="vv1">--</span><br><span class="sw" style="background:#dc2626"></span>m₂=<span id="vm2">1.0</span> v₂=<span id="vv2">--</span><br>恢复系数 e=<span class="y" id="ve">0.50</span><br>碰撞后: v₁'=<span class="b" id="vv1p">--</span> v₂'=<span class="r" id="vv2p">--</span><br>动量: <span id="vp">--</span> &nbsp; 动能: <span id="vk">--</span></div>
<div id="p"><div>恢复系数 e <input type="range" id="se" min="0" max="100" value="50" step="1"> <span class="v" id="le">0.50</span></div><div>质量比 m₁/m₂ <input type="range" id="sm" min="30" max="300" value="100" step="1"> <span class="v" id="lm">1.00</span></div><button onclick="rst()">⟳ 复位重播</button></div>
<div id="leg"><span class="sw" style="background:#2563eb"></span>碰撞前速度 <span class="sw" style="background:#16a34a"></span>碰撞后速度</div>
<div id="hint">调e和m₁/m₂→点复位看碰撞 · 拖拽旋转视角</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">
import * as T from "three";import { OrbitControls } from "three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");S.fog=new T.Fog("#a4d3ee",6,20);
var C=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,25);C.position.set(0,3,10);C.lookAt(0,0,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,0,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.5));
var dL=new T.DirectionalLight("#ffffff",4);dL.position.set(4,8,5);dL.castShadow=true;dL.shadow.mapSize.width=2048;dL.shadow.mapSize.height=2048;S.add(dL);
S.add(new T.DirectionalLight("#8899cc",1.5).position.set(-3,3,-2));
S.add(new T.GridHelper(12,24,"#bbb","#e0e0e0"));
var baseG=new T.PlaneGeometry(12,3);var baseMat=new T.MeshStandardMaterial({color:"#e8e8ec",roughness:0.8});
var baseM=new T.Mesh(baseG,baseMat);baseM.rotation.x=-Math.PI/2;baseM.position.y=-0.6;baseM.receiveShadow=true;S.add(baseM);
var railG=new T.BoxGeometry(10,0.08,0.25);
var railM2=new T.Mesh(railG,new T.MeshStandardMaterial({color:"#6b7280",roughness:0.4,metalness:0.6}));railM2.position.y=-0.4;railM2.castShadow=true;S.add(railM2);
var mBall1=new T.MeshStandardMaterial({color:"#2563eb",roughness:0.2,metalness:0.45});
var mBall2=new T.MeshStandardMaterial({color:"#dc2626",roughness:0.2,metalness:0.45});
var mArrow=new T.MeshStandardMaterial({color:"#2563eb",roughness:0.05,emissive:"#2563eb",emissiveIntensity:0.5});
var mArrow2=new T.MeshStandardMaterial({color:"#dc2626",roughness:0.05,emissive:"#dc2626",emissiveIntensity:0.5});
var mArrowP=new T.MeshStandardMaterial({color:"#16a34a",roughness:0.05,emissive:"#16a34a",emissiveIntensity:0.6});
function arrowX(pos,h,mat){var g=new T.Group();
var sG=new T.CylinderGeometry(0.04,0.04,h*0.78,8);var sM3=new T.Mesh(sG,mat);sM3.rotation.z=Math.PI/2;sM3.position.x=h*0.39;g.add(sM3);
var hG=new T.ConeGeometry(0.10,h*0.22,8);var hM3=new T.Mesh(hG,mat);hM3.rotation.z=-Math.PI/2;hM3.position.x=h*0.89;g.add(hM3);return g;}
var ball1G=new T.SphereGeometry(0.35,32,32);var ball1M=new T.Mesh(ball1G,mBall1);ball1M.castShadow=true;S.add(ball1M);
var ball2G=new T.SphereGeometry(0.35,32,32);var ball2M=new T.Mesh(ball2G,mBall2);ball2M.castShadow=true;S.add(ball2M);
var arr1G=new T.Group();S.add(arr1G);
var arr2G=new T.Group();S.add(arr2G);
var v1=3.0;var x1=-3.5;var x2=1.5;var collided=false;var v1p=0;var v2p=0;var ang_start=0;
var sep=x2-x1-0.7;
function rstData(){
x1=-3.5;x2=1.5;collided=false;ang_start=performance.now();
sep=x2-x1-0.7;
var e=parseInt(document.getElementById("se").value)/100;
var mr=parseInt(document.getElementById("sm").value)/100;
var m1=mr;var m2=1.0;
v1p=(m1-e*m2)*v1/(m1+m2);v2p=(1+e)*m1*v1/(m1+m2);
ball1M.position.set(x1,0,0);ball2M.position.set(x2,0,0);
while(arr1G.children.length>0)arr1G.remove(arr1G.children[0]);
while(arr2G.children.length>0)arr2G.remove(arr2G.children[0]);
var a1=arrowX(0,Math.abs(v1)*0.5,mArrow);a1.position.set(x1+0.4,0.5,0);arr1G.add(a1);
document.getElementById("le").textContent=e.toFixed(2);
document.getElementById("ve").textContent=e.toFixed(2);
document.getElementById("lm").textContent=mr.toFixed(2);
document.getElementById("vm1").textContent=m1.toFixed(1);
document.getElementById("vm2").textContent=m2.toFixed(1);
document.getElementById("vv1").textContent=v1.toFixed(1);
document.getElementById("vv2").textContent="0.0";
var mom=m1*v1;var ke=0.5*m1*v1*v1;
document.getElementById("vp").textContent=mom.toFixed(2);
document.getElementById("vk").textContent=ke.toFixed(2);
}
window.rst=rstData;
document.getElementById("se").addEventListener("input",rstData);
document.getElementById("sm").addEventListener("input",rstData);
function anim(now){requestAnimationFrame(anim);
var dt=0.016;
if(!collided){
  x1+=v1*dt;
  var d=x2-x1-0.7;
  if(d<=0.001){collided=true;x1=x2-0.7;
    document.getElementById("vv1p").textContent=v1p.toFixed(2);
    document.getElementById("vv2p").textContent=v2p.toFixed(2);
    var m1=parseInt(document.getElementById("sm").value)/100;var m2=1.0;
    var momp=m1*v1p+m2*v2p;var kep=0.5*m1*v1p*v1p+0.5*m2*v2p*v2p;
    document.getElementById("vp").textContent=momp.toFixed(2);
    document.getElementById("vk").textContent=kep.toFixed(2);
    while(arr1G.children.length>0)arr1G.remove(arr1G.children[0]);
    while(arr2G.children.length>0)arr2G.remove(arr2G.children[0]);
    var a1p=arrowX(0,Math.abs(v1p)*0.5,mArrowP);a1p.position.set(x1+0.4,0.5,0);arr1G.add(a1p);
    var a2p=arrowX(0,Math.abs(v2p)*0.5,mArrowP);a2p.position.set(x2+0.4,0.5,0);arr2G.add(a2p);
  }
}else{
  x1+=v1p*dt;x2+=v2p*dt;
  if(x1>5&&x2>5)rstData();
}
ball1M.position.set(x1,0,0);ball2M.position.set(x2,0,0);
for(var i=0;i<arr1G.children.length;i++)arr1G.children[i].position.set(x1+0.4,0.5,0);
for(var i=0;i<arr2G.children.length;i++)arr2G.children[i].position.set(x2+0.4,0.5,0);
O.update();R.render(S,C);}
requestAnimationFrame(anim);rstData();
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
