<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>科氏加速度演示</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:"Segoe UI","PingFang SC",sans-serif}
#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.88);padding:10px 16px;border-radius:8px;font-size:12px;line-height:1.7;backdrop-filter:blur(6px);border-left:4px solid #dc2626}
#hud b{color:#dc2626}.b{color:#2563eb}.g{color:#16a34a}.r{color:#dc2626}
#hint{position:absolute;bottom:16px;right:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style></head><body>
<div id="hud"><b>科氏加速度 a<sub>c</sub> = 2ω × v<sub>r</sub></b><br>转盘角速度 ω=<span class="b" id="vw">1.5 rad/s</span><br>滑块速度 v<sub>r</sub>=<span class="g" id="vv">0.8 m/s</span><br>科氏加速度 a<sub>c</sub>=<span class="r" id="va">--</span></div>
<div id="hint">蓝=牵连速度v<sub>e</sub> · 绿=相对速度v<sub>r</sub> · 红=科氏加速度a<sub>c</sub> · 黄螺旋=绝对轨迹</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">
import * as T from "three";import { OrbitControls } from "three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");S.fog=new T.Fog("#a4d3ee",5,25);
var C=new T.PerspectiveCamera(45,innerWidth/innerHeight,0.1,30);C.position.set(0,0,10);C.lookAt(0,0,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,0,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.0));
var dL=new T.DirectionalLight("#ffffff",4);dL.position.set(4,6,3);dL.castShadow=true;dL.shadow.mapSize.width=1024;dL.shadow.mapSize.height=1024;S.add(dL);
S.add(new T.DirectionalLight("#8899cc",1.5).position.set(-2,2,-2));
var mDisc=new T.MeshStandardMaterial({color:"#3b82f6",roughness:0.3,metalness:0.4});
var mRing=new T.MeshStandardMaterial({color:"#2563eb",roughness:0.2,metalness:0.6});
var mSlot=new T.MeshStandardMaterial({color:"#1e40af",roughness:0.5,metalness:0.3});
var mBlock=new T.MeshStandardMaterial({color:"#dc2626",roughness:0.25,metalness:0.55});
var mPillar=new T.MeshStandardMaterial({color:"#4a4f5a",roughness:0.55,metalness:0.5});
var mVe=new T.MeshStandardMaterial({color:"#3b82f6",roughness:0.1,emissive:"#3b82f6",emissiveIntensity:0.5});
var mVr=new T.MeshStandardMaterial({color:"#16a34a",roughness:0.1,emissive:"#16a34a",emissiveIntensity:0.5});
var mAc=new T.MeshStandardMaterial({color:"#dc2626",roughness:0.1,emissive:"#dc2626",emissiveIntensity:0.5});
var mTrail=new T.MeshBasicMaterial({color:"#fbbf24",transparent:true,opacity:0.6});
var omega=1.5;var vr=0.8;
var discG=new T.Group();S.add(discG);
var dGeom=new T.CylinderGeometry(3.0,3.0,0.1,64);
var dMesh=new T.Mesh(dGeom,mDisc);dMesh.position.z=-0.05;dMesh.castShadow=true;dMesh.receiveShadow=true;discG.add(dMesh);
var rGeom=new T.TorusGeometry(3.0,0.04,16,80);
var rMesh=new T.Mesh(rGeom,mRing);rMesh.rotation.x=Math.PI/2;rMesh.position.z=-0.02;discG.add(rMesh);
var slGeom=new T.BoxGeometry(5.8,0.08,0.06);
var slMesh=new T.Mesh(slGeom,mSlot);discG.add(slMesh);
var gl0=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl0.rotation.z=0;discG.add(gl0);
var gl1=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl1.rotation.z=0.7853981633974483;discG.add(gl1);
var gl2=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl2.rotation.z=1.5707963267948966;discG.add(gl2);
var gl3=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl3.rotation.z=2.356194490192345;discG.add(gl3);
var gl4=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl4.rotation.z=3.141592653589793;discG.add(gl4);
var gl5=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl5.rotation.z=3.9269908169872414;discG.add(gl5);
var gl6=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl6.rotation.z=4.71238898038469;discG.add(gl6);
var gl7=new T.Mesh(new T.BoxGeometry(5.5,0.02,0.02),mRing);gl7.rotation.z=5.497787143782138;discG.add(gl7);
var sliderG=new T.Group();discG.add(sliderG);
var blGeom=new T.BoxGeometry(0.3,0.15,0.15);
var blMesh=new T.Mesh(blGeom,mBlock);blMesh.position.z=0.12;sliderG.add(blMesh);
function arrow(r,height,colorMat){var g=new T.Group();
var sG=new T.CylinderGeometry(r*0.7,r*0.7,height*0.78,8);var sM=new T.Mesh(sG,colorMat);sM.position.z=height*0.39;g.add(sM);
var hG=new T.ConeGeometry(r*2.5,height*0.22,8);var hM=new T.Mesh(hG,colorMat);hM.position.z=height*0.89;g.add(hM);return g;}
var trailPtG=new T.BufferGeometry();var trailPts=[];var maxTrail=200;
var trailLine=new T.Line(trailPtG,new T.LineBasicMaterial({color:"#fbbf24",linewidth:1,transparent:true,opacity:0.6}));S.add(trailLine);
var trailDotsG=new T.Group();S.add(trailDotsG);
var pG1=new T.CylinderGeometry(0.10,0.14,0.6,8);
var pM1=new T.Mesh(pG1,mPillar);pM1.position.set(0,0,-0.6);pM1.castShadow=true;S.add(pM1);
S.add(new T.GridHelper(10,20,"#ccc","#e8e8e8"));
var ang=0;var time=0;
function anim(){requestAnimationFrame(anim);time+=0.016;
ang+=omega*0.016;discG.rotation.z=ang;
var rPos=0.5+vr*time%2.0;
sliderG.position.set(rPos,0,0.16);
var ac=2*omega*vr;
document.getElementById("vw").textContent=omega.toFixed(1)+" rad/s";
document.getElementById("vv").textContent=vr.toFixed(1)+" m/s";
document.getElementById("va").textContent=ac.toFixed(1)+" m/s²";
var absX=rPos*Math.cos(ang);var absY=rPos*Math.sin(ang);
trailPts.push(new T.Vector3(absX,absY,0.06));
if(trailPts.length>maxTrail)trailPts.shift();
var tGeom=new T.BufferGeometry().setFromPoints(trailPts);trailLine.geometry.dispose();trailLine.geometry=tGeom;
while(trailDotsG.children.length>0)trailDotsG.remove(trailDotsG.children[0]);
for(var k=0;k<trailPts.length;k+=10){
var dotGeom2=new T.SphereGeometry(0.025,4,4);
var dotMesh2=new T.Mesh(dotGeom2,mTrail);dotMesh2.position.copy(trailPts[k]);trailDotsG.add(dotMesh2);}
while(S.children.filter(function(c){return c.userData&&c.userData.isArrow;}).length>0){var arrs=S.children.filter(function(c){return c.userData&&c.userData.isArrow;});for(var ai=0;ai<arrs.length;ai++)S.remove(arrs[ai]);}
var veDir=new T.Vector3(-Math.sin(ang),Math.cos(ang),0);veDir.normalize();
var veLen=omega*rPos*0.5;
var veArrow=arrow(0.04,veLen,mVe);veArrow.userData={isArrow:true};veArrow.position.set(absX,absY,0.15);veArrow.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),veDir);S.add(veArrow);
var vrDir=new T.Vector3(Math.cos(ang),Math.sin(ang),0);
var vrLen=vr*0.5;
var vrArrow=arrow(0.04,vrLen,mVr);vrArrow.userData={isArrow:true};vrArrow.position.set(absX,absY,0.15);vrArrow.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),vrDir);S.add(vrArrow);
var acLen=ac*0.2;
var acArrow=arrow(0.05,acLen,mAc);acArrow.userData={isArrow:true};acArrow.position.set(absX,absY,0.15);acArrow.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),veDir);S.add(acArrow);
O.update();R.render(S,C);}anim();
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
