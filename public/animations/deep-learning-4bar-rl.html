<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四连杆检测机器人 · 深度强化学习控制探索</title>
<style>
:root{--bg:#0a0a14;--panel:rgba(20,22,38,0.82);--border:#2a2f4a;--text:#cdd6f4;--muted:#8787a0;--accent:#4ecdc4}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw;user-select:none}
canvas{display:block}
#stage-badge{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:8px 20px;color:var(--text);font-size:14px;font-weight:600;z-index:10;pointer-events:none;letter-spacing:0.5px}
#info{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:11px;opacity:0.5;z-index:10;pointer-events:none}
#hud{position:fixed;top:20px;right:20px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:12px 16px;z-index:10;font-size:11px;line-height:1.8;color:var(--text)}
#hud .val{color:var(--accent);font-variant-numeric:tabular-nums}
#dist{position:fixed;bottom:80px;right:20px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:10px 16px;z-index:10;text-align:center}
#dist .dv{font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
#dist .dl{font-size:10px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="stage-badge">阶段一：早期探索 (50k 次交互)</div>
<div id="hud">
  <div>θ₁ <span class="val" id="j1">0°</span></div>
  <div>θ₂ <span class="val" id="j2">0°</span></div>
  <div>θ₃ <span class="val" id="j3">0°</span></div>
  <div>θ₄ <span class="val" id="j4">0°</span></div>
  <div style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px">末端 <span class="val" id="ee-pos">(0,0)</span></div>
</div>
<div id="dist"><div class="dv" id="dist-val">0.0</div><div class="dl">距目标 (cm)</div></div>
<div id="info">拖拽旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Arm params ──
const L = [0.8, 0.65, 0.55, 0.45];
const LINK_COLORS = [0xf5a97f, 0xa6da95, 0xc4a0dc, 0x7dc4e4];
const JOINT_COLORS = [0xe63946, 0xf4a261, 0x9b6dff, 0x4ecdc4];
const TARGET = { x: 1.3, y: 0.7 };
const PHASE_DURATION = 10; // seconds per phase

// ── Pre-compute 4 phase trajectories ──
// Each phase has a series of joint angle keyframes
// Phase 1: random exploration → bumping around
// Phase 2: learning → getting closer but wobbling
// Phase 3: refining → smooth approach
// Phase 4: mastery → direct clean path

function ik4R(tx, ty) {
  // Simple CCD IK for 4R planar arm
  let a = [0.2, -0.8, 0.6, -0.3];
  for (let iter = 0; iter < 40; iter++) {
    for (let i = 3; i >= 0; i--) {
      // Compute current joint positions
      let cx = 0, cy = 0, ca = 0;
      for (let k = 0; k < i; k++) { ca += a[k]; cx += L[k] * Math.cos(ca); cy += L[k] * Math.sin(ca); }
      // End-effector
      let ex = cx, ey = cy; ca += a[i];
      for (let k = i; k < 4; k++) { ca += (k === i ? 0 : a[k]); ex += L[k] * Math.cos(ca); ey += L[k] * Math.sin(ca); }
      // Angle to EE
      let eeAng = Math.atan2(ey - cy, ex - cx);
      // Angle to target
      let tAng = Math.atan2(ty - cy, tx - cx);
      let delta = tAng - eeAng;
      while (delta > Math.PI) delta -= 2 * Math.PI;
      while (delta < -Math.PI) delta += 2 * Math.PI;
      a[i] += delta * 0.25;
    }
  }
  return a;
}

const ikTarget = ik4R(TARGET.x, TARGET.y);

function eePos(angles) {
  let x = 0, y = 0, cum = 0;
  for (let i = 0; i < 4; i++) { cum += angles[i]; x += L[i] * Math.cos(cum); y += L[i] * Math.sin(cum); }
  return [x, y];
}

// Pre-generate phase trajectories
function genPhase(ikSol, noiseLevel, smoothFactor) {
  const steps = 200;
  const traj = [];
  let angles = [0.0, -1.2, 1.0, -0.6]; // start from rest-ish
  for (let t = 0; t < steps; t++) {
    const progress = t / steps;
    // Blend toward IK solution
    for (let i = 0; i < 4; i++) {
      const target = ikSol[i];
      const noise = (Math.sin(t * 0.37 + i * 1.7) * Math.cos(t * 0.53 + i)) * noiseLevel;
      angles[i] += (target - angles[i]) * smoothFactor + noise * 0.15;
    }
    // Random target perturbation for early phases
    const [ex, ey] = eePos(angles);
    traj.push({ angles: [...angles], ee: [ex, ey], dist: Math.hypot(ex - TARGET.x, ey - TARGET.y) });
  }
  return traj;
}

const phases = [
  { name: '阶段一：早期探索 (50k 次交互)', traj: genPhase(ikTarget, 2.5, 0.03), color: '#e63946' },
  { name: '阶段二：中期学习 (100k 次交互)', traj: genPhase(ikTarget, 1.2, 0.06), color: '#f4a261' },
  { name: '阶段三：后期优化 (200k 次交互)', traj: genPhase(ikTarget, 0.4, 0.10), color: '#c4a0dc' },
  { name: '阶段四：最终策略 (500k 次交互)', traj: genPhase(ikTarget, 0.05, 0.18), color: '#4ecdc4' },
];

let phaseIdx = 0;
let frameIdx = 0;
let phaseTime = 0;

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.2, 50);
camera.position.set(2.5, 2.5, 3.8);
camera.lookAt(0.7, 0.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.7, 0.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.update();

// ── Lighting ──
scene.add(new THREE.AmbientLight(0x606080, 3));
const key = new THREE.DirectionalLight(0xffffff, 4);
key.position.set(3, 5, 6);
scene.add(key);
const back = new THREE.DirectionalLight(0x8899cc, 2);
back.position.set(-2, 1, -3);
scene.add(back);

// ── Ground plane ──
const gpGeo = new THREE.PlaneGeometry(8, 8);
const gpMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
const gp = new THREE.Mesh(gpGeo, gpMat);
gp.rotation.x = -Math.PI / 2;
gp.position.z = -0.02;
scene.add(gp);

const grid = new THREE.GridHelper(4, 20, 0x222244, 0x111122);
grid.position.z = -0.01;
scene.add(grid);

// ── Base ──
const baseGeo = new THREE.CylinderGeometry(0.1, 0.13, 0.3, 32);
const baseMesh = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x3a3a50, roughness: 0.3, metalness: 0.6 }));
baseMesh.position.z = -0.15;
scene.add(baseMesh);

// ── Target ──
const tgtGroup = new THREE.Group();
const tgtGeo = new THREE.SphereGeometry(0.08, 32, 32);
const tgtMat = new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.1, emissive: 0xff6b35, emissiveIntensity: 0.7 });
const tgtMesh = new THREE.Mesh(tgtGeo, tgtMat);
tgtGroup.add(tgtMesh);
// Pulsing ring
const ringGeo = new THREE.TorusGeometry(0.14, 0.015, 16, 32);
const ringMat = new THREE.MeshStandardMaterial({ color: 0xff6b35, roughness: 0.2, emissive: 0xff6b35, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
const ring = new THREE.Mesh(ringGeo, ringMat);
tgtGroup.add(ring);
tgtGroup.position.set(TARGET.x, TARGET.y, 0.01);
scene.add(tgtGroup);

// ── Build arm ──
const jointSpheres = [];
const linkGroups = [];
for (let i = 0; i < 4; i++) {
  const jsGeo = new THREE.SphereGeometry(0.06, 24, 24);
  const jsMesh = new THREE.Mesh(jsGeo, new THREE.MeshStandardMaterial({ color: JOINT_COLORS[i], roughness: 0.2, metalness: 0.4, emissive: JOINT_COLORS[i], emissiveIntensity: 0.4 }));
  jsMesh.position.z = 0.01;
  scene.add(jsMesh);
  jointSpheres.push(jsMesh);

  const lg = new THREE.Group();
  const boxGeo = new THREE.BoxGeometry(L[i], 0.08, 0.08);
  const box = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color: LINK_COLORS[i], roughness: 0.3, metalness: 0.3 }));
  box.position.set(L[i] / 2, 0, 0);
  lg.add(box);
  // End cap
  const capGeo = new THREE.SphereGeometry(0.04, 16, 16);
  const cap = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({ color: JOINT_COLORS[i], roughness: 0.2, metalness: 0.4 }));
  cap.position.set(L[i], 0, 0);
  lg.add(cap);
  scene.add(lg);
  linkGroups.push(lg);
}

// End-effector ball
const eeGeo = new THREE.SphereGeometry(0.09, 32, 32);
const eeMesh = new THREE.Mesh(eeGeo, new THREE.MeshStandardMaterial({ color: 0x4ecdc4, roughness: 0.1, metalness: 0.5, emissive: 0x4ecdc4, emissiveIntensity: 0.6 }));
eeMesh.position.z = 0.02;
scene.add(eeMesh);

// ── Trail ──
const MAX_TRAIL = 200;
const trailArr = new Float32Array(MAX_TRAIL * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailArr, 3));
const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.5 }));
trailLine.position.z = 0.02;
scene.add(trailLine);
let trailPtr = 0;

function addTrailPoint(x, y) {
  trailArr[trailPtr * 3] = x;
  trailArr[trailPtr * 3 + 1] = y;
  trailArr[trailPtr * 3 + 2] = 0;
  trailPtr = (trailPtr + 1) % MAX_TRAIL;
  trailGeo.attributes.position.needsUpdate = true;
  // Set draw range
  trailGeo.setDrawRange(0, Math.min(MAX_TRAIL, trailPtr + (trailPtr < phaseIdx * 50 ? MAX_TRAIL : 0)));
}

// ── Update arm ──
function updateArm(angles) {
  let cum = 0, px = 0, py = 0;
  for (let i = 0; i < 4; i++) {
    jointSpheres[i].position.set(px, py, 0.01);
    linkGroups[i].position.set(px, py, 0);
    cum += angles[i];
    linkGroups[i].rotation.set(0, 0, cum);
    px += L[i] * Math.cos(cum);
    py += L[i] * Math.sin(cum);
  }
  eeMesh.position.set(px, py, 0.02);
  return [px, py];
}

// ── Animation loop ──
const clock = new THREE.Clock();
let elapsedInPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsedInPhase += dt;

  if (elapsedInPhase >= PHASE_DURATION) {
    elapsedInPhase -= PHASE_DURATION;
    phaseIdx = (phaseIdx + 1) % 4;
    frameIdx = 0;
    // Clear trail for new phase
    trailPtr = 0;
    for (let i = 0; i < MAX_TRAIL; i++) { trailArr[i * 3 + 2] = -99; }
  }

  const phase = phases[phaseIdx];
  const progress = elapsedInPhase / PHASE_DURATION;
  frameIdx = Math.min(Math.floor(progress * phase.traj.length), phase.traj.length - 1);
  const frame = phase.traj[frameIdx];

  const [ex, ey] = updateArm(frame.angles);

  // Trail every 3 frames
  if (frameIdx % 3 === 0) addTrailPoint(ex, ey);

  // Animate target ring
  ring.rotation.x += dt * 1.2;
  ring.rotation.y += dt * 0.7;
  ring.scale.setScalar(1 + Math.sin(elapsedInPhase * 3) * 0.15);

  // Update HUD
  document.getElementById('stage-badge').textContent = phase.name;
  document.getElementById('stage-badge').style.color = phase.color;
  for (let i = 0; i < 4; i++) {
    document.getElementById('j' + (i + 1)).textContent = (frame.angles[i] * 180 / Math.PI).toFixed(1) + '°';
  }
  document.getElementById('ee-pos').textContent =
    '(' + (ex * 100).toFixed(1) + ', ' + (ey * 100).toFixed(1) + ') cm';
  document.getElementById('dist-val').textContent = (frame.dist * 100).toFixed(1);

  controls.update();
  renderer.render(scene, camera);
}

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Kick off
animate();
</script>
</body>
</html>
