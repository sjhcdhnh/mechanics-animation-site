<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>摩擦锥与自锁 · 摩擦演示</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:16px;color:#e0e6f8;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.85);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.7;backdrop-filter:blur(4px);min-width:220px}
#hud b{color:#f5e0dc}#hud .g{color:#a6e3a1}#hud .r{color:#f38ba8}
#params{position:absolute;top:12px;right:16px;padding:12px 16px;background:rgba(20,22,38,0.85);border:1px solid #2a2f4a;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(4px);min-width:200px}
#params input{width:90px;accent-color:#a78bfa;vertical-align:middle}#params span.v{color:#a78bfa;font-weight:600;min-width:28px;display:inline-block;text-align:right}
#params button{width:100%;margin-top:4px;padding:6px 0;border-radius:6px;border:1px solid #a78bfa;background:rgba(167,139,250,.1);color:#a78bfa;font-size:12px;cursor:pointer;transition:all .2s}
#params button:hover{background:rgba(167,139,250,.2)}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.7}
.sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15)}
#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8}
</style></head>
<body>
<div id="title">摩擦锥与自锁</div>
<div id="hud"><b>摩擦锥与自锁</b><br>μ=<span style="color:#a78bfa" id="v-mu">0.50</span> 摩擦角 φ=<span style="color:#f9a8d4" id="v-phi">--</span><br>推力角 α=<span style="color:#89b4fa" id="v-a">15°</span> 推力P=<span id="v-p">8</span><br>状态: <b id="v-state" class="g">自锁（不动）</b><br><span style="font-size:10px;color:#71717a">推力在锥内→自锁 | 锥外→滑动</span></div>
<div id="params">
  <div>摩擦系数 μ <input type="range" id="s-mu" min="10" max="100" value="50" step="1"> <span class="v" id="l-mu">0.50</span></div>
  <div>推力角 α <input type="range" id="s-a" min="0" max="70" value="15" step="1"> <span class="v" id="l-a">15°</span></div>
  <div>推力大小 P <input type="range" id="s-p" min="2" max="15" value="8" step="1"> <span class="v" id="l-p">8</span></div>
  <button onclick="toggleDemo()" id="btn-demo">▶ 自动扫描演示</button>
  <button onclick="resetAnim()">⟳ 复位</button>
</div>
<div id="legend"><span class="sw" style="background:#f9a8d4"></span>摩擦锥(半角φ) <span class="sw" style="background:#f5e0dc"></span>重力mg <span class="sw" style="background:#89b4fa"></span>推力P <span class="sw" style="background:#f38ba8"></span>合力R <span class="sw" style="background:#a6e3a1"></span>法向力N+摩擦f</div>
<div id="hint">调μ和α→观察推力是否落在锥内 · 拖拽旋转视角</div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#0a0a14');S.fog=new T.Fog('#0a0a14',7,20);
const C=new T.PerspectiveCamera(40,innerWidth/innerHeight,.3,16);C.position.set(3,3,6);C.lookAt(0,.5,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,.6,0);O.enableDamping=true;O.minPolarAngle=.2;O.maxPolarAngle=1.4;O.update();
S.add(new T.AmbientLight('#404060',2.5));const L=new T.DirectionalLight('#fff',5);L.position.set(4,7,4);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.camera.far=20;S.add(L);
S.add(new T.DirectionalLight('#8899cc',1.5).position.set(-3,3,-3));

const ground=new T.Mesh(new T.BoxGeometry(4.5,.06,2.5),new T.MeshStandardMaterial({color:'#3a3a48',metalness:.2,roughness:.8}));ground.position.y=-.65;ground.receiveShadow=true;S.add(ground);
const grid=new T.GridHelper(6,12,'#2a2f4a','#1a1f2e');grid.position.y=-.6;S.add(grid);

const blkW=1,blkH=.7,blkD=.5;
const block=new T.Mesh(new T.BoxGeometry(blkW,blkH,blkD),new T.MeshStandardMaterial({color:'#cba6f7',metalness:.1,roughness:.5}));
block.position.y=blkH/2;block.castShadow=true;S.add(block);

const coneG=new T.Group(),arrowG=new T.Group();S.add(coneG);S.add(arrowG);

function arrow(from,to,color,r=.022){
  const d=new T.Vector3().subVectors(to,from);const len=d.length();if(len<.01)return new T.Group();const g=new T.Group();
  const shaftH=len*.78;
  const shaft=new T.Mesh(new T.CylinderGeometry(r,r*.85,shaftH,10),new T.MeshStandardMaterial({color,metalness:.1,roughness:.4,emissive:color,emissiveIntensity:.3}));
  shaft.position.y=shaftH/2;g.add(shaft);
  const head=new T.Mesh(new T.ConeGeometry(r*2.6,r*4,10),new T.MeshStandardMaterial({color,metalness:.1,roughness:.4,emissive:color,emissiveIntensity:.4}));
  head.position.y=shaftH;g.add(head);
  g.position.copy(from);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return g;}

let demoMode=false,demoPhase=0; // 0=sweep alpha up, 1=hold locked, 2=sweep down
let demoAngle=0;

function buildScene(mu,aDeg,P){
  while(coneG.children.length)coneG.remove(coneG.children[0]);
  while(arrowG.children.length)arrowG.remove(arrowG.children[0]);

  const phi=Math.atan(mu),aRad=aDeg*Math.PI/180;
  document.getElementById('l-mu').textContent=mu.toFixed(2);document.getElementById('v-mu').textContent=mu.toFixed(2);
  document.getElementById('l-a').textContent=aDeg+'°';document.getElementById('v-a').textContent=aDeg+'°';
  document.getElementById('l-p').textContent=P;document.getElementById('v-p').textContent=P;
  document.getElementById('v-phi').textContent=(phi*180/Math.PI).toFixed(1)+'°';
  const locked=aRad<=phi+.001;
  document.getElementById('v-state').textContent=locked?'自锁（不动）':'滑动！';
  document.getElementById('v-state').className=locked?'g':'r';

  // Friction cone — from contact point, upward, half-angle phi
  const coneH=2.2,coneR=coneH*Math.tan(phi);
  // Wireframe edges
  const cGeo=new T.CylinderGeometry(0,coneR,coneH,40,1,true);
  const edges=new T.EdgesGeometry(cGeo);
  const wire=new T.LineSegments(edges,new T.LineBasicMaterial({color:locked?'#f9a8d4':'#f38ba8',transparent:true,opacity:.55}));
  wire.position.y=coneH/2;coneG.add(wire);
  // Semi-transparent solid
  const solid=new T.Mesh(cGeo,new T.MeshBasicMaterial({color:'#f9a8d4',transparent:true,opacity:.07,side:T.DoubleSide,depthWrite:false}));
  solid.position.y=coneH/2;coneG.add(solid);

  // Key lines: cone boundaries (2 lines in XZ plane, sweep to get envelope feel)
  for(let ang=0;ang<Math.PI*2;ang+=Math.PI/12){
    const dx=Math.sin(phi)*Math.cos(ang)*coneH,dz=Math.sin(phi)*Math.sin(ang)*coneH;
    const top=new T.Vector3(dx,coneH,dz);const bot=new T.Vector3(0,0,0);
    const lineGeo=new T.BufferGeometry().setFromPoints([bot,top]);
    coneG.add(new T.Line(lineGeo,new T.LineBasicMaterial({color:'#f9a8d4',transparent:true,opacity:.15})));
  }

  const contact=new T.Vector3(0,0,0),center=new T.Vector3(0,blkH/2,0);
  // Gravity
  arrowG.add(arrow(center.clone(),new T.Vector3(0,-1.0,0),'#f5e0dc',.025));
  // Normal force + friction resultant from contact
  arrowG.add(arrow(contact.clone(),new T.Vector3(0,.8,0),'#a6e3a1',.02));
  // Push force P — from center, at angle alpha from vertical
  const pDir=new T.Vector3(Math.sin(aRad),Math.cos(aRad),0);
  const pLen=.3+P*.08;
  arrowG.add(arrow(center.clone(),center.clone().add(pDir.clone().multiplyScalar(pLen)),locked?'#89b4fa':'#f38ba8',.025));
  // If sliding: show result animation
  if(!locked){
    const slideDir=new T.Vector3(Math.sin(aRad),0,0);
    block.position.x=(P-mu*2)*.03; // slide offset proportional to net force
  }else{block.position.x=0;}
}

function resetAnim(){demoMode=false;demoAngle=0;document.getElementById('btn-demo').textContent='▶ 自动扫描演示';buildScene(+document.getElementById('s-mu').value/100,+document.getElementById('s-a').value,+document.getElementById('s-p').value);}
window.resetAnim=resetAnim;
window.toggleDemo=function(){
  demoMode=!demoMode;demoAngle=+document.getElementById('s-a').value;demoPhase=0;
  document.getElementById('btn-demo').textContent=demoMode?'⏸ 停止演示':'▶ 自动扫描演示';
};

document.querySelectorAll('#params input').forEach(el=>{if(el.id!=='s-a')el.addEventListener('input',resetAnim);});
document.getElementById('s-a').addEventListener('input',()=>{if(!demoMode)resetAnim();});

let lastT=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=(now-lastT)/1000;lastT=now;
  if(demoMode){
    const speed=30; // deg/s
    if(demoPhase===0){demoAngle+=speed*dt;if(demoAngle>=70){demoAngle=70;demoPhase=1;}} // sweep up
    else if(demoPhase===1){setTimeout(()=>{demoPhase=2;},800);} // pause
    else{demoAngle-=speed*dt;if(demoAngle<=0){demoAngle=0;demoPhase=0;}} // sweep back
    document.getElementById('s-a').value=Math.round(demoAngle);
    document.getElementById('l-a').textContent=Math.round(demoAngle)+'°';
    buildScene(+document.getElementById('s-mu').value/100,demoAngle,+document.getElementById('s-p').value);
  }
  O.update();R.render(S,C);
}
resetAnim();
lastT=performance.now();
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
