<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>斜面物块 · 滑动 vs 翻转</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4}
#hud{position:absolute;top:14px;left:14px;padding:10px 14px;background:rgba(20,22,38,.88);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.65;backdrop-filter:blur(4px);pointer-events:none}
#hud b{color:#f5e0dc}#hud .g{color:#a6e3a1}#hud .y{color:#f9a8d4}#hud .r{color:#f38ba8}
#p{position:absolute;top:14px;right:16px;padding:10px 14px;background:rgba(20,22,38,.88);border:1px solid #2a2f4a;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(4px)}
#p input{width:130px;accent-color:#a78bfa}#p span.v{color:#a78bfa;font-weight:600}
#p button{width:100%;margin-top:3px;padding:5px;border-radius:6px;border:1px solid #a78bfa;background:rgba(167,139,250,.08);color:#a78bfa;font-size:12px;cursor:pointer}
#leg{position:absolute;bottom:16px;left:14px;padding:8px 12px;background:rgba(20,22,38,.75);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;line-height:1.6}
#leg i{display:inline-block;width:12px;height:6px;margin-right:4px;border-radius:1px;vertical-align:middle;border:1px solid rgba(255,255,255,.15)}
#hint{position:absolute;bottom:16px;right:14px;padding:6px 10px;background:rgba(20,22,38,.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8}
</style></head>
<body>
<div id="hud"><b>斜面物块 · 滑动 vs 翻转</b><br>θ=30° &nbsp; tanθ=0.577 &nbsp; b/h=0.50<br>μ=<span class="y" id="vmu">0.80</span> &nbsp; 状态: <b id="vst" class="r">翻转 ↺</b></div>
<div id="p">μ <input type="range" id="smu" min="5" max="100" value="80" step="1"> <span class="v" id="lmu">0.80</span><br><button onclick="rst()">⟳ 复位重播</button></div>
<div id="leg"><i style="background:#f5e0dc"></i>重力 <i style="background:#89b4fa"></i>法向力N <i style="background:#f38ba8"></i>摩擦力f</div>
<div id="hint">μ&lt;0.577→下滑 &nbsp; μ&gt;0.577→翻转 &nbsp; 拖拽旋转|复位</div>

<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';

// ─── Scene ───
const S=new T.Scene();S.background=new T.Color('#0a0a14');
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.5,18);C.position.set(3,2.2,7.5);C.lookAt(1.2,0.6,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(1.2,0.6,0);O.enableDamping=true;O.update();
S.add(new T.AmbientLight('#505070',2.5));
const sun=new T.DirectionalLight('#fff',5);sun.position.set(6,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.far=22;S.add(sun);
S.add(new T.DirectionalLight('#8899cc',1.5).position.set(-3,3,-2));

// ─── 物理常量 ───
const rad=Math.PI/180, A=30*rad, SA=Math.sin(A), CA=Math.cos(A), TA=Math.tan(A);
const RL=3.5; // 斜面长度
const BW=0.6, BH=1.2, BD=0.5; // 物块宽/高/深
const bhr=BW/BH; // 0.50

// ─── 世界空间: 铰链原点(0,0,0), 斜面从原点延展, 地面 y=-2.3 ───
const FLY=-2.3;

// 地面
const fl=new T.Mesh(new T.BoxGeometry(7,.06,3),new T.MeshStandardMaterial({color:'#3a3a48',roughness:.8}));
fl.position.y=FLY;fl.receiveShadow=true;S.add(fl);
S.add(new T.GridHelper(10,20,'#2a2f4a','#1a1f2e').translateY(FLY+0.04));


// ─── rampGroup: 原点=铰链, 绕Z轴转-A使斜面在局部Y=0平面上 ───
const gRamp=new T.Group();S.add(gRamp);
gRamp.rotation.z=-A;

// 斜面板(局部Y=0平面, 从X=0到X=RL)
gRamp.add(new T.Mesh(new T.BoxGeometry(RL,.05,1.8),new T.MeshStandardMaterial({color:'#5a5a6e',metalness:.2,roughness:.7})).translateX(RL/2).translateY(0));
// 左挡墙
gRamp.add(new T.Mesh(new T.BoxGeometry(.05,.30,1.8),new T.MeshStandardMaterial({color:'#6a6a76',metalness:.3,roughness:.5})).translateY(.15));
// 铰链销
gRamp.add(new T.Mesh(new T.CylinderGeometry(.04,.04,1.9,12),new T.MeshStandardMaterial({color:'#999',metalness:.7,roughness:.3})).rotateX(Math.PI/2));

// ─── 物块(rampGroup局部) ───
// 物块底部在斜面Y=0, 中心在Y=BH/2
const blockX=RL*.55; // 物块沿斜面位置
const blkMat=new T.MeshStandardMaterial({color:'#cba6f7',metalness:.1,roughness:.5});
const blkGeo=new T.BoxGeometry(BW,BH,BD);

// 物块用pivot组: pivot在物块左下角(接触边), block相对pivot
const gPivot=new T.Group();gRamp.add(gPivot);
gPivot.position.set(blockX+BW/2, 0, 0); // pivot在下侧接触棱(翻转转轴)

const blk=new T.Mesh(blkGeo,blkMat);blk.castShadow=true;blk.receiveShadow=true;
blk.position.set(-BW/2, BH/2, 0); // pivot在右下角, 中心在pivot左上方
gPivot.add(blk);

// ─── 状态机 ───
let aid=0,ts=0,mu=.8;

function rst(){
  aid++;const id=aid;ts=performance.now();mu=+document.getElementById('smu').value/100;
  document.getElementById('lmu').textContent=mu.toFixed(2);document.getElementById('vmu').textContent=mu.toFixed(2);

  // 复位
  gPivot.position.set(blockX+BW/2,0,0);gPivot.rotation.set(0,0,0);

  // 判断
  const slide=mu<TA-.003; // μ<0.574
  document.getElementById('vst').textContent=slide?'沿斜面下滑 ↓':'翻转 ↺';
  document.getElementById('vst').style.color=slide?'#f9a8d4':'#f38ba8';

  // 动画
  if(slide){
    (function L(now){if(aid!==id)return;const t=(now-ts)/1000,f=Math.min(t/1.3,1);
      gPivot.position.x=blockX+BW/2 + f*f*1.3;gPivot.rotation.set(0,0,0);
      if(f<1)requestAnimationFrame(L);})(ts);
  }else{
    (function L(now){if(aid!==id)return;const t=(now-ts)/1000,f=Math.min(t/1.5,1);
      gPivot.rotation.set(0,0,-f*f*(Math.PI/2)); // 绕Z轴负向翻转到底
      if(f<1)requestAnimationFrame(L);})(ts);
  }
}
window.rst=rst;
document.getElementById('smu').addEventListener('input',rst);
rst();

// ─── Loop ───
(function a(){requestAnimationFrame(a);O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
