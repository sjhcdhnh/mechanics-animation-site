<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>斜面物块 · 滑动 vs 翻转 · 摩擦演示</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:16px;color:#e0e6f8;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.8);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.7;backdrop-filter:blur(4px);min-width:220px}
#hud b{color:#f5e0dc}#hud .ok{color:#a6e3a1}#hud .warn{color:#f9a8d4}#hud .danger{color:#f38ba8}
#params{position:absolute;top:12px;right:16px;padding:12px 16px;background:rgba(20,22,38,0.8);border:1px solid #2a2f4a;border-radius:8px;font-size:11px;line-height:2;backdrop-filter:blur(4px);min-width:200px}
#params input{width:100px;accent-color:#a78bfa;vertical-align:middle}
#params span.val{color:#a78bfa;font-weight:600;min-width:30px;display:inline-block}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.7}
.sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15)}
#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8}
</style></head>
<body>
<div id="title">斜面物块 · 滑动 vs 翻转</div>
<div id="hud">
  <b>斜面物块 · 摩擦</b><br>
  <span>倾角 θ: <span style="color:#a78bfa" id="v-angle">30°</span></span><br>
  <span>状态: <b id="v-state" class="ok">静止</b></span><br>
  <span>下滑临界: tanθ <span id="v-tan">--</span> vs μ=<span id="v-mu">0.40</span></span><br>
  <span>翻转临界: tanθ vs b/h=<span id="v-bh">0.50</span></span><br>
</div>
<div id="params">
  <div>倾角 θ <input type="range" id="s-angle" min="5" max="60" value="30" step="1"> <span class="val" id="l-angle">30°</span></div>
  <div>摩擦系数 μ <input type="range" id="s-mu" min="10" max="100" value="40" step="1"> <span class="val" id="l-mu">0.40</span></div>
  <div>块宽 b <input type="range" id="s-b" min="3" max="15" value="6" step="1"> <span class="val" id="l-b">0.6</span></div>
  <div>块高 h <input type="range" id="s-h" min="3" max="15" value="12" step="1"> <span class="val" id="l-h">1.2</span></div>
</div>
<div id="legend">
  <span class="sw" style="background:#f5e0dc"></span>重力 mg
  <span class="sw" style="background:#89b4fa"></span>法向力 N
  <span class="sw" style="background:#f38ba8"></span>摩擦力 f
  <span class="sw" style="background:#4ecdc4"></span>翻转力矩
</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 右上面板调参数</div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#0a0a14');S.fog=new T.Fog('#0a0a14',8,25);
const C=new T.PerspectiveCamera(40,innerWidth/innerHeight,.5,20);C.position.set(4,3,8);C.lookAt(0,.5,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,.5,0);O.enableDamping=true;O.minPolarAngle=.2;O.maxPolarAngle=1.4;O.update();
S.add(new T.AmbientLight('#404060',2.5));const L=new T.DirectionalLight('#fff',5);L.position.set(6,8,5);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.camera.far=25;L.shadow.camera.left=-6;L.shadow.camera.right=6;L.shadow.camera.top=5;L.shadow.camera.bottom=-3;S.add(L);
S.add(new T.DirectionalLight('#8899cc',1.5).position.set(-3,3,-3));
S.add(new T.GridHelper(10,20,'#2a2f4a','#1a1f2e').translateY(-1.8));

// Dynamic objects
const inclineG=new T.Group(),blockG=new T.Group(),arrowG=new T.Group();
S.add(inclineG);S.add(blockG);S.add(arrowG);

function makePlane(w,h,color){const g=new T.BoxGeometry(w,.04,h);const m=new T.MeshStandardMaterial({color,metalness:.2,roughness:.7});const mesh=new T.Mesh(g,m);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
function makeBlock(w,h,d,color){const g=new T.BoxGeometry(w,h,d);const m=new T.MeshStandardMaterial({color,metalness:.1,roughness:.6});const mesh=new T.Mesh(g,m);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
function arrow(from,to,color,r=.03){const d=new T.Vector3().subVectors(to,from);const len=d.length();if(len<.001)return new T.Group();const g=new T.Group();
  const shaft=new T.Mesh(new T.CylinderGeometry(r,r,len*.85,8),new T.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.4}));
  shaft.position.y=len*.425;g.add(shaft);
  const head=new T.Mesh(new T.ConeGeometry(r*2.5,r*4,8),new T.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.5}));
  head.position.y=len*.85;g.add(head);
  g.position.copy(from);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());return g;}

const blkD=.6;
function update(){
  const aDeg=+document.getElementById('s-angle').value;const aRad=aDeg*Math.PI/180;
  const mu=+document.getElementById('s-mu').value/100;
  const bw=+document.getElementById('s-b').value/10,bh=+document.getElementById('s-h').value/10; // b=width, h=height
  document.getElementById('l-angle').textContent=aDeg+'°';document.getElementById('v-angle').textContent=aDeg+'°';
  document.getElementById('l-mu').textContent=mu.toFixed(2);document.getElementById('v-mu').textContent=mu.toFixed(2);
  document.getElementById('l-b').textContent=bw.toFixed(1);document.getElementById('l-h').textContent=bh.toFixed(1);
  document.getElementById('v-tan').textContent=Math.tan(aRad).toFixed(3);
  document.getElementById('v-bh').textContent=(bw/bh).toFixed(2);

  const tanA=Math.tan(aRad),bhR=bw/bh;
  const slide=tanA>mu+1e-6,tip=tanA>bhR+1e-6;
  let state,cls;if(tip&&slide){state=bhR<mu?'翻转(先于滑动)':'滑动(先于翻转)';cls='danger';}else if(tip){state='翻转';cls='danger';}else if(slide){state='滑动';cls='warn';}else{state='静止';cls='ok';}
  document.getElementById('v-state').textContent=state;document.getElementById('v-state').className=cls;

  // Clear and rebuild
  while(inclineG.children.length)inclineG.remove(inclineG.children[0]);
  while(blockG.children.length)blockG.remove(blockG.children[0]);
  while(arrowG.children.length)arrowG.remove(arrowG.children[0]);

  // Inclined plane — rotate so ramp is at angle aRad, pivot at left edge
  const rampLen=3.5,rampW=2;
  inclineG.rotation.z=-aRad;
  const ramp=makePlane(rampLen,rampW,'#5a5a6e');ramp.position.set(rampLen/2,-.02,0);inclineG.add(ramp);
  // Base support (triangle)
  const baseGeo=new T.BoxGeometry(.1,rampLen*Math.sin(aRad),rampW);
  const base=new T.Mesh(baseGeo,new T.MeshStandardMaterial({color:'#4a4a58',metalness:.3,roughness:.6}));
  base.position.set(-.02,rampLen*Math.sin(aRad)/2,0);base.castShadow=true;inclineG.add(base);
  // Surface grid lines on ramp
  for(let i=0;i<6;i++){const x=i*rampLen/5,line=new T.Mesh(new T.BoxGeometry(.005,.01,rampW),new T.MeshStandardMaterial({color:'#666'}));line.position.set(x,.02,0);inclineG.add(line);}

  // Block — positioned on incline, rotated to stay upright (not aligned with incline)
  const cx=rampLen/2+.3; // center position along incline
  const bx=cx*Math.cos(aRad),by=cx*Math.sin(aRad);
  const block=makeBlock(bw,bh,blkD,'#cba6f7');
  block.position.set(bx,by+bh/2*Math.cos(aRad),0);
  block.rotation.z=0; // block stays upright, doesn't rotate with incline
  blockG.add(block);

  // Actually block sits ON the incline — so it tilts with the incline
  block.rotation.z=-aRad;
  const sx=cx-bh/2*Math.sin(aRad),sy=bh/2*Math.cos(aRad);
  block.position.set(sx,sy,0);
  // Nope, let me just place it simply: position above incline, rotated to match
  block.position.set(cx,0,0); // local to incline group
  // Actually let me put the block in the incline group so it rotates automatically
  inclineG.add(block);blockG.remove(block);

  // Force arrows (in world space, not incline-rotated)
  const wbx=cx*Math.cos(aRad),wby=cx*Math.sin(aRad);
  const gForce=new T.Vector3(0,-2,0); // gravity
  const normalDir=new T.Vector3(-Math.sin(aRad),Math.cos(aRad),0); // perpendicular to incline (up)
  const tangentDir=new T.Vector3(Math.cos(aRad),Math.sin(aRad),0); // down the incline

  const blockCenter=new T.Vector3(wbx,wby+bh/2,0);
  const contactPt=new T.Vector3(wbx-bh/2*Math.sin(aRad),wby+bh/2*Math.cos(aRad),0);

  // Normal force from contact point upward
  const normEnd=contactPt.clone().add(normalDir.clone().multiplyScalar(1.5));
  arrowG.add(arrow(contactPt.clone(),normEnd,'#89b4fa',.025));

  // Friction along incline (opposing sliding)
  const fricEnd=contactPt.clone().add(tangentDir.clone().multiplyScalar(-1.0));
  arrowG.add(arrow(contactPt.clone(),fricEnd,'#f38ba8',.025));

  // Gravity from block center
  const gravEnd=blockCenter.clone().add(gForce);
  arrowG.add(arrow(blockCenter.clone(),gravEnd,'#f5e0dc',.03));

  // If tipping: show moment arrow at pivot edge
  if(tip){const pivotPt=contactPt.clone().add(new T.Vector3(-bw/2*Math.cos(aRad),-bw/2*Math.sin(aRad),0));
    const momDir=new T.Vector3(0,0,1);arrowG.add(arrow(pivotPt,pivotPt.clone().add(momDir.multiplyScalar(.8)),'#4ecdc4',.02));}
}

update();
document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',update));

(function a(){requestAnimationFrame(a);O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
