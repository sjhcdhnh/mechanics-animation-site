<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日内瓦机构 · 间歇运动</title>
<style>
body{margin:0;overflow:hidden;background:#1a1d24;font-family:"Segoe UI","PingFang SC",sans-serif}
#info{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.6);color:#eee;padding:8px 15px;border-radius:8px;backdrop-filter:blur(8px);pointer-events:none;z-index:10;font-size:14px;border-left:4px solid #ffaa33}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div id="info">
  <span class="dot" style="background:#3a7bd5"></span>主动轮 匀速转动 &nbsp;
  <span class="dot" style="background:#e63946"></span>从动槽轮 间歇转 &nbsp;
  <span class="dot" style="background:#f4d03f"></span>驱动销 &nbsp; 4槽·90°/步
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}
</script>
<script type="module">
import * as T from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new T.Scene();
scene.background = new T.Color("#1a1d24");

const camera = new T.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 30);
camera.position.set(0, 0, 9);
camera.lookAt(0, 0, 0);

const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.update();

scene.add(new T.AmbientLight("#3a4050", 2.2));
scene.add(new T.HemisphereLight("#b0c0d8", "#282e3a", 1.6));
const keyLight = new T.DirectionalLight("#ffffff", 5.5);
keyLight.position.set(6, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);
scene.add(new T.DirectionalLight("#8a9bb5", 2.0).position.set(-3, 2, -3));
scene.add(new T.DirectionalLight("#5a6b82", 1.8).position.set(0, -2, 2));

var grid = new T.GridHelper(10, 16, "#3a3f4a", "#252830");
grid.position.y = -3;
scene.add(grid);

var ground = new T.Mesh(
  new T.PlaneGeometry(12, 12),
  new T.MeshStandardMaterial({ color: "#1e2128", roughness: 0.9, metalness: 0.15 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.1;
ground.receiveShadow = true;
scene.add(ground);

// ── Common materials ──
var mBlue = new T.MeshStandardMaterial({ color: "#3a7bd5", roughness: 0.25, metalness: 0.55 });
var mRed = new T.MeshStandardMaterial({ color: "#e63946", roughness: 0.25, metalness: 0.55 });
var mGold = new T.MeshStandardMaterial({ color: "#f4d03f", roughness: 0.2, metalness: 0.85 });
var mDark = new T.MeshStandardMaterial({ color: "#4a4f5a", roughness: 0.55, metalness: 0.5 });

var Cd = 1.9;
var dR = 0.6;
var gR = 1.0;
var slots = 4;
var pinDist = 0.78;
var pinR = 0.09;

// ── Driver (blue, left side) ──
var dG = new T.Group();
dG.position.set(-Cd, 0, 0);
scene.add(dG);

var dShape = new T.Shape();
dShape.absarc(0, 0, dR, 0, Math.PI * 2, false);
dShape.holes.push(new T.Path().absellipse(0, 0, 0.14, 0.14, 0, Math.PI * 2, true));
var dMesh = new T.Mesh(new T.ExtrudeGeometry(dShape, { steps: 1, depth: 0.12, bevelEnabled: false }), mBlue);
dMesh.position.z = -0.06;
dMesh.castShadow = true;
dG.add(dMesh);

var lkShape = new T.Shape();
lkShape.absarc(0, 0, dR + 0.08, 0.5, 5.8, false);
lkShape.absarc(0, 0, dR - 0.04, 5.8, 0.5, true);
var lkMesh = new T.Mesh(new T.ExtrudeGeometry(lkShape, { steps: 1, depth: 0.08, bevelEnabled: false }), mBlue);
lkMesh.position.z = 0.04;
dG.add(lkMesh);

var dHub = new T.Mesh(new T.CylinderGeometry(0.55, 0.55, 0.14, 24), mGold);
dHub.position.z = 0.08;
dG.add(dHub);

var pin = new T.Mesh(new T.CylinderGeometry(pinR, pinR, 0.18, 24), mGold);
pin.rotation.x = Math.PI / 2;
dG.add(pin);

var dShaft = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.45, 10), mDark);
dShaft.position.z = 0.18;
dG.add(dShaft);

// ── Geneva wheel (red, right side) ──
var gG = new T.Group();
gG.position.set(Cd, 0, 0);
scene.add(gG);

var gSh = new T.Shape();
gSh.absarc(0, 0, gR, 0, Math.PI * 2, false);
gSh.holes.push(new T.Path().absellipse(0, 0, 0.16, 0.16, 0, Math.PI * 2, true));
var gMesh = new T.Mesh(new T.ExtrudeGeometry(gSh, { steps: 1, depth: 0.12, bevelEnabled: false }), mRed);
gMesh.position.z = -0.06;
gMesh.castShadow = true;
gG.add(gMesh);

for (var i = 0; i < slots; i++) {
  var a = i * Math.PI * 2 / slots;
  var slot = new T.Mesh(new T.BoxGeometry(0.24, 0.07, 0.75), mDark);
  slot.position.set(Math.cos(a) * gR * 0.48, Math.sin(a) * gR * 0.48, 0);
  slot.rotation.z = a;
  gG.add(slot);
}

for (var i = 0; i < slots; i++) {
  var a = i * Math.PI * 2 / slots;
  var aSh = new T.Shape();
  aSh.absarc(0, 0, dR + 0.13, 0.48 + a, 5.82 + a, true);
  aSh.absarc(0, 0, dR + 0.22, 5.82 + a, 0.48 + a, false);
  var aMesh = new T.Mesh(new T.ExtrudeGeometry(aSh, { steps: 1, depth: 0.08, bevelEnabled: false }), mRed);
  aMesh.position.z = 0.04;
  gG.add(aMesh);
}

var gHub = new T.Mesh(new T.CylinderGeometry(0.6, 0.6, 0.14, 24), mGold);
gHub.position.z = 0.08;
gG.add(gHub);

var gShaft = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.45, 10), mDark);
gShaft.position.z = 0.18;
gG.add(gShaft);

// ── Pillars ──
var p1 = new T.Mesh(new T.CylinderGeometry(0.12, 0.16, 0.8, 8), mDark);
p1.position.set(-Cd, -2.55, 0); p1.castShadow = true; scene.add(p1);
var p2 = new T.Mesh(new T.CylinderGeometry(0.12, 0.16, 0.8, 8), mDark);
p2.position.set(Cd, -2.55, 0); p2.castShadow = true; scene.add(p2);

// ── Particles ──
var ptGeo = new T.BufferGeometry();
var ptArr = new Float32Array(70 * 3);
for (var i = 0; i < 70; i++) {
  ptArr[i * 3] = (Math.random() - 0.5) * 12;
  ptArr[i * 3 + 1] = (Math.random() - 0.5) * 8;
  ptArr[i * 3 + 2] = (Math.random() - 0.5) * 6;
}
ptGeo.setAttribute("position", new T.BufferAttribute(ptArr, 3));
var pts = new T.Points(ptGeo, new T.PointsMaterial({
  color: "#bcc6d0", size: 0.05, transparent: true, opacity: 0.4, depthWrite: false
}));
scene.add(pts);

// ── Geneva motion math ──
function genevaRot(drvAng) {
  var p = ((drvAng % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  var seg = Math.PI * 2 / slots;
  var idx = Math.floor(p / seg);
  var localP = p - idx * seg;
  var enter = Math.PI / 2 - Math.PI / slots;
  var exit = Math.PI / 2 + Math.PI / slots;
  if (localP < enter) return idx * seg;
  if (localP > exit) return (idx + 1) * seg;
  return idx * seg + (localP - enter) / (exit - enter) * seg;
}

// ── Animation ──
var an = 0;
function animate() {
  requestAnimationFrame(animate);
  an += 0.025;
  var da = an % (Math.PI * 2);
  dG.rotation.z = da;
  pin.position.set(Math.cos(da) * pinDist, Math.sin(da) * pinDist, 0);
  gG.rotation.z = genevaRot(da);
  pts.rotation.z += 0.0004;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", function() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
