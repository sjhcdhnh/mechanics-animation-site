<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>日内瓦机构 | 间歇分度运动</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a14;color:#cdd6f4;font-family:"Microsoft YaHei",sans-serif}
    #hud{position:absolute;left:16px;top:16px;max-width:430px;padding:12px 14px;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.75;backdrop-filter:blur(8px)}
    #legend{position:absolute;right:16px;bottom:16px;padding:8px 12px;background:rgba(10,12,24,.65);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px}
    .run{color:#a6e3a1}.dw{color:#f9e2af}.pin{color:#f38ba8}
  </style>
</head>
<body>
  <div id="hud"><b>外啮合日内瓦机构：连续转动 → 间歇转动</b><br>
    主动销轮每转一周，驱动销进入槽轮一次，使四槽槽轮分度 90°。<br>
    销离槽期间由锁止圆盘与槽轮圆弧配合，保持停歇不倒转。<br>
    状态：<span id="state" class="run">--</span>，槽轮角：<span id="angle" class="dw">--</span>°
  </div>
  <div id="legend"><span class="pin">粉色销</span>：进入槽内驱动　<span class="dw">黄色圆盘</span>：停歇锁止</div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { quickSetup, MaterialPresets, GeometryHelpers, createAnimationLoop } from './js/animation-core.js';

    const {scene,camera,renderer,controls,composer}=quickSetup({cameraPos:[0,-5.8,5.1],target:[0,0,0],fov:42,near:.1,far:80,exposure:1.08,bloomStrength:.12});
    const pixelRatio=Math.min(window.devicePixelRatio||1,1.4);
    renderer.setPixelRatio(pixelRatio);
    composer.setPixelRatio?.(pixelRatio);
    scene.add(new THREE.GridHelper(5.6,22,0x39415f,0x20263a));

    const drive=new THREE.Group(), wheel=new THREE.Group(); scene.add(drive,wheel);
    const driveCenter=new THREE.Vector3(-.82,0,.05), genevaCenter=new THREE.Vector3(.82,0,.05);
    drive.position.copy(driveCenter); wheel.position.copy(genevaCenter);

    const matDrive=MaterialPresets.anodizedAluminum(0x89b4fa);
    const matWheel=MaterialPresets.anodizedAluminum(0xa6e3a1);
    const matLock=new THREE.MeshStandardMaterial({color:0xf9e2af,roughness:.35,metalness:.55});
    const matSlot=new THREE.MeshStandardMaterial({color:0x070811,roughness:.86,metalness:.05});
    const matPin=new THREE.MeshStandardMaterial({color:0xf38ba8,roughness:.25,metalness:.65,emissive:0x331018,emissiveIntensity:.25});

    const pinRadius=.78;
    const driveDisk=new THREE.Mesh(GeometryHelpers.createCylinder(.88,.88,.09,96),matDrive); driveDisk.rotation.x=Math.PI/2; drive.add(driveDisk);
    const crankArm=new THREE.Mesh(GeometryHelpers.createRoundedLink(pinRadius,.08,.07,.02,3),MaterialPresets.brushedAluminum()); crankArm.position.x=pinRadius/2; drive.add(crankArm);
    const pin=new THREE.Mesh(GeometryHelpers.createCylinder(.055,.055,.34,48),matPin); pin.rotation.x=Math.PI/2; pin.position.set(pinRadius,0,.2); drive.add(pin);
    const pinCap=new THREE.Mesh(GeometryHelpers.createPinSphere(.075,48),matPin); pinCap.position.set(pinRadius,0,.39); drive.add(pinCap);
    const lockDisk=new THREE.Mesh(GeometryHelpers.createCylinder(.42,.42,.13,96),matLock); lockDisk.rotation.x=Math.PI/2; lockDisk.position.z=.1; drive.add(lockDisk);

    const genevaDisk=new THREE.Mesh(GeometryHelpers.createCylinder(1.02,1.02,.1,128),matWheel); genevaDisk.rotation.x=Math.PI/2; wheel.add(genevaDisk);
    const hub=new THREE.Mesh(GeometryHelpers.createCylinder(.16,.16,.16,64),MaterialPresets.polishedSteel()); hub.rotation.x=Math.PI/2; hub.position.z=.13; wheel.add(hub);
    for(let i=0;i<4;i++){
      const slotGroup=new THREE.Group();
      slotGroup.rotation.z=i*Math.PI/2;
      const slot=new THREE.Mesh(new THREE.BoxGeometry(.9,.14,.14),matSlot);
      slot.position.x=-.49;
      slot.position.z=.065;
      slotGroup.add(slot);
      const outerEnd=new THREE.Mesh(GeometryHelpers.createCylinder(.078,.078,.145,48),matSlot);
      outerEnd.rotation.x=Math.PI/2;
      outerEnd.position.set(-.94,0,.07);
      slotGroup.add(outerEnd);
      const innerEnd=outerEnd.clone();
      innerEnd.position.x=-.06;
      slotGroup.add(innerEnd);
      wheel.add(slotGroup);
    }
    const lockArc=new THREE.Mesh(new THREE.TorusGeometry(.54,.055,12,96,Math.PI*.72),matLock); lockArc.position.z=.19; wheel.add(lockArc);

    const contactMark=new THREE.Mesh(GeometryHelpers.createCylinder(.075,.075,.03,48),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x88ccff,emissiveIntensity:.35,transparent:true,opacity:.55}));
    contactMark.rotation.x=Math.PI/2; contactMark.position.set(-.9,0,.22); wheel.add(contactMark);

    function ease(u){return u*u*u*(u*(u*6-15)+10);}
    const slots=4, step=Math.PI/2, active=.33, omega=1.05;
    const stateEl=document.getElementById('state');
    const angleEl=document.getElementById('angle');
    const movingText='\u9a71\u52a8\u9500\u5728\u69fd\u5185\uff0c\u6b63\u5728\u5206\u5ea6';
    const dwellText='\u9501\u6b62\u5706\u76d8\u63a5\u5408\uff0c\u69fd\u8f6e\u505c\u6b47';

    createAnimationLoop(renderer,scene,camera,{composer,controls},(delta,elapsed)=>{
      const phi=omega*elapsed;
      drive.rotation.z=phi;

      const cyc=phi/(Math.PI*2);
      const k=Math.floor(cyc);
      const f=cyc-k;
      const base=k*step;
      let theta, moving=false;
      if(f<active){
        theta=base+step*ease(f/active);
        moving=true;
      }else{
        theta=base+step;
      }
      wheel.rotation.z=theta;

      stateEl.textContent=moving?movingText:dwellText;
      stateEl.className=moving?'run':'dw';
      const shownAngle=(((theta*180/Math.PI)%360)+360)%360;
      angleEl.textContent=shownAngle.toFixed(1);
      pin.material.emissiveIntensity=moving?.58:.12;
      pinCap.material.emissiveIntensity=moving?.58:.12;
      lockArc.visible=!moving;
      contactMark.visible=moving;
    }).start();
  </script>
</body>
</html>
