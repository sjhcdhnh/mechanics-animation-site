<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>日内瓦机构 · 间歇运动</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#c{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0}.dot{width:12px;height:12px;border-radius:50%}.sep{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="c"></div>
<div class="panel"><div class="item"><span class="dot" style="background:#3a7bd5"></span>主动轮 匀速转动</div><div class="sep"></div><div class="item"><span class="dot" style="background:#e63946"></span>从动槽轮 间歇转动</div><div class="sep"></div><div class="item"><span class="dot" style="background:#f4d03f"></span>驱动销</div><div class="sep"></div><div class="item" style="color:#ffd966">4槽 · 90°/步 · 4:1</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;document.getElementById('c').appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,40);C.position.set(0,0,10);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const L=new T.DirectionalLight('#ffffff',5);L.position.set(6,8,5);L.castShadow=true;L.shadow.mapSize.set(2048,2048);S.add(L);
S.add(new T.DirectionalLight('#8a9bb5',2).position.set(-3,2,-3));S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));
S.add(new T.GridHelper(10,16,'#3a3f4a','#252830').translateY(-3));
S.add(new T.Mesh(new T.PlaneGeometry(14,14),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15})).rotateX(-Math.PI/2).translateY(-3.1).receiveShadow=true);

const mB=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mR=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mG=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mD=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});

const Cd=1.9; // center distance
const dR=.6; // driver body radius
const gR=1.0; // geneva radius
const slots=4;
const pinDist=.78; // pin radial distance
const pinR=.09;
const slotW=.24;
const slotLen=.75;

// ── Driver (blue, left) ──
// add order: disc(0), crescent(1), hub(2), pin(3), shaft(4)
const dG=new T.Group();dG.position.set(-Cd,0,0);S.add(dG);
// Disc
const dShape=new T.Shape();dShape.absarc(0,0,dR,0,Math.PI*2,false);
dShape.holes.push(new T.Path().absellipse(0,0,.14,.14,0,Math.PI*2,true));
dG.add(new T.Mesh(new T.ExtrudeGeometry(dShape,{steps:1,depth:.12,bevelEnabled:false}),mB).translateZ(-.06).castShadow=true);
// Crescent lock (blue arc)
const lkR=dR+.08;
const lkSh=new T.Shape();lkSh.absarc(0,0,lkR,.5,5.8,false);lkSh.absarc(0,0,lkR-.12,5.8,.5,true);
dG.add(new T.Mesh(new T.ExtrudeGeometry(lkSh,{steps:1,depth:.08,bevelEnabled:false}),mB).translateZ(.04));
// Hub
dG.add(new T.Mesh(new T.CylinderGeometry(.55,.55,.14,24),mG).translateZ(.08));
// Drive pin (gold cylinder, rotates with driver, start at top=12oclock)
const pin=new T.Mesh(new T.CylinderGeometry(pinR,pinR,.18,24),mG);pin.rotation.x=Math.PI/2;dG.add(pin);
// Shaft
dG.add(new T.Mesh(new T.CylinderGeometry(.05,.05,.45,10),mD).translateZ(.18));

// ── Geneva wheel (red, right) ──
const gG=new T.Group();gG.position.set(Cd,0,0);S.add(gG);
// Body disc
const gSh=new T.Shape();gSh.absarc(0,0,gR,0,Math.PI*2,false);
gSh.holes.push(new T.Path().absellipse(0,0,.16,.16,0,Math.PI*2,true));
gG.add(new T.Mesh(new T.ExtrudeGeometry(gSh,{steps:1,depth:.12,bevelEnabled:false}),mR).translateZ(-.06).castShadow=true);
// 4 slots
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  gG.add(new T.Mesh(new T.BoxGeometry(slotW,.07,slotLen),mD).position.set(Math.cos(a)*gR*.48,Math.sin(a)*gR*.48,0).rotateZ(a));}
// 4 concave lock arcs
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  const aSh=new T.Shape();aSh.absarc(0,0,dR+.13,.48+a,5.82+a,true);aSh.absarc(0,0,dR+.22,5.82+a,.48+a,false);
  gG.add(new T.Mesh(new T.ExtrudeGeometry(aSh,{steps:1,depth:.08,bevelEnabled:false}),mR).translateZ(.04));}
// Hub
gG.add(new T.Mesh(new T.CylinderGeometry(.6,.6,.14,24),mG).translateZ(.08));
gG.add(new T.Mesh(new T.CylinderGeometry(.05,.05,.45,10),mD).translateZ(.18));

// Pillars
function pil(x,y,z,h){S.add(new T.Mesh(new T.CylinderGeometry(.12,.16,h,8),mD).position.set(x,y,z).castShadow=true);}
pil(-Cd,-2.55,0,.8);pil(Cd,-2.55,0,.8);

// Particles
const pt=new T.BufferGeometry();const pa=new Float32Array(60*3);for(let i=0;i<60;i++){pa[i*3]=(Math.random()-.5)*12;pa[i*3+1]=(Math.random()-.5)*8;pa[i*3+2]=(Math.random()-.5)*5;}pt.setAttribute('position',new T.BufferAttribute(pa,3));const pts=new T.Points(pt,new T.PointsMaterial({color:'#bcc6d0',size:.05,transparent:true,opacity:.4,depthWrite:false}));S.add(pts);

// ── Geneva math: for a 4-slot geneva, the driver rotates 360° and geneva rotates 90° ──
function gRot(drvAng){
  const p=((drvAng%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const seg=Math.PI*2/slots;
  const idx=Math.floor(p/seg);
  const localP=p-idx*seg;
  const enter=Math.PI/2-Math.PI/slots;
  const exit=Math.PI/2+Math.PI/slots;
  if(localP<enter)return idx*seg;
  if(localP>exit)return(idx+1)*seg;
  return idx*seg+(localP-enter)/(exit-enter)*seg;
}

const clock=new T.Clock();
let an=0;
(function L(){requestAnimationFrame(L);const dt=Math.min(clock.getDelta(),.1);an+=dt*2.5;const da=an%(Math.PI*2);dG.rotation.z=da;
  pin.position.set(Math.cos(da)*pinDist,Math.sin(da)*pinDist,0); // children[3] is pin
  gG.rotation.z=gRot(da);
  pts.rotation.z+=.0004;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
