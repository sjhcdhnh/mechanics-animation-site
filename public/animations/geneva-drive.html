<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>日内瓦机构 · 间歇运动</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: #eee; padding: 8px 15px; border-radius: 8px; backdrop-filter: blur(8px); pointer-events: none; z-index: 10; font-size: 14px; border-left: 4px solid #ffaa33; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    </style>
</head>
<body>
    <div id="info"><span class="dot" style="background:#3a7bd5;"></span>主动轮匀速 <span class="dot" style="background:#e63946;"></span>从动槽轮间歇 <span class="dot" style="background:#f4d03f;"></span>驱动销 4槽·90度/步</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a1d24');
        const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 40);
        camera.position.set(0, 0, 9); camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.12; controls.target.set(0, 0, 0); controls.update();

        scene.add(new THREE.AmbientLight('#3a4050', 2.2));
        scene.add(new THREE.HemisphereLight('#b0c0d8', '#282e3a', 1.6));
        const keyLight = new THREE.DirectionalLight('#ffffff', 5.5); keyLight.position.set(6, 8, 5);
        keyLight.castShadow = true; keyLight.shadow.mapSize.width = 2048; keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 30;
        keyLight.shadow.camera.left = -8; keyLight.shadow.camera.right = 8;
        keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -6; keyLight.shadow.bias = -0.0005; scene.add(keyLight);
        scene.add(new THREE.DirectionalLight('#8a9bb5', 2.0).position.set(-3, 2, -3));
        scene.add(new THREE.DirectionalLight('#5a6b82', 1.8).position.set(0, -2, 2));

        const grid = new THREE.GridHelper(10, 16, '#3a3f4a', '#252830'); grid.position.y = -3; scene.add(grid);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: '#1e2128', roughness: 0.9, metalness: 0.15 }));
        ground.rotation.x = -Math.PI / 2; ground.position.y = -3.1; ground.receiveShadow = true; scene.add(ground);

        const mB = new THREE.MeshStandardMaterial({ color: '#3a7bd5', roughness: 0.25, metalness: 0.55 });
        const mR = new THREE.MeshStandardMaterial({ color: '#e63946', roughness: 0.25, metalness: 0.55 });
        const mG = new THREE.MeshStandardMaterial({ color: '#f4d03f', roughness: 0.2, metalness: 0.85 });
        const mD = new THREE.MeshStandardMaterial({ color: '#4a4f5a', roughness: 0.55, metalness: 0.5 });

        const Cd = 1.9, dR = 0.6, gR = 1.0, slots = 4, pinDist = 0.78, pinR = 0.09, slotW = 0.24, slotL = 0.75;

        // --- Driver (blue, left) ---
        const dG = new THREE.Group(); dG.position.set(-Cd, 0, 0); scene.add(dG);
        const dShape = new THREE.Shape(); dShape.absarc(0, 0, dR, 0, Math.PI * 2, false);
        dShape.holes.push(new THREE.Path().absellipse(0, 0, 0.14, 0.14, 0, Math.PI * 2, true));
        dG.add(new THREE.Mesh(new THREE.ExtrudeGeometry(dShape, { steps: 1, depth: 0.12, bevelEnabled: false }), mB).translateZ(-0.06).castShadow = true);
        const lkShape = new THREE.Shape(); lkShape.absarc(0, 0, dR + 0.08, 0.5, 5.8, false); lkShape.absarc(0, 0, dR - 0.04, 5.8, 0.5, true);
        dG.add(new THREE.Mesh(new THREE.ExtrudeGeometry(lkShape, { steps: 1, depth: 0.08, bevelEnabled: false }), mB).translateZ(0.04));
        dG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.14, 24), mG).translateZ(0.08));
        const pin = new THREE.Mesh(new THREE.CylinderGeometry(pinR, pinR, 0.18, 24), mG); pin.rotation.x = Math.PI / 2; dG.add(pin);
        dG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 10), mD).translateZ(0.18));

        // --- Geneva (red, right) ---
        const gG = new THREE.Group(); gG.position.set(Cd, 0, 0); scene.add(gG);
        const gSh = new THREE.Shape(); gSh.absarc(0, 0, gR, 0, Math.PI * 2, false);
        gSh.holes.push(new THREE.Path().absellipse(0, 0, 0.16, 0.16, 0, Math.PI * 2, true));
        gG.add(new THREE.Mesh(new THREE.ExtrudeGeometry(gSh, { steps: 1, depth: 0.12, bevelEnabled: false }), mR).translateZ(-0.06).castShadow = true);
        for (let i = 0; i < slots; i++) { const a = i * Math.PI * 2 / slots; gG.add(new THREE.Mesh(new THREE.BoxGeometry(slotW, 0.07, slotL), mD).position.set(Math.cos(a) * gR * 0.48, Math.sin(a) * gR * 0.48, 0).rotateZ(a)); }
        for (let i = 0; i < slots; i++) { const a = i * Math.PI * 2 / slots; const aSh = new THREE.Shape(); aSh.absarc(0, 0, dR + 0.13, 0.48 + a, 5.82 + a, true); aSh.absarc(0, 0, dR + 0.22, 5.82 + a, 0.48 + a, false); gG.add(new THREE.Mesh(new THREE.ExtrudeGeometry(aSh, { steps: 1, depth: 0.08, bevelEnabled: false }), mR).translateZ(0.04)); }
        gG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.14, 24), mG).translateZ(0.08));
        gG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 10), mD).translateZ(0.18));

        scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.8, 8), mD).position.set(-Cd, -2.55, 0).castShadow = true);
        scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.8, 8), mD).position.set(Cd, -2.55, 0).castShadow = true);

        const pGeo = new THREE.BufferGeometry(); const pArr = new Float32Array(70 * 3);
        for (let i = 0; i < 70; i++) { pArr[i * 3] = (Math.random() - 0.5) * 12; pArr[i * 3 + 1] = (Math.random() - 0.5) * 8; pArr[i * 3 + 2] = (Math.random() - 0.5) * 5; }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
        const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: '#bcc6d0', size: 0.05, transparent: true, opacity: 0.4, depthWrite: false })); scene.add(pts);

        function genevaRot(drvAng) {
            const p = ((drvAng % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const seg = Math.PI * 2 / slots, idx = Math.floor(p / seg), localP = p - idx * seg;
            const enter = Math.PI / 2 - Math.PI / slots, exit = Math.PI / 2 + Math.PI / slots;
            if (localP < enter) return idx * seg;
            if (localP > exit) return (idx + 1) * seg;
            return idx * seg + (localP - enter) / (exit - enter) * seg;
        }

        const clock = new THREE.Clock(); let an = 0;
        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1); an += dt * 2.5; const da = an % (Math.PI * 2);
            dG.rotation.z = da; pin.position.set(Math.cos(da) * pinDist, Math.sin(da) * pinDist, 0); gG.rotation.z = genevaRot(da);
            pts.rotation.z += dt * 0.04; controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    </script>
</body>
</html>
