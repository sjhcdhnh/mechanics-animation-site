<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>日内瓦机构 · 间歇运动</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#container{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.info-panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.info-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0;white-space:nowrap}.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}.divider{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="container"></div>
<div class="info-panel"><div class="info-item"><span class="color-dot" style="background:#3a7bd5"></span>主动轮</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#e63946"></span>从动槽轮</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#f4d03f"></span>驱动销</div><div class="divider"></div><div class="info-item" style="color:#ffd966">4槽 · 90°/步</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ct=document.getElementById('container');
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;ct.appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,40);C.position.set(0,0,10);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.minDistance=4;O.maxDistance=20;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const key=new T.DirectionalLight('#ffffff',5.5);key.position.set(8,10,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=.5;key.shadow.camera.far=30;key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.bias=-.0005;S.add(key);
S.add(new T.DirectionalLight('#8a9bb5',2.0).position.set(-4,2,-4));
S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));

const grid=new T.GridHelper(10,16,'#3a3f4a','#252830');grid.position.y=-3.5;S.add(grid);
const ground=new T.Mesh(new T.PlaneGeometry(14,14),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-3.6;ground.receiveShadow=true;S.add(ground);

const mBlue=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mRed=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mPin=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mDark=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});

const Cd=1.8,driverR=.55,gR=.95,slots=4,drPin=.75,pinR=.1,slotW=.24,slotL=.7;
// Driver (blue)
const dG=new T.Group();dG.position.set(-Cd,0,0);S.add(dG);
// Body
const dBody=new T.Mesh(new T.CylinderGeometry(driverR,driverR,.15,48),mBlue);dBody.castShadow=true;dG.add(dBody);
// Locking crescent
const lShape=new T.Shape();const lR=driverR+.08;lShape.absarc(0,0,lR,Math.PI*.65,Math.PI*2.35,false);lShape.absarc(0,0,lR-.1,Math.PI*2.35,Math.PI*.65,true);
dG.add(new T.Mesh(new T.ExtrudeGeometry(lShape,{depth:.08,bevelEnabled:false}),mBlue).translateZ(.06));
// Pin
dG.add(new T.Mesh(new T.CylinderGeometry(pinR,pinR,.18,24),mPin).rotateX(Math.PI/2));
// Hub + shaft
dG.add(new T.Mesh(new T.CylinderGeometry(.1,.1,.3,16),mPin).translateZ(.17));
dG.add(new T.Mesh(new T.CylinderGeometry(.05,.05,.5,12),mDark).translateZ(.32));

// Geneva wheel (red)
const gG=new T.Group();gG.position.set(Cd,0,0);S.add(gG);
gG.add(new T.Mesh(new T.CylinderGeometry(gR,gR,.15,48),mRed).castShadow=true);
// 4 slots
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  const s=new T.Mesh(new T.BoxGeometry(slotW,.1,slotL),mDark);s.position.set(Math.cos(a)*gR*.55,0,Math.sin(a)*gR*.55);s.rotation.z=a;gG.add(s);}
// 4 concave locks
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  const arcShape=new T.Shape();arcShape.absarc(0,0,driverR+.1,Math.PI*.6+a,Math.PI*2.4+a,true);arcShape.absarc(0,0,driverR+.18,Math.PI*2.4+a,Math.PI*.6+a,false);
  gG.add(new T.Mesh(new T.ExtrudeGeometry(arcShape,{depth:.08,bevelEnabled:false}),mRed).translateZ(.06));}
gG.add(new T.Mesh(new T.CylinderGeometry(.11,.11,.3,16),mPin).translateZ(.17));
gG.add(new T.Mesh(new T.CylinderGeometry(.05,.05,.5,12),mDark).translateZ(.32));

// Pillars
function pillar(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.12,.16,h,8),mDark);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pillar(-Cd,-2.85,0,1.2);pillar(Cd,-2.85,0,1.2);

// Particles
const pts=new T.BufferGeometry();const pa=new Float32Array(60*3);
for(let i=0;i<60;i++){pa[i*3]=(Math.random()-.5)*10;pa[i*3+1]=(Math.random()-.5)*8;pa[i*3+2]=(Math.random()-.5)*8;}
pts.setAttribute('position',new T.BufferAttribute(pa,3));
const particles=new T.Points(pts,new T.PointsMaterial({color:'#bcc6d0',size:.05,transparent:true,opacity:.4,depthWrite:false}));S.add(particles);

let ang=0;
function genevaRot(da){const p=((da%(Math.PI*2))+Math.PI*2)%(Math.PI*2);const enter=Math.PI/2-Math.PI/slots,exit=Math.PI/2+Math.PI/slots;if(p<enter||p>exit+1.5*Math.PI)return 0;const idx=Math.floor(p/(Math.PI*2/slots)),ba=idx*Math.PI*2/slots,lp=p-ba;if(lp<enter||lp>exit)return ba;return ba+(lp-enter)/(exit-enter)*Math.PI*2/slots;}
(function a(t){requestAnimationFrame(a);ang+=.018;const da=ang%(Math.PI*2);dG.rotation.z=da;const pinMesh=dG.children[3];pinMesh.position.set(Math.cos(da)*drPin,Math.sin(da)*drPin,0);gG.rotation.z=genevaRot(da);particles.rotation.y+=.0005;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
