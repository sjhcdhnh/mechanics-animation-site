<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>日内瓦机构 · 间歇运动</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#container{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.info-panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.info-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0;white-space:nowrap}.color-dot{width:12px;height:12px;border-radius:50%}.divider{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="container"></div>
<div class="info-panel"><div class="info-item"><span class="color-dot" style="background:#3a7bd5"></span>主动轮·匀速</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#e63946"></span>从动槽轮·间歇</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#f4d03f"></span>驱动销</div><div class="divider"></div><div class="info-item" style="color:#ffd966">4槽 · 90°/步 · 4:1</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ct=document.getElementById('container');
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;ct.appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,50);C.position.set(0,0,12);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.minDistance=4;O.maxDistance=25;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const key=new T.DirectionalLight('#ffffff',5.5);key.position.set(8,10,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.far=30;key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;key.shadow.bias=-.0005;S.add(key);
S.add(new T.DirectionalLight('#8a9bb5',2.0).position.set(-4,3,-4));
S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));

const grid=new T.GridHelper(12,18,'#3a3f4a','#252830');grid.position.y=-4.5;S.add(grid);
const ground=new T.Mesh(new T.PlaneGeometry(16,16),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-4.6;ground.receiveShadow=true;S.add(ground);

const mBlue=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mRed=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mGold=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mGray=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});

// ── Parameters ──
const Cd=2.0,dR=.65,gR=1.1,slots=4,drPin=.82,pinR=.11,slotW=.26,slotL=.85;

// ── Driver disc (blue, with crescent lock) ──
const dG=new T.Group();dG.position.set(-Cd,0,0);S.add(dG);
// Disc body (ExtrudeGeometry solid disc)
const dShape=new T.Shape();dShape.absarc(0,0,dR,0,Math.PI*2,false);
const dHole=new T.Path();dHole.absellipse(0,0,.15,.15,0,Math.PI*2,true);dShape.holes.push(dHole);
const dGeo=new T.ExtrudeGeometry(dShape,{steps:1,depth:.15,bevelEnabled:false});
dG.add(new T.Mesh(dGeo,mBlue).translateZ(-.07).castShadow=true);
// Lock crescent (thick arc)
const lShape=new T.Shape();const lR=dR+.08;lShape.absarc(0,0,lR,Math.PI*.6,Math.PI*2.4,false);lShape.absarc(0,0,lR-.12,Math.PI*2.4,Math.PI*.6,true);
const lGeo=new T.ExtrudeGeometry(lShape,{steps:1,depth:.1,bevelEnabled:false});
dG.add(new T.Mesh(lGeo,mBlue).translateZ(.05));
// Hub
dG.add(new T.Mesh(new T.CylinderGeometry(.65,.65,.18,24),mGold).translateZ(.1));
// Drive pin
dG.add(new T.Mesh(new T.CylinderGeometry(pinR,pinR,.22,24),mGold).rotateX(Math.PI/2).castShadow=true);
// Shaft
dG.add(new T.Mesh(new T.CylinderGeometry(.06,.06,.6,12),mGray).translateZ(.25));

// ── Geneva wheel (red, 4 slots) ──
const gG=new T.Group();gG.position.set(Cd,0,0);S.add(gG);
// Main disc
const gShape=new T.Shape();gShape.absarc(0,0,gR,0,Math.PI*2,false);
const gHole=new T.Path();gHole.absellipse(0,0,.18,.18,0,Math.PI*2,true);gShape.holes.push(gHole);
const gGeo2=new T.ExtrudeGeometry(gShape,{steps:1,depth:.15,bevelEnabled:false});
gG.add(new T.Mesh(gGeo2,mRed).translateZ(-.07).castShadow=true);
// 4 slots (dark rectangular cuts)
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  const sGeo=new T.BoxGeometry(slotW,.08,slotL);
  const sMesh=new T.Mesh(sGeo,mGray);sMesh.position.set(Math.cos(a)*gR*.5,Math.sin(a)*gR*.5,0);sMesh.rotation.z=a;gG.add(sMesh);}
// 4 concave lock arcs
for(let i=0;i<slots;i++){const a=i*Math.PI*2/slots;
  const aShape=new T.Shape();aShape.absarc(0,0,dR+.13,Math.PI*.58+a,Math.PI*2.42+a,true);aShape.absarc(0,0,dR+.22,Math.PI*2.42+a,Math.PI*.58+a,false);
  gG.add(new T.Mesh(new T.ExtrudeGeometry(aShape,{depth:.1,bevelEnabled:false}),mRed).translateZ(.05));}
// Hub
gG.add(new T.Mesh(new T.CylinderGeometry(.7,.7,.18,24),mGold).translateZ(.1));
gG.add(new T.Mesh(new T.CylinderGeometry(.07,.07,.6,12),mGray).translateZ(.25));

// ── Pillars ──
function pillar(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.14,.18,h,8),mGray);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pillar(-Cd,-3.75,0,1.4);pillar(Cd,-3.75,0,1.4);

// ── Particles ──
const pts=new T.BufferGeometry();const pa=new Float32Array(80*3);
for(let i=0;i<80;i++){pa[i*3]=(Math.random()-.5)*14;pa[i*3+1]=(Math.random()-.5)*10;pa[i*3+2]=(Math.random()-.5)*8;}
pts.setAttribute('position',new T.BufferAttribute(pa,3));
const particles=new T.Points(pts,new T.PointsMaterial({color:'#bcc6d0',size:.06,transparent:true,opacity:.4,depthWrite:false}));S.add(particles);

// ── Animation ──
let ang=0;
function genevaRot(da){const p=((da%(Math.PI*2))+Math.PI*2)%(Math.PI*2);const ent=Math.PI/2-Math.PI/slots,ext=Math.PI/2+Math.PI/slots;if(p<ent||p>ext+Math.PI*1.5)return 0;const idx=Math.floor(p/(Math.PI*2/slots)),ba=idx*Math.PI*2/slots,lp=p-ba;if(lp<ent||lp>ext)return ba;return ba+(lp-ent)/(ext-ent)*Math.PI*2/slots;}
(function a(){requestAnimationFrame(a);ang+=.018;const da=ang%(Math.PI*2);dG.rotation.z=da;const pinM=dG.children[4];pinM.position.set(Math.cos(da)*drPin,Math.sin(da)*drPin,0);gG.rotation.z=genevaRot(da);particles.rotation.z+=.0004;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
