<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>液压挖掘机 | 反铲工作装置运动学</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a14;color:#cdd6f4;font-family:"Microsoft YaHei",sans-serif}
    #hud{position:absolute;left:16px;top:16px;max-width:460px;padding:12px 14px;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.75;backdrop-filter:blur(8px)}
    #legend{position:absolute;right:16px;bottom:16px;padding:8px 12px;background:rgba(10,12,24,.65);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px}
    .g{color:#a6e3a1}.y{color:#f9e2af}
  </style>
</head>
<body>
  <div id="hud"><b>工程应用：液压挖掘机反铲工作装置</b><br>
    动臂、斗杆、铲斗构成三转动副串联系统；液压缸用两铰点距离表示伸缩量。<br>
    末端齿尖轨迹：<span class="y">挖掘弧线</span>；当前铲斗姿态角：<span id="bucket" class="g">--</span>°
  </div>
  <div id="legend">左键旋转 · 滚轮缩放 · 右键平移</div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { quickSetup, MaterialPresets, GeometryHelpers, createAnimationLoop } from './js/animation-core.js';

    const {scene,camera,renderer,controls,composer}=quickSetup({cameraPos:[5.3,3.0,5.8],target:[1.2,.8,0],fov:42,near:.1,far:120,exposure:1.08,bloomStrength:.12});
    const pixelRatio=Math.min(window.devicePixelRatio||1,1.35);
    renderer.setPixelRatio(pixelRatio);
    composer.setPixelRatio?.(pixelRatio);

    const groundMat=new THREE.MeshStandardMaterial({color:0x7b5138,roughness:.96});
    const ground=new THREE.Mesh(new THREE.BoxGeometry(8,.12,5),groundMat); ground.position.y=-.08; ground.receiveShadow=true; scene.add(ground);
    const trench=new THREE.Mesh(new THREE.BoxGeometry(2.35,.08,1.05),new THREE.MeshStandardMaterial({color:0x322016,roughness:1})); trench.position.set(2.9,-.02,0); scene.add(trench);

    const yellow=MaterialPresets.anodizedAluminum(0xf4b23c);
    const dark=MaterialPresets.castIron();
    const steel=MaterialPresets.brushedAluminum();
    const rodMat=MaterialPresets.polishedSteel();
    const cylMat=new THREE.MeshStandardMaterial({color:0xd9dde7,metalness:.85,roughness:.22});
    const bucketMat=new THREE.MeshStandardMaterial({color:0x9b6332,metalness:.42,roughness:.52});
    const innerMat=new THREE.MeshStandardMaterial({color:0x3a2418,metalness:.15,roughness:.85});

    const root=new THREE.Group(); scene.add(root);

    function createTrackAssembly(z){
      const g=new THREE.Group(); g.position.z=z; root.add(g);
      const beltMat=new THREE.MeshStandardMaterial({color:0x15161a,metalness:.25,roughness:.68});
      const treadMat=new THREE.MeshStandardMaterial({color:0x22252b,metalness:.35,roughness:.62});
      const frame=new THREE.Mesh(new THREE.BoxGeometry(1.72,.22,.32),dark); frame.position.set(0,.2,0); frame.castShadow=frame.receiveShadow=true; g.add(frame);
      const top=new THREE.Mesh(new THREE.BoxGeometry(1.42,.08,.38),beltMat); top.position.set(0,.39,0); g.add(top);
      const bottom=new THREE.Mesh(new THREE.BoxGeometry(1.42,.08,.38),beltMat); bottom.position.set(0,.07,0); g.add(bottom);
      [-.78,.78].forEach(x=>{
        const sprocket=new THREE.Mesh(GeometryHelpers.createCylinder(.205,.205,.4,56),steel); sprocket.rotation.x=Math.PI/2; sprocket.position.set(x,.23,0); sprocket.castShadow=true; g.add(sprocket);
      });
      for(let i=0;i<5;i++){
        const roller=new THREE.Mesh(GeometryHelpers.createCylinder(.095,.095,.42,48),steel); roller.rotation.x=Math.PI/2; roller.position.set(-.48+i*.24,.18,0); roller.castShadow=true; g.add(roller);
      }
      for(let i=0;i<12;i++){
        const x=-.66+i*.12;
        const a=new THREE.Mesh(new THREE.BoxGeometry(.075,.035,.44),treadMat); a.position.set(x,.46,0); a.castShadow=true; g.add(a);
        const b=a.clone(); b.position.y=.0; g.add(b);
      }
      return g;
    }
    createTrackAssembly(-.48);
    createTrackAssembly(.48);

    const house=new THREE.Group(); house.position.y=.56; root.add(house);
    const turntable=new THREE.Mesh(GeometryHelpers.createCylinder(.55,.65,.18,96),dark); turntable.rotation.x=Math.PI/2; house.add(turntable);
    const cab=new THREE.Mesh(new THREE.BoxGeometry(.65,.62,.58),new THREE.MeshPhysicalMaterial({color:0x1f2b36,metalness:.2,roughness:.25,transmission:.08,transparent:true,opacity:.88})); cab.position.set(-.25,.45,-.28); cab.castShadow=true; house.add(cab);
    const counter=new THREE.Mesh(new THREE.BoxGeometry(.9,.48,.86),yellow); counter.position.set(-.55,.34,.18); counter.castShadow=true; house.add(counter);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(.9,.34,.8),yellow); frame.position.set(.28,.34,0); frame.castShadow=true; house.add(frame);

    const boom=new THREE.Mesh(GeometryHelpers.createCylinder(.075,.095,1,64),yellow);
    const stick=new THREE.Mesh(GeometryHelpers.createCylinder(.065,.08,1,64),yellow);
    scene.add(boom,stick);

    const bucket=new THREE.Group();
    const sideShape=new THREE.Shape();
    sideShape.moveTo(-.20,.18); sideShape.lineTo(.25,.12); sideShape.lineTo(.44,-.16); sideShape.lineTo(-.02,-.26); sideShape.lineTo(-.23,-.06); sideShape.closePath();
    const sideGeo=new THREE.ExtrudeGeometry(sideShape,{depth:.035,bevelEnabled:true,bevelSize:.01,bevelThickness:.01,bevelSegments:2});
    [-1,1].forEach(sign=>{const side=new THREE.Mesh(sideGeo,bucketMat); side.position.z=sign*.29; side.rotation.y=sign<0?Math.PI:0; side.castShadow=true; bucket.add(side);});
    const bottom=new THREE.Mesh(new THREE.BoxGeometry(.58,.04,.58),bucketMat); bottom.position.set(.15,-.19,0); bottom.rotation.z=-.27; bottom.castShadow=true; bucket.add(bottom);
    const back=new THREE.Mesh(new THREE.BoxGeometry(.08,.38,.58),bucketMat); back.position.set(-.19,-.01,0); back.rotation.z=.16; back.castShadow=true; bucket.add(back);
    const inner=new THREE.Mesh(new THREE.BoxGeometry(.43,.03,.48),innerMat); inner.position.set(.12,-.12,0); inner.rotation.z=-.23; bucket.add(inner);
    const lip=new THREE.Mesh(new THREE.BoxGeometry(.1,.055,.62),rodMat); lip.position.set(.43,-.18,0); lip.rotation.z=-.2; lip.castShadow=true; bucket.add(lip);
    for(let i=-1;i<=1;i++){const tooth=new THREE.Mesh(new THREE.ConeGeometry(.035,.18,20),rodMat); tooth.rotation.z=-Math.PI/2; tooth.position.set(.5,-.19,i*.18); tooth.castShadow=true; bucket.add(tooth);}
    scene.add(bucket);

    const pins=[];
    function pinObj(){const p=new THREE.Mesh(GeometryHelpers.createPinSphere(.075,64),MaterialPresets.brassPin()); p.castShadow=true; scene.add(p); pins.push(p); return p;}
    const p0=pinObj(), p1=pinObj(), p2=pinObj(), p3=pinObj();

    function createCylPair(){const g=new THREE.Group(); const barrel=new THREE.Mesh(GeometryHelpers.createCylinder(.045,.055,1,48),cylMat); const rod=new THREE.Mesh(GeometryHelpers.createCylinder(.022,.022,1,48),rodMat); g.add(barrel,rod); scene.add(g); return{g,barrel,rod};}
    const boomCyl=createCylPair(), stickCyl=createCylPair(), bucketCyl=createCylPair();
    function setBeam(mesh,a,b){const d=b.clone().sub(a),len=d.length(); mesh.position.copy(a.clone().add(b).multiplyScalar(.5)); mesh.scale.set(1,len,1); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()); mesh.castShadow=true;}
    function setCylinderPair(pair,a,b){const d=b.clone().sub(a),len=d.length(),dir=d.clone().normalize(),mid=a.clone().add(b).multiplyScalar(.5); pair.g.position.copy(mid); pair.g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); pair.barrel.scale.set(1,len*.55,1); pair.barrel.position.y=-len*.12; pair.rod.scale.set(1,len*.58,1); pair.rod.position.y=len*.16;}

    const trailMax=180;
    const trailPts=[];
    const trailPositions=new Float32Array(trailMax*3);
    const trailGeom=new THREE.BufferGeometry();
    trailGeom.setAttribute('position',new THREE.BufferAttribute(trailPositions,3));
    trailGeom.setDrawRange(0,0);
    const trail=new THREE.Line(trailGeom,new THREE.LineBasicMaterial({color:0xf9e2af}));
    scene.add(trail);

    const soilCount=72;
    const soilGeo=new THREE.IcosahedronGeometry(.045,0);
    const soil=new THREE.InstancedMesh(soilGeo,groundMat,soilCount);
    soil.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(soil);
    const dummy=new THREE.Object3D();
    const soilData=Array.from({length:soilCount},()=>({
      x:2.12+Math.random()*1.45,
      y:.03+Math.random()*.08,
      z:(Math.random()-.5)*.95,
      s:.65+Math.random()*.8,
      phase:Math.random()*4
    }));

    createAnimationLoop(renderer,scene,camera,{composer,controls},(delta,elapsed)=>{
      const q=(Math.sin(elapsed*.55)+1)/2, q2=(Math.sin(elapsed*.55-Math.PI*.45)+1)/2;
      const a0=THREE.MathUtils.degToRad(10+35*q);
      const a1=THREE.MathUtils.degToRad(-68+34*q2);
      const a2=THREE.MathUtils.degToRad(-96+82*q);
      house.rotation.y=Math.sin(elapsed*.23)*.18;

      const O=new THREE.Vector3(.55,.92,0);
      const e1=new THREE.Vector3(Math.cos(a0),Math.sin(a0),0);
      const e2=new THREE.Vector3(Math.cos(a0+a1),Math.sin(a0+a1),0);
      const e3=new THREE.Vector3(Math.cos(a0+a1+a2),Math.sin(a0+a1+a2),0);
      const A=O, B=A.clone().add(e1.multiplyScalar(1.72)), C=B.clone().add(e2.multiplyScalar(1.32)), D=C.clone().add(e3.multiplyScalar(.53));

      [p0.position,p1.position,p2.position,p3.position].forEach((p,i)=>p.copy([A,B,C,D][i]));
      setBeam(boom,A,B);
      setBeam(stick,B,C);
      bucket.position.copy(C);
      bucket.rotation.set(0,0,a0+a1+a2);
      setCylinderPair(boomCyl,new THREE.Vector3(.05,.68,.34),A.clone().lerp(B,.45).add(new THREE.Vector3(0,.08,.22)));
      setCylinderPair(stickCyl,A.clone().lerp(B,.66).add(new THREE.Vector3(0,.12,-.18)),B.clone().lerp(C,.42).add(new THREE.Vector3(0,.08,-.16)));
      setCylinderPair(bucketCyl,B.clone().lerp(C,.72).add(new THREE.Vector3(0,.08,.2)),C.clone().lerp(D,.35).add(new THREE.Vector3(0,.06,.18)));

      trailPts.push(D.clone());
      if(trailPts.length>trailMax) trailPts.shift();
      for(let i=0;i<trailPts.length;i++){
        trailPositions[i*3]=trailPts[i].x;
        trailPositions[i*3+1]=trailPts[i].y;
        trailPositions[i*3+2]=trailPts[i].z;
      }
      trailGeom.attributes.position.needsUpdate=true;
      trailGeom.setDrawRange(0,trailPts.length);

      soilData.forEach((s,i)=>{
        const phase=(elapsed*.82+s.phase)%4;
        if(phase<1.05){
          s.x=THREE.MathUtils.lerp(s.x,D.x,.018);
          s.y=Math.max(.018,THREE.MathUtils.lerp(s.y,D.y-.24,.018));
          s.z=THREE.MathUtils.lerp(s.z,D.z,.012);
        }else{
          s.y=Math.max(.018,s.y-.0018);
          if(s.x<2.0||s.x>3.85){s.x=2.12+Math.random()*1.45; s.z=(Math.random()-.5)*.95;}
        }
        dummy.position.set(s.x,s.y,s.z);
        dummy.scale.setScalar(s.s);
        dummy.rotation.set(s.phase,elapsed*.2+s.phase,0);
        dummy.updateMatrix();
        soil.setMatrixAt(i,dummy.matrix);
      });
      soil.instanceMatrix.needsUpdate=true;

      document.getElementById('bucket').textContent=THREE.MathUtils.radToDeg(a0+a1+a2).toFixed(1);
    }).start();
  </script>
</body>
</html>
