<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>非惯性系 · 惯性力</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}
#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:8px;font-size:11px;line-height:1.9;backdrop-filter:blur(6px);border-left:4px solid #dc2626}
#p{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(6px)}
#p input{width:100px;accent-color:#dc2626}#p .v{color:#dc2626;font-weight:600}
#p button{width:100%;margin-top:4px;padding:5px;border-radius:6px;border:1px solid #dc2626;background:rgba(220,38,38,.08);color:#dc2626;font-size:12px;cursor:pointer}
#leg{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
</style></head><body>
<div id="hud"><b>非惯性系 · 牵连惯性力</b><br>车厢加速度 a=<span style="color:#dc2626" id="va">0.0</span> m/s²<br>摆偏角 θ=<span style="color:#2563eb" id="vt">0°</span><br>tanθ=a/g &nbsp; F<sub>惯</sub>=-ma</div>
<div id="p"><div>加速度 a <input type="range" id="sa" min="-50" max="50" value="20" step="1"> <span class="v" id="la">2.0</span> m/s²</div><button onclick="rst()">⟳ 复位</button></div>
<div id="leg">车厢(灰)·摆锤(红)·偏角=arctan(a/g) &nbsp; 拖拽旋转</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">import * as T from "three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");
var C=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,25);C.position.set(0,3,9);C.lookAt(0,1,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,1,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.5));S.add(new T.DirectionalLight("#ffffff",4).position.set(4,8,5));
S.add(new T.GridHelper(14,28,"#bbb","#e0e0e0"));
var cartG=new T.Group();S.add(cartG);
var bg2=new T.BoxGeometry(2.5,1.5,1.2);
var bm2=new T.Mesh(bg2,new T.MeshStandardMaterial({color:"#6b7280",roughness:0.4,metalness:0.5}));bm2.castShadow=true;cartG.add(bm2);
var rg2=new T.CylinderGeometry(0.04,0.04,2.4,8);
var rm2=new T.Mesh(rg2,new T.MeshStandardMaterial({color:"#4a4f5a",roughness:0.5}));rm2.rotation.z=Math.PI/2;rm2.position.set(0,0.75,0);cartG.add(rm2);
var wg1=new T.CylinderGeometry(0.18,0.18,1.3,16);var wm1=new T.Mesh(wg1,new T.MeshStandardMaterial({color:"#1f2937",roughness:0.5}));wm1.rotation.x=Math.PI/2;wm1.position.set(-1.0,-0.7,0);cartG.add(wm1);
var wg2=new T.CylinderGeometry(0.18,0.18,1.3,16);var wm2=new T.Mesh(wg2,new T.MeshStandardMaterial({color:"#1f2937",roughness:0.5}));wm2.rotation.x=Math.PI/2;wm2.position.set(1.0,-0.7,0);cartG.add(wm2);
var pendG=new T.Group();cartG.add(pendG);pendG.position.set(0,0.75,0);
var stG=new T.CylinderGeometry(0.02,0.02,1.0,8);
var stM=new T.Mesh(stG,new T.MeshStandardMaterial({color:"#374151",roughness:0.5}));stM.position.y=-0.5;pendG.add(stM);
var bobG=new T.SphereGeometry(0.15,32,32);
var bobM=new T.Mesh(bobG,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.2,metalness:0.45}));bobM.position.y=-1.0;bobM.castShadow=true;pendG.add(bobM);
var arrG2=new T.Group();cartG.add(arrG2);arrG2.position.set(0,1.0,0);
var arG2=new T.CylinderGeometry(0.04,0.04,1.2,8);
var arM2=new T.Mesh(arG2,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.05,emissive:"#dc2626",emissiveIntensity:0.6}));arM2.rotation.z=-Math.PI/2;arrG2.add(arM2);
var ahG2=new T.ConeGeometry(0.10,0.3,8);
var ahM2=new T.Mesh(ahG2,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.05,emissive:"#dc2626",emissiveIntensity:0.6}));ahM2.rotation.z=Math.PI/2;ahM2.position.x=0.75;arrG2.add(ahM2);
var acc=2.0;var cartX=0;
function rst(){acc=parseInt(document.getElementById("sa").value)/10;
document.getElementById("la").textContent=acc.toFixed(1);
document.getElementById("va").textContent=acc.toFixed(1);
var tanT=acc/9.8;var angle=Math.atan(tanT);
pendG.rotation.z=angle;document.getElementById("vt").textContent=(angle*180/Math.PI).toFixed(1)+"°";
if(acc<0){arrG2.rotation.z=Math.PI;arM2.rotation.z=Math.PI/2;ahM2.rotation.z=-Math.PI/2;}else{arrG2.rotation.z=0;arM2.rotation.z=-Math.PI/2;ahM2.rotation.z=Math.PI/2;}}
window.rst=rst;document.getElementById("sa").addEventListener("input",rst);
function anim(){requestAnimationFrame(anim);cartX+=acc*0.008;
if(cartX>5)cartX=-5;if(cartX<-5)cartX=5;
cartG.position.set(cartX,0,0);
O.update();R.render(S,C);}anim();rst();
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
