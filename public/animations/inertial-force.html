<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>非惯性系 · 惯性力</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:8px;font-size:11px;line-height:1.9;backdrop-filter:blur(6px);border-left:4px solid #dc2626}#p{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.92);padding:10px 14px;border-radius:8px;font-size:11px;line-height:2.2;backdrop-filter:blur(6px)}#p input{width:100px;accent-color:#dc2626}#p .v{color:#dc2626;font-weight:600}</style></head><body>
<div id="hud"><b>非惯性系 · 牵连惯性力</b><br>a=<span style="color:#dc2626" id="va">0.0</span> m/s²<br>&theta;=<span style="color:#2563eb" id="vt">0°</span> tan&theta;=a/g</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">import*as T from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");
var C=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,25);C.position.set(0,3,9);C.lookAt(0,1,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,1,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.5));S.add(new T.DirectionalLight("#ffffff",4).position.set(4,8,5));
S.add(new T.GridHelper(14,28,"#bbb","#e0e0e0"));
var cartG=new T.Group();S.add(cartG);
var cg=new T.BoxGeometry(2.5,1.5,1.2);
var cm=new T.Mesh(cg,new T.MeshStandardMaterial({color:"#9ca3af",roughness:0.4,metalness:0.3,opacity:0.22,transparent:true}));cm.castShadow=true;cartG.add(cm);
var ce=new T.LineSegments(new T.EdgesGeometry(cg),new T.LineBasicMaterial({color:"#6b7280"}));cartG.add(ce);
var rg=new T.CylinderGeometry(0.04,0.04,2.4,8);
var rm=new T.Mesh(rg,new T.MeshStandardMaterial({color:"#4a4f5a",roughness:0.5}));rm.rotation.z=Math.PI/2;rm.position.set(0,0.75,0);cartG.add(rm);
var wg=new T.CylinderGeometry(0.18,0.18,1.3,16);
var w1=new T.Mesh(wg,new T.MeshStandardMaterial({color:"#1f2937",roughness:0.5}));w1.rotation.x=Math.PI/2;w1.position.set(-1.0,-0.7,0);cartG.add(w1);
var w2=new T.Mesh(wg,new T.MeshStandardMaterial({color:"#1f2937",roughness:0.5}));w2.rotation.x=Math.PI/2;w2.position.set(1.0,-0.7,0);cartG.add(w2);
var pendG=new T.Group();cartG.add(pendG);pendG.position.set(0,0.75,0);
var stG=new T.CylinderGeometry(0.02,0.02,1.0,8);
var stM=new T.Mesh(stG,new T.MeshStandardMaterial({color:"#374151",roughness:0.5}));stM.position.y=-0.5;pendG.add(stM);
var bobG=new T.SphereGeometry(0.15,32,32);
var bobM=new T.Mesh(bobG,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.2,metalness:0.45}));bobM.position.y=-1.0;bobM.castShadow=true;pendG.add(bobM);
var arrG3=new T.Group();cartG.add(arrG3);arrG3.position.set(0,1.15,0);
var arG3=new T.CylinderGeometry(0.04,0.04,1.6,8);
var arM3=new T.Mesh(arG3,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.05,emissive:"#dc2626",emissiveIntensity:0.6}));arM3.rotation.z=-Math.PI/2;arM3.position.x=0;arrG3.add(arM3);
var ahG3=new T.ConeGeometry(0.10,0.35,8);
var ahM3=new T.Mesh(ahG3,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.05,emissive:"#dc2626",emissiveIntensity:0.6}));ahM3.rotation.z=-Math.PI/2;ahM3.position.x=1.0;arrG3.add(ahM3);
var accFix=2.0;var vel=0;var cartX=0;
function rst(){acc=parseInt(document.getElementById("sa").value)/10;vel=0;cartX=0;
document.getElementById("la").textContent=acc.toFixed(1);document.getElementById("va").textContent=acc.toFixed(1);
pendG.rotation.z=-Math.atan(acc/9.8);document.getElementById("vt").textContent=(Math.atan(acc/9.8)*180/Math.PI).toFixed(1)+"°";
if(acc<0){arrG3.rotation.z=Math.PI;}else{arrG3.rotation.z=0;}
}
window.rst=rst;document.getElementById("sa").addEventListener("input",rst);
function anim(){requestAnimationFrame(anim);
vel+=acc*0.016;cartX+=vel*0.016;
if(cartX>5){cartX=-5;vel=0;}if(cartX<-5){cartX=5;vel=0;}
cartG.position.set(cartX,0,0);O.update();R.render(S,C);}anim();rst();
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
