<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PINN 受拉杆 · 数据损失与物理损失</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a14;color:#cdd6f4;font-family:"Microsoft YaHei",sans-serif}
    #hud{position:absolute;left:16px;top:16px;max-width:390px;padding:12px 14px;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.75;backdrop-filter:blur(8px)}
    #panel{position:absolute;right:16px;top:16px;padding:10px 12px;background:rgba(10,12,24,.72);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.7}
    .ok{color:#a6e3a1}.warn{color:#f9e2af}.pink{color:#f5c2e7}.blue{color:#89b4fa}
  </style>
</head>
<body>
  <div id="hud">
    <b>PINN 受拉杆：小数据 + 物理约束</b><br>
    控制方程：EA·u''(x)=0，边界：u(0)=0，EA·u'(L)=F<br>
    经典解：u(x)=Fx/(EA)。紫色曲线为模拟训练中的 PINN 预测。
  </div>
  <div id="panel">
    训练步：<span id="step" class="blue">0</span><br>
    数据损失 L_data：<span id="ldata" class="pink">--</span><br>
    物理损失 L_pde：<span id="lpde" class="warn">--</span><br>
    最大误差：<span id="err" class="ok">--</span>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { quickSetup, MaterialPresets, GeometryHelpers, createAnimationLoop } from './js/animation-core.js';

    const { scene, camera, controls, composer } = quickSetup({ cameraPos:[3.4,2.3,5.2], target:[1.2,0.15,0], fov:44, near:0.1, far:80, exposure:1.12 });
    const steel = MaterialPresets.brushedAluminum();
    const exactMat = MaterialPresets.anodizedAluminum(0x8be9a8);
    const predMat = MaterialPresets.anodizedAluminum(0xcba6f7);
    const pointMat = MaterialPresets.brassPin();
    const grid = new THREE.GridHelper(4.5,18,0x39415f,0x20263a); grid.position.y=-0.55; scene.add(grid);

    const L=2.4, EA=1000, F=120, uL=F*L/EA, scale=4.0;
    const support = new THREE.Mesh(new THREE.BoxGeometry(0.12,1.0,0.72), MaterialPresets.castIron());
    support.position.set(0,0,0); support.castShadow=support.receiveShadow=true; scene.add(support);
    const forceArrow = makeArrow(0xf38ba8,0.55); forceArrow.position.set(L+0.25,0.3,0); forceArrow.rotation.z=-Math.PI/2; scene.add(forceArrow);

    const exactLine = makeCurveMesh(exactU, exactMat, -0.22);
    const predLine = makeCurveMesh((x)=>0, predMat, 0.22);
    scene.add(exactLine, predLine);

    const dataGroup = new THREE.Group(); scene.add(dataGroup);
    [0,L].forEach((x,i)=>{
      const y = exactU(x);
      const p = new THREE.Mesh(GeometryHelpers.createPinSphere(0.045,48), pointMat);
      p.position.set(x, y*scale, i===0?-0.22:0.22); p.castShadow=true; dataGroup.add(p);
    });

    function exactU(x){ return F*x/EA; }
    function predU(x,t){
      const base = exactU(x);
      const amp = 0.22 * Math.exp(-t*0.18);
      const shape = Math.sin(Math.PI*x/L) * (0.6*Math.cos(t*0.9)+0.4*Math.sin(2.2*x+t));
      return base + amp*shape;
    }
    function makeCurveMesh(fn, mat, z){
      const pts=[]; for(let i=0;i<=80;i++){ const x=L*i/80; pts.push(new THREE.Vector3(x, fn(x)*scale, z)); }
      const mesh = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),120,0.018,10,false), mat);
      mesh.castShadow=true; return mesh;
    }
    function refreshPred(t){
      predLine.geometry.dispose();
      predLine.geometry = makeCurveMesh((x)=>predU(x,t), predMat, 0.22).geometry;
      let maxErr=0, sumData=0, sumPde=0;
      for(let i=0;i<=40;i++){
        const x=L*i/40, h=0.015;
        const e=predU(x,t)-exactU(x); maxErr=Math.max(maxErr,Math.abs(e));
        const d2=(predU(Math.min(L,x+h),t)-2*predU(x,t)+predU(Math.max(0,x-h),t))/(h*h);
        sumPde += (EA*d2)*(EA*d2);
      }
      sumData = Math.pow(predU(0,t),2)+Math.pow(EA*(predU(L,t)-predU(L-0.02,t))/0.02-F,2)/(F*F);
      document.getElementById('step').textContent = Math.floor(t*900);
      document.getElementById('ldata').textContent = sumData.toFixed(4);
      document.getElementById('lpde').textContent = (sumPde/41/1e6).toFixed(4);
      document.getElementById('err').textContent = maxErr.toFixed(4)+' m';
    }
    function makeArrow(color,len){
      const g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.25,roughness:.35});
      const sh=new THREE.Mesh(GeometryHelpers.createCylinder(.018,.018,len*.75,48),mat); sh.position.y=len*.375; g.add(sh);
      const hd=new THREE.Mesh(new THREE.ConeGeometry(.06,len*.22,48),mat); hd.position.y=len*.86; g.add(hd); return g;
    }
    createAnimationLoop(null, scene, camera, { composer, controls }, (delta, elapsed)=>{ refreshPred((elapsed*0.8)%26); }).start();
  </script>
</body>
</html>
