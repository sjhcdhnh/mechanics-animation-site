<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>行星齿轮系</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#c{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0}.dot{width:12px;height:12px;border-radius:50%}.sep{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="c"></div>
<div class="panel"><div class="item"><span class="dot" style="background:#e63946"></span>太阳轮 z₁=20 (固定)</div><div class="sep"></div><div class="item"><span class="dot" style="background:#3a7bd5"></span>行星轮 z₂=16 ×3</div><div class="sep"></div><div class="item"><span class="dot" style="background:#2a9d8f"></span>齿圈 z₃=52</div><div class="sep"></div><div class="item" style="color:#ffd966">i=1+z₃/z₁=3.60 &nbsp; ω自转:ω公转=20:16</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;document.getElementById('c').appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,50);C.position.set(0,0,14);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const L=new T.DirectionalLight('#ffffff',5);L.position.set(8,10,6);L.castShadow=true;L.shadow.mapSize.set(2048,2048);S.add(L);
S.add(new T.DirectionalLight('#8a9bb5',2).position.set(-4,3,-4));S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));
S.add(new T.GridHelper(16,20,'#3a3f4a','#252830').translateY(-6));
S.add(new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15})).rotateX(-Math.PI/2).translateY(-6.1).receiveShadow=true);

// ── createPlanarGear ──
function gear(radius,teeth,material,thickness=.42,toothH=.6,toothD=.4,markerCol='#ff0'){
  const g=new T.Group();const sh=new T.Shape();const rr=radius-toothD,tr=radius+toothH;
  const step=Math.PI*2/teeth,tw=step*.42,gap=step-tw;let a=-tw/2;sh.moveTo(rr*Math.cos(a),rr*Math.sin(a));
  for(let i=0;i<teeth;i++){const t1=a+tw/2;sh.lineTo(tr*Math.cos(t1),tr*Math.sin(t1));a+=tw;sh.lineTo(tr*Math.cos(a),tr*Math.sin(a));sh.lineTo(rr*Math.cos(a),rr*Math.sin(a));a+=gap;sh.lineTo(rr*Math.cos(a),rr*Math.sin(a));}
  const hole=new T.Path();hole.absellipse(0,0,.55,.55,0,Math.PI*2,true);sh.holes.push(hole);
  g.add(new T.Mesh(new T.ExtrudeGeometry(sh,{steps:1,depth:thickness,bevelEnabled:false}),material).castShadow=true.receiveShadow=true);
  g.add(new T.Mesh(new T.CylinderGeometry(.5,.5,thickness+.08,24),new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85})).castShadow=true);
  // FAT colored sector on gear face — breaks symmetry, self-rotation visible
  const sectorShape=new T.Shape();sectorShape.moveTo(0,0);const sr=radius*.6;
  for(let i=0;i<=12;i++){const a2=(i/12-.5)*Math.PI/4;sectorShape.lineTo(sr*Math.cos(a2),sr*Math.sin(a2));}sectorShape.closePath();
  g.add(new T.Mesh(new T.ExtrudeGeometry(sectorShape,{steps:1,depth:thickness+.01,bevelEnabled:false}),
    new T.MeshStandardMaterial({color:markerCol,roughness:.1,emissive:markerCol,emissiveIntensity:.7})).translateZ(.02));
  return g;}

const mSun=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mPla=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mRng=new T.MeshStandardMaterial({color:'#2a9d8f',roughness:.25,metalness:.55});
const M=.16;const z1=20,z2=16,z3=52,R1=M*z1,R2=M*z2,R3=M*z3,Ra=R1+R2;

// Sun (fixed)
S.add(gear(R1,z1,mSun,.42,.6,.4,'#ff6b6b'));

// Ring (fixed, annular)
const ro=R3+.85,ri=R3-.45;
const rBody=new T.Mesh(new T.CylinderGeometry(ro,ro,.45,64,32,true),mRng);rBody.castShadow=true;S.add(rBody);
const rimM=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
[S.add(new T.Mesh(new T.TorusGeometry(ro,.05,16,90),rimM).rotateX(Math.PI/2).translateZ(.24));
S.add(new T.Mesh(new T.TorusGeometry(ro,.05,16,90),rimM).rotateX(Math.PI/2).translateZ(-.24))];
for(let i=0;i<z3;i++){const a=i*Math.PI*2/z3;const tw=(2*Math.PI*R3)/z3*.4;
  S.add(new T.Mesh(new T.BoxGeometry(.35,tw,.4),mRng).position.set(Math.cos(a)*(R3-.1),Math.sin(a)*(R3-.1),0).rotateZ(a).castShadow=true);}

// Carrier arm
const armG=new T.Group();S.add(armG);
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;
  const arm=new T.Mesh(new T.BoxGeometry(Ra,.025,.035),new T.MeshStandardMaterial({color:'#8d99a4',roughness:.4,metalness:.7}));arm.position.set(Math.cos(a)*Ra/2,Math.sin(a)*Ra/2,0);arm.rotation.z=a;armG.add(arm);}
armG.add(new T.Mesh(new T.CylinderGeometry(.22,.22,.25,24),rimM).translateZ(.14));

// Planet gears (3) — mounted on carrier arm
const pGs=[];
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;const pg=new T.Group();pg.position.set(Math.cos(a)*Ra,Math.sin(a)*Ra,0);armG.add(pg);pGs.push(pg);pg.add(gear(R2,z2,mPla,.42,.6,.4,'#ffff00'));}

// Pillars
const pMat=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});
function pil(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.18,.22,h,8),pMat);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pil(0,-5.8,ro-.3,1.5);pil(0,-5.8,-ro+.3,1.5);

// Particles
const pt=new T.BufferGeometry();const pa=new Float32Array(100*3);for(let i=0;i<100;i++){pa[i*3]=(Math.random()-.5)*18;pa[i*3+1]=(Math.random()-.5)*14;pa[i*3+2]=(Math.random()-.5)*12;}pt.setAttribute('position',new T.BufferAttribute(pa,3));const pts=new T.Points(pt,new T.PointsMaterial({color:'#bcc6d0',size:.07,transparent:true,opacity:.4,depthWrite:false}));S.add(pts);

const clock=new T.Clock();
(function L(){requestAnimationFrame(L);
  const dt=Math.min(clock.getDelta(),.1);
  an+=dt*2.5; // 2.5 rad/s 公转
  armG.rotation.z=an;
  pGs.forEach(p=>p.rotation.z=-an*(z1/z2)); // ωp=−3.125 rad/s 自转，连续光滑
  pts.rotation.z+=dt*.05;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
