<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>行星齿轮系 · 公转与自转</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#container{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.info-panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.info-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0;white-space:nowrap}.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}.divider{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="container"></div>
<div class="info-panel"><div class="info-item"><span class="color-dot" style="background:#e63946"></span>太阳轮 z₁=20</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#3a7bd5"></span>行星轮 z₂=16 ×3</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#2a9d8f"></span>齿圈 z₃=52</div><div class="divider"></div><div class="info-item" style="color:#ffd966">⚡ i = 1+z₃/z₁ = 3.60</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ct=document.getElementById('container');
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;ct.appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,50);C.position.set(0,0,16);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.minDistance=6;O.maxDistance=30;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const key=new T.DirectionalLight('#ffffff',5.5);key.position.set(10,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.far=40;key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;key.shadow.bias=-.0005;S.add(key);
S.add(new T.DirectionalLight('#8a9bb5',2.0).position.set(-5,3,-5));
S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,3));

const grid=new T.GridHelper(18,24,'#3a3f4a','#252830');grid.position.y=-8;S.add(grid);
const ground=new T.Mesh(new T.PlaneGeometry(24,24),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-8.1;ground.receiveShadow=true;S.add(ground);

// ── createPlanarGear (EXACT copy from gear-system.html) ──
const GEAR_THICK=.45,TOOTH_HEIGHT=.65,TOOTH_DEDENDUM=.45,TOOTH_W_RATIO=.45;
function createPlanarGear(radius,teeth,material,hubColor='#f4d03f'){
  const group=new T.Group();
  const shape=new T.Shape();const rootR=radius-TOOTH_DEDENDUM,tipR=radius+TOOTH_HEIGHT;
  const step=Math.PI*2/teeth,tAngle=step*TOOTH_W_RATIO,gAngle=step-tAngle;
  let a=-tAngle/2;shape.moveTo(rootR*Math.cos(a),rootR*Math.sin(a));
  for(let i=0;i<teeth;i++){const ts=a+tAngle/2;shape.lineTo(tipR*Math.cos(ts),tipR*Math.sin(ts));a+=tAngle;shape.lineTo(tipR*Math.cos(a),tipR*Math.sin(a));shape.lineTo(rootR*Math.cos(a),rootR*Math.sin(a));a+=gAngle;shape.lineTo(rootR*Math.cos(a),rootR*Math.sin(a));}
  const hole=new T.Path();hole.absellipse(0,0,.6,.6,0,Math.PI*2,true);shape.holes.push(hole);
  const geo=new T.ExtrudeGeometry(shape,{steps:1,depth:GEAR_THICK,bevelEnabled:false});
  const mesh=new T.Mesh(geo,material);mesh.castShadow=mesh.receiveShadow=true;group.add(mesh);
  const hubGeo=new T.CylinderGeometry(.55,.55,GEAR_THICK+.08,24);
  const hub=new T.Mesh(hubGeo,new T.MeshStandardMaterial({color:hubColor,roughness:.2,metalness:.85}));hub.castShadow=true;group.add(hub);
  return group;
}

const mSun=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mPlanet=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mRing=new T.MeshStandardMaterial({color:'#2a9d8f',roughness:.25,metalness:.55});
const mPillar=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});
const z1=20,z2=16,z3=52,M=.155,R1=M*z1,R2=M*z2,R3=M*z3,Ra=R1+R2;

// Sun gear at center, fixed
const sun=createPlanarGear(R1,z1,mSun);S.add(sun);

// Planet carrier arm
const armG=new T.Group();S.add(armG);
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;
  const arm=new T.Mesh(new T.BoxGeometry(Ra,.03,.04),new T.MeshStandardMaterial({color:'#8d99a4',roughness:.4,metalness:.7}));arm.position.set(Math.cos(a)*Ra/2,Math.sin(a)*Ra/2,0);arm.rotation.z=a;armG.add(arm);}
const armHub=new T.Mesh(new T.CylinderGeometry(.25,.25,.3,24),new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85}));armHub.position.z=.16;armG.add(armHub);

// Planet gears on carrier
const planets=[];
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;const pg=new T.Group();pg.position.set(Math.cos(a)*Ra,Math.sin(a)*Ra,0);armG.add(pg);planets.push(pg);
  pg.add(createPlanarGear(R2,z2,mPlanet));}

// Ring gear (fixed, uses same createPlanarGear for outer teeth, plus ring body)
// Outer ring: annular body + rim
const ringOuterR=R3+.9,ringInnerR=R3-.5;
const ringBody=new T.Mesh(new T.CylinderGeometry(ringOuterR,ringOuterR,.5,64,32,true),mRing);ringBody.castShadow=true;S.add(ringBody);
const ringRim=new T.Mesh(new T.TorusGeometry(ringOuterR,.05,16,80),new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85}));ringRim.rotation.x=Math.PI/2;ringRim.position.z=.27;S.add(ringRim);
const ringRim2=ringRim.clone();ringRim2.position.z=-.27;S.add(ringRim2);
// Internal teeth as small boxes around inner surface
for(let i=0;i<z3;i++){const a=i*Math.PI*2/z3;const tw=(2*Math.PI*R3)/z3*.4;
  const t=new T.Mesh(new T.BoxGeometry(.35,tw,.4),mRing);t.position.set(Math.cos(a)*(R3-.1),Math.sin(a)*(R3-.1),0);t.rotation.z=a;t.castShadow=true;S.add(t);}

// Pillars
function pillar(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.2,.24,h,8),mPillar);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pillar(0,-7.8,ringOuterR-.3,2);pillar(0,-7.8,-ringOuterR+.3,2);

// Particles
const pts=new T.BufferGeometry();const pa=new Float32Array(100*3);
for(let i=0;i<100;i++){pa[i*3]=(Math.random()-.5)*20;pa[i*3+1]=(Math.random()-.5)*16;pa[i*3+2]=(Math.random()-.5)*14;}
pts.setAttribute('position',new T.BufferAttribute(pa,3));
const particles=new T.Points(pts,new T.PointsMaterial({color:'#bcc6d0',size:.08,transparent:true,opacity:.4,depthWrite:false}));S.add(particles);

let ang=0;
(function a(){requestAnimationFrame(a);
  ang+=.012;armG.rotation.z=ang;planets.forEach(p=>p.rotation.z=-ang*(z1/z2));particles.rotation.z+=.0003;
  O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
