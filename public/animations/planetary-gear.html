<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>行星齿轮系 · 公转与自转</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#container{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.info-panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.info-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0;white-space:nowrap}.color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}.divider{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="container"></div>
<div class="info-panel"><div class="info-item"><span class="color-dot" style="background:#e63946"></span>太阳轮 固定</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#3a7bd5"></span>行星轮 ×3</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#2a9d8f"></span>齿圈 固定</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#f4d03f"></span>行星架 输入</div><div class="divider"></div><div class="info-item" style="color:#ffd966">i = 3.60</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ct=document.getElementById('container');
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;ct.appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,50);C.position.set(4,5,12);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.minDistance=4;O.maxDistance=20;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const key=new T.DirectionalLight('#ffffff',5.5);key.position.set(10,12,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.near=.5;key.shadow.camera.far=40;key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;key.shadow.bias=-.0005;S.add(key);
S.add(new T.DirectionalLight('#8a9bb5',2.0).position.set(-5,3,-5));
S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,3));

const grid=new T.GridHelper(14,20,'#3a3f4a','#252830');grid.position.y=-6;S.add(grid);
const ground=new T.Mesh(new T.PlaneGeometry(18,18),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-6.1;ground.receiveShadow=true;S.add(ground);

// Materials
const mSun=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mPlanet=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mRing=new T.MeshStandardMaterial({color:'#2a9d8f',roughness:.25,metalness:.55});
const mHub=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mPillar=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});

function createGear(r,teeth,material,thickness=.4,toothH=.5,toothD=.35){
  const g=new T.Group();const shape=new T.Shape();
  const rootR=r-toothD,tipR=r+toothH,step=Math.PI*2/teeth,tw=step*.45,gap=step-tw;
  let a=-tw/2;shape.moveTo(rootR*Math.cos(a),rootR*Math.sin(a));
  for(let i=0;i<teeth;i++){const t1=a+tw/2;shape.lineTo(tipR*Math.cos(t1),tipR*Math.sin(t1));a+=tw;shape.lineTo(tipR*Math.cos(a),tipR*Math.sin(a));shape.lineTo(rootR*Math.cos(a),rootR*Math.sin(a));a+=gap;shape.lineTo(rootR*Math.cos(a),rootR*Math.sin(a));}
  const hole=new T.Path();hole.absellipse(0,0,.25,.25,0,Math.PI*2,true);shape.holes.push(hole);
  const geo=new T.ExtrudeGeometry(shape,{steps:1,depth:thickness,bevelEnabled:false});
  const mesh=new T.Mesh(geo,material);mesh.castShadow=mesh.receiveShadow=true;g.add(mesh);
  const hub=new T.Mesh(new T.CylinderGeometry(.22,.22,thickness+.08,24),mHub);hub.castShadow=true;g.add(hub);
  return g;
}

const z1=20,z2=16,z3=52,m=.16,R1=m*z1,R2=m*z2,R3=m*z3,Ra=R1+R2;
// Sun (fixed)
S.add(createGear(R1,z1,mSun,.42,.45,.3));
// Ring (fixed outer)
const ringInnerR=R3+.1,ringOuterR=R3+.6;
const ringBody=new T.Mesh(new T.CylinderGeometry(ringOuterR,ringOuterR,.4,64,32,true),mRing);ringBody.castShadow=true;S.add(ringBody);
// Inner teeth
for(let i=0;i<z3;i++){const a=i*Math.PI*2/z3;const tw2=(2*Math.PI*R3)/z3*.45;
  const t=new T.Mesh(new T.BoxGeometry(.4,tw2,.35),mRing);t.position.set(Math.cos(a)*(R3-.15),0,Math.sin(a)*(R3-.15));t.rotation.y=a;t.castShadow=true;S.add(t);}
// Ring rims
const rimGeo2=new T.TorusGeometry(ringOuterR,.04,12,80);
[S.add(new T.Mesh(rimGeo2,mHub).rotateX(Math.PI/2).translateY(.22));S.add(new T.Mesh(rimGeo2,mHub).rotateX(Math.PI/2).translateY(-.22))];

// Carrier arm
const armG=new T.Group();S.add(armG);
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;
  const arm=new T.Mesh(new T.BoxGeometry(Ra,.04,.06),new T.MeshStandardMaterial({color:'#8d99a4',roughness:.4,metalness:.7}));arm.position.set(Math.cos(a)*Ra/2,Math.sin(a)*Ra/2,0);arm.rotation.z=a;armG.add(arm);}
const armHub=new T.Mesh(new T.CylinderGeometry(.18,.18,.35,24),mHub);armHub.position.y=.18;armG.add(armHub);

// Planets on carrier
const planetGs=[];
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;const pg=new T.Group();pg.position.set(Math.cos(a)*Ra,Math.sin(a)*Ra,0);armG.add(pg);planetGs.push(pg);
  const p=createGear(R2,z2,mPlanet,.38,.4,.28);pg.add(p);}

// Pillar supports
function pillar(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.15,.2,h,8),mPillar);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pillar(0,-5.9,0,2);pillar(ringOuterR-.3,-5.9,0,2);pillar(-ringOuterR+.3,-5.9,0,2);

// Particles
const pts=new T.BufferGeometry();const pa=new Float32Array(80*3);
for(let i=0;i<80;i++){pa[i*3]=(Math.random()-.5)*16;pa[i*3+1]=(Math.random()-.5)*14;pa[i*3+2]=(Math.random()-.5)*12;}
pts.setAttribute('position',new T.BufferAttribute(pa,3));
const particles=new T.Points(pts,new T.PointsMaterial({color:'#bcc6d0',size:.06,transparent:true,opacity:.4,depthWrite:false}));S.add(particles);

let ang=0;
(function a(t){requestAnimationFrame(a);ang+=.012;armG.rotation.z=ang;planetGs.forEach(p=>p.rotation.z=-ang*(z1/z2));particles.rotation.y+=.0005;
  O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
