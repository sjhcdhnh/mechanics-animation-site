<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>纯滚动 · 均质圆盘</title>
<style>body{margin:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.92);padding:12px 16px;border-radius:8px;font-size:11px;line-height:1.9;backdrop-filter:blur(6px);border-left:4px solid #2563eb}.b{color:#2563eb}.r{color:#dc2626}#rb{position:absolute;top:16px;right:16px;padding:5px 12px;border-radius:6px;border:1px solid #2563eb;background:rgba(37,99,235,.08);color:#2563eb;font-size:12px;cursor:pointer}#hint2{position:absolute;bottom:16px;right:16px;font-size:11px;color:#555}</style></head><body>
<div id="hud"><b>纯滚动 · 均质圆盘</b><br>v=<span class="b" id="vv">0.00</span> &omega;=<span class="r" id="vw">0.00</span><br>v=&omega;R &nbsp; a=2/3gsin20&deg;</div>
<button id="rb" onclick="document.querySelector('script')._s=0">⟳ 复位</button>
<div id="hint2">红线=标记·v=&omega;R·拖拽旋转</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.128.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.128.0/examples/jsm/"}}</script>
<script type="module">import*as T from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";
var S=new T.Scene();S.background=new T.Color("#87CEEB");S.fog=new T.Fog("#a4d3ee",6,22);
var C=new T.PerspectiveCamera(42,innerWidth/innerHeight,0.1,20);C.position.set(0,2,8);C.lookAt(1.5,0,0);
var R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
var O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(1.5,0,0);O.update();
S.add(new T.AmbientLight("#c0d0e0",3.5));S.add(new T.DirectionalLight("#ffffff",4).position.set(4,6,4));
S.add(new T.GridHelper(8,16,"#bbb","#e0e0e0"));
var th=20*Math.PI/180;var sT=Math.sin(th);var cT=Math.cos(th);
var incG=new T.Group();S.add(incG);
var ig=new T.BoxGeometry(6,0.08,1.5);
var im=new T.Mesh(ig,new T.MeshStandardMaterial({color:"#6b7280",roughness:0.4,metalness:0.5}));im.position.set(3,0,0);im.castShadow=true;im.receiveShadow=true;incG.add(im);
incG.rotation.z=th;

var discR2=0.28;
var discG2=new T.Group();S.add(discG2);
var dG2=new T.CylinderGeometry(discR2,discR2,0.10,48);
var dM2=new T.Mesh(dG2,new T.MeshStandardMaterial({color:"#2563eb",roughness:0.25,metalness:0.55}));dM2.rotation.x=Math.PI/2;dM2.castShadow=true;discG2.add(dM2);
var mkG=new T.BoxGeometry(0.015,0.26,0.11);
var mkM=new T.Mesh(mkG,new T.MeshStandardMaterial({color:"#dc2626",roughness:0.15,emissive:"#dc2626",emissiveIntensity:0.4}));discG2.add(mkM);
var huG2=new T.CylinderGeometry(0.04,0.04,0.13,12);
var huM2=new T.Mesh(huG2,new T.MeshStandardMaterial({color:"#f4d03f",roughness:0.2,metalness:0.85}));huM2.rotation.x=Math.PI/2;discG2.add(huM2);
var s2=0.6;var aRoll=2/3*9.8*sT;
function anim(){requestAnimationFrame(anim);s2+=0.008;if(s2>5.5)s2=0.6;
var v=Math.sqrt(2*aRoll*(s2-0.6));var omega2=v/discR2;var rotAng=(s2-0.6)/discR2;
var wx=s2*cT+0.04*sT+discR2*sT;var wy=-s2*sT+0.04*cT+discR2*cT;
discG2.position.set(wx,wy,0);discG2.rotation.z=-rotAng;
document.getElementById("vv").textContent=v.toFixed(2);document.getElementById("vw").textContent=omega2.toFixed(2);
O.update();R.render(S,C);}anim();
document.getElementById("rb").onclick=function(){s2=0.6;};
window.addEventListener("resize",function(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
