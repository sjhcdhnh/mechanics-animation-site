<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>工程应用 · 摇臂-转向架越障机构</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a14;color:#cdd6f4;font-family:"Microsoft YaHei",sans-serif}
    #hud{position:absolute;left:16px;top:16px;max-width:430px;padding:12px 14px;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.75;backdrop-filter:blur(8px)}
    .g{color:#a6e3a1}.y{color:#f9e2af}
  </style>
</head>
<body>
  <div id="hud"><b>工程应用：火星车摇臂-转向架越障</b><br>
    六轮接地点由地形高度决定，车体姿态取左右摇臂平均值，演示被动悬架如何提高通过性。<br>
    当前前轮抬升：<span id="lift" class="y">--</span> m，车体俯仰：<span id="pitch" class="g">--</span>°
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { quickSetup, MaterialPresets, GeometryHelpers, createAnimationLoop } from './js/animation-core.js';
    const { scene, camera, controls, composer } = quickSetup({ cameraPos:[3.8,2.2,4.8], target:[0.2,0.25,0], fov:42, near:.1, far:80, exposure:1.1 });
    const groundMat=new THREE.MeshStandardMaterial({color:0x9b6644,roughness:.92});
    const ground=new THREE.Mesh(new THREE.BoxGeometry(7,.08,2.8),groundMat); ground.position.y=-.04; ground.receiveShadow=true; scene.add(ground);
    const obstacle=new THREE.Mesh(new THREE.BoxGeometry(.75,.42,2.7),groundMat); obstacle.position.set(1.0,.21,0); obstacle.castShadow=obstacle.receiveShadow=true; scene.add(obstacle);
    const rover=new THREE.Group(); scene.add(rover);
    const body=new THREE.Mesh(new THREE.BoxGeometry(1.4,.36,.72),MaterialPresets.anodizedAluminum(0xc49564)); body.position.y=.85; body.castShadow=true; rover.add(body);
    const wheelMat=new THREE.MeshStandardMaterial({color:0x252525,roughness:.85});
    const metal=MaterialPresets.brushedAluminum(); const R=.18, xs=[-.75,0,.75], zs=[-.62,.62], wheels=[];
    function terrain(x){ return (Math.abs(x-1.0)<.38) ? .42 : 0; }
    function cylBetween(a,b,r){const d=b.clone().sub(a),m=a.clone().add(b).multiplyScalar(.5);const mesh=new THREE.Mesh(GeometryHelpers.createCylinder(r,r,d.length(),48),metal);mesh.position.copy(m);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());mesh.castShadow=true;return mesh;}
    zs.forEach(z=>xs.forEach(x=>{const g=new THREE.Group();const wh=new THREE.Mesh(GeometryHelpers.createCylinder(R,R,.16,64),wheelMat);wh.rotation.x=Math.PI/2;wh.castShadow=true;g.add(wh);g.userData={baseX:x,z};rover.add(g);wheels.push(g);}));
    const arms=new THREE.Group(); rover.add(arms);
    createAnimationLoop(null,scene,camera,{composer,controls},(delta,elapsed)=>{
      const x0=-1.9+((elapsed*.42)%4.2); rover.position.x=x0;
      arms.clear();
      let frontLift=0, leftAvg=0, rightAvg=0;
      wheels.forEach(w=>{const wx=x0+w.userData.baseX, h=terrain(wx); w.position.set(w.userData.baseX,h+R,w.userData.z); w.rotation.z-=.045; if(w.userData.baseX>.7)frontLift=h; if(w.userData.z>0)leftAvg+=h/3; else rightAvg+=h/3;});
      const pitch=Math.atan2((terrain(x0+.75)-terrain(x0-.75)),1.5)*.32; rover.rotation.z=0; rover.rotation.x=0; rover.rotation.y=0; body.rotation.z=-pitch;
      zs.forEach(z=>{const p=new THREE.Vector3(-.2,.72,z); const f=new THREE.Vector3(.75,wheels.find(w=>w.userData.baseX===.75&&w.userData.z===z).position.y,z); const m=new THREE.Vector3(0,wheels.find(w=>w.userData.baseX===0&&w.userData.z===z).position.y,z); const r=new THREE.Vector3(-.75,wheels.find(w=>w.userData.baseX===-.75&&w.userData.z===z).position.y,z); arms.add(cylBetween(p,f,.025),cylBetween(p,m,.025),cylBetween(m,r,.025));});
      document.getElementById('lift').textContent=frontLift.toFixed(2); document.getElementById('pitch').textContent=(THREE.MathUtils.radToDeg(pitch)).toFixed(1);
    }).start();
  </script>
</body>
</html>
