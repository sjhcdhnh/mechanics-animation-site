<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>苏格兰轭 · 简谐运动</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#container{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.info-panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;box-shadow:0 8px 28px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.info-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0}.color-dot{width:12px;height:12px;border-radius:50%}.divider{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="container"></div>
<div class="info-panel"><div class="info-item"><span class="color-dot" style="background:#e63946"></span>曲柄盘</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#3a7bd5"></span>轭架</div><div class="divider"></div><div class="info-item"><span class="color-dot" style="background:#f4d03f"></span>驱动销</div><div class="divider"></div><div class="info-item" style="color:#ffd966">x = R·cos(ωt) 简谐运动</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const ct=document.getElementById('container');
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;ct.appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,50);C.position.set(0,0,10);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.minDistance=4;O.maxDistance=22;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const key=new T.DirectionalLight('#ffffff',5.5);key.position.set(8,10,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.far=30;key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;key.shadow.bias=-.0005;S.add(key);
S.add(new T.DirectionalLight('#8a9bb5',2.0).position.set(-4,3,-4));
S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));

const grid=new T.GridHelper(12,18,'#3a3f4a','#252830');grid.position.y=-3.5;S.add(grid);
const ground=new T.Mesh(new T.PlaneGeometry(16,12),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-3.6;ground.receiveShadow=true;S.add(ground);

const mRed=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mBlue=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mGold=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mGray=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});
const mRail=new T.MeshStandardMaterial({color:'#8d99a4',roughness:.4,metalness:.7});
const Cr=.85;

// ── Crank disc (red, ExtrudeGeometry) ──
const crankG=new T.Group();S.add(crankG);
const cShape=new T.Shape();cShape.absarc(0,0,Cr,0,Math.PI*2,false);
const cHole=new T.Path();cHole.absellipse(0,0,.15,.15,0,Math.PI*2,true);cShape.holes.push(cHole);
crankG.add(new T.Mesh(new T.ExtrudeGeometry(cShape,{steps:1,depth:.12,bevelEnabled:false}),mRed).translateZ(-.06).castShadow=true);
crankG.add(new T.Mesh(new T.TorusGeometry(Cr,.03,12,64),mGold).rotateX(Math.PI/2).translateZ(-.1));
// Crank pin (gold, centered at radius Cr)
const crankPin=new T.Mesh(new T.CylinderGeometry(.07,.07,.2,24),mGold);crankPin.rotation.x=Math.PI/2;crankPin.castShadow=true;crankG.add(crankPin);
// Hub
crankG.add(new T.Mesh(new T.CylinderGeometry(.5,.5,.16,24),mGold).translateZ(.1));
crankG.add(new T.Mesh(new T.CylinderGeometry(.05,.05,.5,12),mGray).translateZ(.22));

// ── Yoke frame (blue) — horizontal bar + vertical slot + guides ──
const yokeG=new T.Group();S.add(yokeG);
const yW=3.2,yH=.15,slotH=Cr*2+.45;
// Horizontal beam (ExtrudeGeometry rectangular)
const hShape=new T.Shape();hShape.moveTo(-yW/2,-yH/2);hShape.lineTo(yW/2,-yH/2);hShape.lineTo(yW/2,yH/2);hShape.lineTo(-yW/2,yH/2);hShape.closePath();
yokeG.add(new T.Mesh(new T.ExtrudeGeometry(hShape,{steps:1,depth:.12,bevelEnabled:false}),mBlue).translateZ(-.06).castShadow=true);
// Vertical slot frame
const vShape=new T.Shape();vShape.moveTo(-yH/2,-slotH/2);vShape.lineTo(yH/2,-slotH/2);vShape.lineTo(yH/2,slotH/2);vShape.lineTo(-yH/2,slotH/2);vShape.closePath();
yokeG.add(new T.Mesh(new T.ExtrudeGeometry(vShape,{steps:1,depth:.12,bevelEnabled:false}),mBlue).translateZ(-.06).castShadow=true);
// Slot opening (dark)
yokeG.add(new T.Mesh(new T.BoxGeometry(.22,slotH-.12,.14),mGray));
// Corner gussets
[[yW/2,slotH/3],[yW/2,-slotH/3],[-yW/2,slotH/3],[-yW/2,-slotH/3]].forEach(([x,y])=>{
  const r2=new T.Mesh(new T.BoxGeometry(.06,slotH*.3,.12),mGray);r2.position.set(x,y,0);yokeG.add(r2);});
// End caps
yokeG.add(new T.Mesh(new T.TorusGeometry(.015,.01,6,12),mGold).rotateX(Math.PI/2).translateX(yW/2+.03).translateY(slotH/2-.05));
yokeG.add(new T.Mesh(new T.TorusGeometry(.015,.01,6,12),mGold).rotateX(Math.PI/2).translateX(yW/2+.03).translateY(-slotH/2+.05));

// ── Guide rails ──
[-Cr-.25,Cr+.25].forEach(y=>{
  const rail=new T.Mesh(new T.BoxGeometry(5,.03,.1),mRail);rail.position.set(0,y,-.45);S.add(rail);
  const post=new T.Mesh(new T.CylinderGeometry(.03,.03,.35,6),mGray);post.position.set(-2.5,y,-.22);S.add(post);
  const post2=new T.Mesh(new T.CylinderGeometry(.03,.03,.35,6),mGray);post2.position.set(2.5,y,-.22);S.add(post2);});

// ── Pillars ──
function pillar(x,y,z,h){const p=new T.Mesh(new T.CylinderGeometry(.12,.16,h,8),mGray);p.position.set(x,y,z);p.castShadow=true;S.add(p);}
pillar(0,-3,Cr+.3,.8);pillar(0,-3,-Cr-.3,.8);

// ── Particles ──
const pts=new T.BufferGeometry();const pa=new Float32Array(70*3);
for(let i=0;i<70;i++){pa[i*3]=(Math.random()-.5)*12;pa[i*3+1]=(Math.random()-.5)*8;pa[i*3+2]=(Math.random()-.5)*7;}
pts.setAttribute('position',new T.BufferAttribute(pa,3));
const particles=new T.Points(pts,new T.PointsMaterial({color:'#bcc6d0',size:.05,transparent:true,opacity:.4,depthWrite:false}));S.add(particles);

let ang=0;
(function a(){requestAnimationFrame(a);ang+=.022;crankG.rotation.z=ang;crankPin.position.set(Math.cos(ang)*Cr,Math.sin(ang)*Cr,0);yokeG.position.x=Math.cos(ang)*Cr;yokeG.position.y=Math.sin(ang)*Cr;particles.rotation.z+=.0004;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
