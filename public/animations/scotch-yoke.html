<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>苏格兰轭 · 简谐运动</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); color: #eee; padding: 8px 15px; border-radius: 8px; backdrop-filter: blur(8px); pointer-events: none; z-index: 10; font-size: 14px; border-left: 4px solid #ffaa33; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    </style>
</head>
<body>
    <div id="info"><span class="dot" style="background:#e63946;"></span>曲柄 <span class="dot" style="background:#3a7bd5;"></span>轭架 <span class="dot" style="background:#f4d03f;"></span>驱动销 x=R·cos(wt)</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a1d24');
        const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 40);
        camera.position.set(0, 0, 9); camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.12; controls.target.set(0, 0, 0); controls.update();

        scene.add(new THREE.AmbientLight('#3a4050', 2.2));
        scene.add(new THREE.HemisphereLight('#b0c0d8', '#282e3a', 1.6));
        const keyLight = new THREE.DirectionalLight('#ffffff', 5.5); keyLight.position.set(6, 8, 5);
        keyLight.castShadow = true; keyLight.shadow.mapSize.width = 2048; keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 30;
        keyLight.shadow.camera.left = -8; keyLight.shadow.camera.right = 8;
        keyLight.shadow.camera.top = 6; keyLight.shadow.camera.bottom = -6; keyLight.shadow.bias = -0.0005; scene.add(keyLight);
        scene.add(new THREE.DirectionalLight('#8a9bb5', 2.0).position.set(-3, 2, -3));
        scene.add(new THREE.DirectionalLight('#5a6b82', 1.8).position.set(0, -2, 2));

        const grid = new THREE.GridHelper(10, 16, '#3a3f4a', '#252830'); grid.position.y = -2.5; scene.add(grid);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshStandardMaterial({ color: '#1e2128', roughness: 0.9, metalness: 0.15 }));
        ground.rotation.x = -Math.PI / 2; ground.position.y = -2.6; ground.receiveShadow = true; scene.add(ground);

        const mR2 = new THREE.MeshStandardMaterial({ color: '#e63946', roughness: 0.25, metalness: 0.55 });
        const mB2 = new THREE.MeshStandardMaterial({ color: '#3a7bd5', roughness: 0.25, metalness: 0.55 });
        const mG2 = new THREE.MeshStandardMaterial({ color: '#f4d03f', roughness: 0.2, metalness: 0.85 });
        const mD2 = new THREE.MeshStandardMaterial({ color: '#4a4f5a', roughness: 0.55, metalness: 0.5 });
        const mS2 = new THREE.MeshStandardMaterial({ color: '#8d99a4', roughness: 0.4, metalness: 0.7 });
        const Cr = 0.8, slotH = Cr * 2 + 0.35, yW = 3.0;

        // --- Crank (red) ---
        const crankG = new THREE.Group(); scene.add(crankG);
        crankG.add(new THREE.Mesh(new THREE.CylinderGeometry(Cr, Cr, 0.1, 48), mR2).translateZ(-0.05).castShadow = true);
        crankG.add(new THREE.Mesh(new THREE.TorusGeometry(Cr, 0.03, 12, 64), mG2).rotateX(Math.PI / 2).translateZ(-0.08));
        crankG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.12, 24), mG2).translateZ(0.07));
        const cPin = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.18, 20), mG2); cPin.rotation.x = Math.PI / 2; crankG.add(cPin);
        crankG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 10), mD2).translateZ(0.16));

        // --- Yoke (blue) ---
        const yokeG = new THREE.Group(); scene.add(yokeG);
        yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(yW, 0.12, 0.12), mB2).castShadow = true);
        yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(0.12, slotH, 0.12), mB2).castShadow = true);
        yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(0.13, slotH - 0.1, 0.14), mD2));
        yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.12), mB2).translateY(slotH / 2));
        yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.12), mB2).translateY(-slotH / 2));
        [[yW / 2, slotH / 3.5], [yW / 2, -slotH / 3.5], [-yW / 2, slotH / 3.5], [-yW / 2, -slotH / 3.5]].forEach(([x, y]) => { yokeG.add(new THREE.Mesh(new THREE.BoxGeometry(0.05, slotH * 0.25, 0.12), mD2).position.set(x, y, 0)); });

        // --- Rails ---
        [-Cr - 0.2, Cr + 0.2].forEach(y => {
            scene.add(new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.03, 0.08), mS2).position.set(0, y, -0.4));
            scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 6), mD2).position.set(-2.2, y, -0.18));
            scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.3, 6), mD2).position.set(2.2, y, -0.18));
        });

        scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.6, 6), mD2).position.set(0, -2.2, Cr + 0.25).castShadow = true);
        scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.6, 6), mD2).position.set(0, -2.2, -Cr - 0.25).castShadow = true);

        const pGeo2 = new THREE.BufferGeometry(); const pArr2 = new Float32Array(60 * 3);
        for (let i = 0; i < 60; i++) { pArr2[i * 3] = (Math.random() - 0.5) * 10; pArr2[i * 3 + 1] = (Math.random() - 0.5) * 6; pArr2[i * 3 + 2] = (Math.random() - 0.5) * 5; }
        pGeo2.setAttribute('position', new THREE.BufferAttribute(pArr2, 3));
        const pts2 = new THREE.Points(pGeo2, new THREE.PointsMaterial({ color: '#bcc6d0', size: 0.045, transparent: true, opacity: 0.4, depthWrite: false })); scene.add(pts2);

        const clock2 = new THREE.Clock(); let an2 = 0;
        function animate() {
            const dt = Math.min(clock2.getDelta(), 0.1); an2 += dt * 2.5;
            crankG.rotation.z = an2; cPin.position.set(Math.cos(an2) * Cr, Math.sin(an2) * Cr, 0);
            yokeG.position.x = Math.cos(an2) * Cr; yokeG.position.y = Math.sin(an2) * Cr;
            pts2.rotation.z += dt * 0.04; controls.update(); renderer.render(scene, camera); requestAnimationFrame(animate);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    </script>
</body>
</html>
