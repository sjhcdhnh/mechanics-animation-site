<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>苏格兰轭 · 简谐运动</title>
<style>:root{--bg:#15171c}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;height:100vh;width:100vw}#c{position:fixed;top:0;left:0;width:100%;height:100%}canvas{display:block}
.panel{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(30,30,38,.88);backdrop-filter:blur(18px);border-radius:20px;padding:14px 24px;display:flex;align-items:center;gap:16px;z-index:10;border:1px solid rgba(255,255,255,.08)}.item{display:flex;align-items:center;gap:8px;font-size:13px;color:#e0e0e0}.dot{width:12px;height:12px;border-radius:50%}.sep{width:1px;height:16px;background:#4a4a55}
</style></head><body>
<div id="c"></div>
<div class="panel"><div class="item"><span class="dot" style="background:#e63946"></span>曲柄</div><div class="sep"></div><div class="item"><span class="dot" style="background:#3a7bd5"></span>轭架</div><div class="sep"></div><div class="item"><span class="dot" style="background:#f4d03f"></span>驱动销</div><div class="sep"></div><div class="item" style="color:#ffd966">x = R·cos(ωt)</div></div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#1a1d24');
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.3;document.getElementById('c').appendChild(R.domElement);
const C=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,40);C.position.set(0,0,9);C.lookAt(0,0,0);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.dampingFactor=.12;O.update();
S.add(new T.AmbientLight('#3a4050',2.2));S.add(new T.HemisphereLight('#b0c0d8','#282e3a',1.6));
const L=new T.DirectionalLight('#ffffff',5);L.position.set(6,8,5);L.castShadow=true;L.shadow.mapSize.set(2048,2048);S.add(L);
S.add(new T.DirectionalLight('#8a9bb5',2).position.set(-3,2,-3));S.add(new T.DirectionalLight('#5a6b82',1.8).position.set(0,-2,2));
S.add(new T.GridHelper(10,16,'#3a3f4a','#252830').translateY(-2.5));
S.add(new T.Mesh(new T.PlaneGeometry(14,10),new T.MeshStandardMaterial({color:'#1e2128',roughness:.9,metalness:.15})).rotateX(-Math.PI/2).translateY(-2.6).receiveShadow=true);

const mR=new T.MeshStandardMaterial({color:'#e63946',roughness:.25,metalness:.55});
const mB2=new T.MeshStandardMaterial({color:'#3a7bd5',roughness:.25,metalness:.55});
const mG=new T.MeshStandardMaterial({color:'#f4d03f',roughness:.2,metalness:.85});
const mD=new T.MeshStandardMaterial({color:'#4a4f5a',roughness:.55,metalness:.5});
const mS=new T.MeshStandardMaterial({color:'#8d99a4',roughness:.4,metalness:.7});
const Cr=.8;

// ── Crank disc (red) ──
const crankG=new T.Group();S.add(crankG);
// Disc body (CylinderGeometry)
crankG.add(new T.Mesh(new T.CylinderGeometry(Cr,Cr,.1,48),mR).translateZ(-.05).castShadow=true);
// Rim ring
crankG.add(new T.Mesh(new T.TorusGeometry(Cr,.03,12,64),mG).rotateX(Math.PI/2).translateZ(-.08));
// Hub
crankG.add(new T.Mesh(new T.CylinderGeometry(.45,.45,.12,24),mG).translateZ(.07));
// Crank pin (gold)
const cPin=new T.Mesh(new T.CylinderGeometry(.065,.065,.18,20),mG);cPin.rotation.x=Math.PI/2;crankG.add(cPin);
// Shaft
crankG.add(new T.Mesh(new T.CylinderGeometry(.04,.04,.4,10),mD).translateZ(.16));

// ── Yoke (blue, horizontal slider) ──
const yokeG=new T.Group();S.add(yokeG);
const yW=3.0,slotH=Cr*2+.35;
// Horizontal bar (blue)
yokeG.add(new T.Mesh(new T.BoxGeometry(yW,.12,.12),mB2).translateZ(0).castShadow=true);
// Vertical slot frame (two bars)
yokeG.add(new T.Mesh(new T.BoxGeometry(.12,slotH,.12),mB2).translateZ(0).castShadow=true);
// Slot gap (dark gap inside vertical frame)
yokeG.add(new T.Mesh(new T.BoxGeometry(.13,slotH-.1,.14),mD).translateZ(0));
// Top and bottom caps
yokeG.add(new T.Mesh(new T.BoxGeometry(.16,.1,.12),mB2).translateY(slotH/2).translateZ(0));
yokeG.add(new T.Mesh(new T.BoxGeometry(.16,.1,.12),mB2).translateY(-slotH/2).translateZ(0));
// Corner reinforcements
[[yW/2,slotH/3.5],[yW/2,-slotH/3.5],[-yW/2,slotH/3.5],[-yW/2,-slotH/3.5]].forEach(([x,y])=>{
  yokeG.add(new T.Mesh(new T.BoxGeometry(.05,slotH*.25,.12),mD).position.set(x,y,0));});

// ── Guide rails ──
[-Cr-.2,Cr+.2].forEach(y=>{
  S.add(new T.Mesh(new T.BoxGeometry(4.5,.03,.08),mS).position.set(0,y,-.4));
  S.add(new T.Mesh(new T.CylinderGeometry(.025,.025,.3,6),mD).position.set(-2.2,y,-.18));
  S.add(new T.Mesh(new T.CylinderGeometry(.025,.025,.3,6),mD).position.set(2.2,y,-.18));});

// Pillars
function pil(x,y,z,h){S.add(new T.Mesh(new T.CylinderGeometry(.1,.14,h,6),mD).position.set(x,y,z).castShadow=true);}
pil(0,-2.2,Cr+.25,.6);pil(0,-2.2,-Cr-.25,.6);

// Particles
const pt=new T.BufferGeometry();const pa=new Float32Array(50*3);for(let i=0;i<50;i++){pa[i*3]=(Math.random()-.5)*10;pa[i*3+1]=(Math.random()-.5)*6;pa[i*3+2]=(Math.random()-.5)*5;}pt.setAttribute('position',new T.BufferAttribute(pa,3));const pts=new T.Points(pt,new T.PointsMaterial({color:'#bcc6d0',size:.045,transparent:true,opacity:.4,depthWrite:false}));S.add(pts);

const clock=new T.Clock();
let an=0;
(function L(){requestAnimationFrame(L);const dt=Math.min(clock.getDelta(),.1);an+=dt*2.5;crankG.rotation.z=an;
  cPin.position.set(Math.cos(an)*Cr,Math.sin(an)*Cr,0);
  yokeG.position.x=Math.cos(an)*Cr;yokeG.position.y=Math.sin(an)*Cr;
  pts.rotation.z+=.0004;O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
