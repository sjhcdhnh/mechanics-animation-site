<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>苏格兰轭机构 · 简谐往复运动</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0a0a14;color:#cdd6f4;font-family:"Microsoft YaHei",sans-serif}
    #hud{position:absolute;left:16px;top:16px;max-width:420px;padding:12px 14px;background:rgba(10,12,24,.78);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;line-height:1.75;backdrop-filter:blur(8px)}
    #hint{position:absolute;right:16px;bottom:16px;padding:8px 12px;background:rgba(10,12,24,.65);border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px}
    .x{color:#89b4fa}.v{color:#a6e3a1}.a{color:#f38ba8}
  </style>
</head>
<body>
  <div id="hud"><b>苏格兰轭机构：旋转 ↔ 简谐直线运动</b><br>
    曲柄销在轭架竖直槽内滑动，轭架被水平导轨约束。<br>
    x=R cosθ，v=-Rω sinθ，a=-Rω² cosθ<br>
    x=<span id="xv" class="x">--</span> m，v=<span id="vv" class="v">--</span> m/s，a=<span id="av" class="a">--</span> m/s²
  </div>
  <div id="hint">拖拽旋转 · 滚轮缩放</div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { quickSetup, MaterialPresets, GeometryHelpers, createAnimationLoop } from './js/animation-core.js';
    const {scene,camera,controls,composer}=quickSetup({cameraPos:[0,-5.6,4.2],target:[0,0,0],fov:42,near:.1,far:70,exposure:1.08});
    scene.add(new THREE.GridHelper(5.5,22,0x39415f,0x20263a));

    const matFrame=MaterialPresets.castIron(), matCrank=MaterialPresets.anodizedAluminum(0xf38ba8);
    const matYoke=MaterialPresets.anodizedAluminum(0x89b4fa), matPin=MaterialPresets.brassPin();
    const matRod=MaterialPresets.brushedAluminum();
    const R=.72, omega=1.25;

    const frame=new THREE.Group(); scene.add(frame);
    const railTop=new THREE.Mesh(new THREE.BoxGeometry(3.8,.07,.08),matFrame); railTop.position.set(0,.62,0); frame.add(railTop);
    const railBot=new THREE.Mesh(new THREE.BoxGeometry(3.8,.07,.08),matFrame); railBot.position.set(0,-.62,0); frame.add(railBot);
    const base=new THREE.Mesh(new THREE.BoxGeometry(.18,1.45,.1),matFrame); base.position.set(-1.55,0,0); frame.add(base);
    [railTop,railBot,base].forEach(m=>{m.castShadow=m.receiveShadow=true;});

    const crank=new THREE.Group(); scene.add(crank);
    const disk=new THREE.Mesh(GeometryHelpers.createCylinder(.82,.82,.08,96),matCrank); disk.rotation.x=Math.PI/2; disk.receiveShadow=true; crank.add(disk);
    const crankArm=new THREE.Mesh(GeometryHelpers.createRoundedLink(R,.09,.08,.025,3),matRod); crankArm.position.x=R/2; crank.add(crankArm);
    const pin=new THREE.Mesh(GeometryHelpers.createPinSphere(.09,64),matPin); pin.position.x=R; crank.add(pin);

    const yoke=new THREE.Group(); scene.add(yoke);
    const yokeBody=new THREE.Mesh(new THREE.BoxGeometry(.74,1.55,.13),matYoke); yokeBody.castShadow=true; yoke.add(yokeBody);
    const slot=new THREE.Mesh(new THREE.BoxGeometry(.18,1.2,.15),new THREE.MeshStandardMaterial({color:0x0a0a14,roughness:.8,metalness:0})); slot.position.z=.015; yoke.add(slot);
    const piston=new THREE.Mesh(new THREE.BoxGeometry(.58,.38,.28),MaterialPresets.anodizedAluminum(0xa6e3a1)); piston.position.set(1.45,0,0); piston.castShadow=true; yoke.add(piston);
    const pistonRod=new THREE.Mesh(GeometryHelpers.createCylinder(.035,.035,1.1,48),matRod); pistonRod.rotation.z=Math.PI/2; pistonRod.position.set(.82,0,0); yoke.add(pistonRod);

    const wave=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xf9e2af})); wave.position.set(-2.15,-1.35,.02); scene.add(wave);
    const wavePts=[];

    createAnimationLoop(null,scene,camera,{composer,controls},(delta,elapsed)=>{
      const th=omega*elapsed, x=R*Math.cos(th), v=-R*omega*Math.sin(th), acc=-R*omega*omega*Math.cos(th);
      crank.rotation.z=th; yoke.position.x=x;
      wavePts.push(new THREE.Vector3((elapsed*.35)%3.2, x*.45, 0)); if(wavePts.length>180)wavePts.shift();
      const pts=wavePts.map((p,i)=>new THREE.Vector3(-1.6+i/55,p.y,0)); wave.geometry.dispose(); wave.geometry=new THREE.BufferGeometry().setFromPoints(pts);
      document.getElementById('xv').textContent=x.toFixed(3);
      document.getElementById('vv').textContent=v.toFixed(3);
      document.getElementById('av').textContent=acc.toFixed(3);
    }).start();
  </script>
</body>
</html>
