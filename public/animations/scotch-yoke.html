<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>苏格兰轭机构 · 简谐运动</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#87CEEB;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a2e}
#hud{position:absolute;top:14px;left:14px;padding:10px 14px;background:rgba(255,255,255,.85);border-radius:6px;font-size:12px;line-height:1.65;backdrop-filter:blur(4px)}
#hud b{color:#2563eb}#hud span.r{color:#dc2626}
#hint{position:absolute;bottom:14px;right:14px;padding:6px 10px;background:rgba(255,255,255,.6);border-radius:6px;font-size:11px;color:#555}
</style></head><body>
<div id="hud"><b>苏格兰轭 (Scotch Yoke)</b><br>曲柄 <span class="r">●</span> 半径 R=1.2<br>轭架 <span style="color:#2563eb">●</span> 水平往复<br>位移 x=R·cos(ωt) 简谐运动<br>转角: <span id="vang">0°</span> &nbsp; 滑快位移: <span id="vx">0.00</span></div>
<div id="hint">拖拽旋转 · 滚轮缩放</div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#87CEEB');S.fog=new T.Fog('#a4d3ee',8,30);
const C=new T.PerspectiveCamera(40,innerWidth/innerHeight,.5,20);C.position.set(0,0,7);C.lookAt(0,0,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.update();
S.add(new T.AmbientLight('#ffffff',3));S.add(new T.DirectionalLight('#ffffff',2).position.set(3,5,4));
const grid=new T.GridHelper(8,16,'#ccc','#eee');grid.position.z=-1.5;S.add(grid);
const base=new T.Mesh(new T.PlaneGeometry(6,3),new T.MeshStandardMaterial({color:'#e8e8ec',roughness:.8}));base.position.set(0,-1.3,-1);S.add(base);

const mRed=new T.MeshStandardMaterial({color:'#dc2626',metalness:.3,roughness:.4});
const mBlue=new T.MeshStandardMaterial({color:'#2563eb',metalness:.3,roughness:.4});
const mGray=new T.MeshStandardMaterial({color:'#71717a',metalness:.5,roughness:.3});
const mPin=new T.MeshStandardMaterial({color:'#fbbf24',metalness:.6,roughness:.2,emissive:'#fbbf24',emissiveIntensity:.4});
const Rc=1.2;

// Crank disc (red)
const crankG=new T.Group();S.add(crankG);
crankG.add(new T.Mesh(new T.CylinderGeometry(Rc,Rc,.06,48),mRed).translateZ(-.03));
crankG.add(new T.Mesh(new T.TorusGeometry(Rc,.025,16,64),mRed).translateZ(-.03));
// Crank pin (yellow, at radius Rc)
const pin=new T.Mesh(new T.CylinderGeometry(.08,.08,.3,16),mPin);pin.rotation.x=Math.PI/2;crankG.add(pin);
// Center shaft
crankG.add(new T.Mesh(new T.CylinderGeometry(.06,.06,.5,16),mGray).translateZ(.28));
crankG.position.set(0,0,0);

// Yoke (blue) - horizontal slider
const yokeG=new T.Group();
const yH=.2,yW=3.2,yD=.15;
const yokeBody=new T.Mesh(new T.BoxGeometry(yW,yH,yD),mBlue);yokeG.add(yokeBody);
// Slot in yoke (gray gap)
const slotGeo=new T.BoxGeometry(.26,.18,.16);
const slotFill=new T.Mesh(slotGeo,mGray);yokeG.add(slotFill);
// Top and bottom rails
[.32,-.32].forEach(dy=>{
  const rail=new T.Mesh(new T.BoxGeometry(yW+.2,.06,.12),mGray);rail.position.y=dy;yokeG.add(rail);
  const post=new T.Mesh(new T.BoxGeometry(.06,.32,.12),mGray);post.position.x=yW/2+.1;post.position.y=dy;yokeG.add(post);
  const post2=post.clone();post2.position.x=-yW/2-.1;yokeG.add(post2);
});
yokeG.position.set(0,0,0);
S.add(yokeG);

// Guide rails (horizontal)
[-.4-Rc*Math.sin(Math.PI/4)*.3,.4+Rc*Math.sin(Math.PI/4)*.3].forEach(dy=>{
  const rail=new T.Mesh(new T.BoxGeometry(5,.04,.08),new T.MeshStandardMaterial({color:'#999',metalness:.5,roughness:.4}));
  rail.position.y=dy;rail.position.z=-.6;S.add(rail);
});

let ang=0;
function animate(t){
  requestAnimationFrame(animate);ang+=.02;
  crankG.rotation.z=ang;
  pin.position.set(Math.cos(ang)*Rc,Math.sin(ang)*Rc,0);
  yokeG.position.x=Math.cos(ang)*Rc;
  yokeG.position.y=Math.sin(ang)*Rc;
  document.getElementById('vang').textContent=Math.round(ang%(Math.PI*2)*180/Math.PI)+'°';
  document.getElementById('vx').textContent=(Math.cos(ang)*Rc).toFixed(2);
  O.update();R.render(S,C);
}
requestAnimationFrame(animate);
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
