<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>苏格兰轭 · 简谐运动</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#87CEEB;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#hud{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.88);padding:10px 16px;border-radius:8px;font-size:12px;line-height:1.7;backdrop-filter:blur(6px);border-left:4px solid #dc2626}
#hud b{color:#dc2626}#hint{position:absolute;bottom:16px;right:16px;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:6px;font-size:11px;color:#555}
</style></head>
<body>
<div id="hud"><b>苏格兰轭 (Scotch Yoke)</b><br>曲柄 ● &nbsp; 轭架 ● 水平往复<br>位移 x = R·cos(ωt) 简谐运动<br>曲柄转角: <span id="va">0°</span> &nbsp; 滑块位移: <span id="vx">0.00</span></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
<script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type=module>
import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#87CEEB');S.fog=new T.Fog('#a4d3ee',6,25);
const C=new T.PerspectiveCamera(40,innerWidth/innerHeight,.3,20);C.position.set(0,0,8);C.lookAt(0,0,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,0,0);O.enableDamping=true;O.update();
S.add(new T.AmbientLight('#ffffff',2.5));const L=new T.DirectionalLight('#ffffff',3);L.position.set(3,5,4);L.castShadow=true;L.shadow.mapSize.set(1024,1024);S.add(L);
S.add(new T.DirectionalLight('#8899cc',1).position.set(-2,2,-2));
S.add(new T.GridHelper(7,14,'#ccc','#e8e8e8'));

const mRed=new T.MeshStandardMaterial({color:'#dc2626',metalness:.85,roughness:.28,emissive:'#220000',emissiveIntensity:.1});
const mBlue=new T.MeshStandardMaterial({color:'#2563eb',metalness:.85,roughness:.28,emissive:'#000022',emissiveIntensity:.1});
const mPin=new T.MeshStandardMaterial({color:'#fbbf24',metalness:.7,roughness:.2,emissive:'#fbbf24',emissiveIntensity:.5});
const mBrass=new T.MeshStandardMaterial({color:'#d4a853',metalness:.7,roughness:.35});
const mGray=new T.MeshStandardMaterial({color:'#6b7280',metalness:.6,roughness:.4});
const Cr=.9; // crank radius

// ── Crank wheel (red) ──
const crankG=new T.Group();S.add(crankG);
crankG.add(new T.Mesh(new T.CylinderGeometry(Cr,Cr,.1,48),mRed).translateY(-.05).castShadow=true);
crankG.add(new T.Mesh(new T.TorusGeometry(Cr,.02,16,80),mBrass).rotateX(Math.PI/2).translateY(-.1));
const crankPin=new T.Mesh(new T.CylinderGeometry(.08,.08,.25,16),mPin);crankPin.rotation.x=Math.PI/2;crankG.add(crankPin);
crankG.add(new T.Mesh(new T.CylinderGeometry(.06,.06,.5,16),mBrass).translateY(.27));

// ── Yoke frame (blue, horizontal slider) ──
const yokeG=new T.Group();S.add(yokeG);
// Main horizontal beam
const yW=3.2,yH=.16;
yokeG.add(new T.Mesh(new T.BoxGeometry(yW,yH,.15),mBlue).translateY(0).castShadow=true);
// Vertical slot frame
const slotH=Cr*2+.3;
yokeG.add(new T.Mesh(new T.BoxGeometry(yH,slotH,.15),mBlue).translateY(0).castShadow=true);
// Slot opening (dark gap)
yokeG.add(new T.Mesh(new T.BoxGeometry(.26,slotH-.15,.18),mGray).translateY(0));
// Top/bot rails
[[yW/2,slotH/4],[yW/2,-slotH/4],[-yW/2,slotH/4],[-yW/2,-slotH/4]].forEach(([x,y])=>{
  yokeG.add(new T.Mesh(new T.BoxGeometry(.08,slotH*.45,.15),mGray).translateX(x).translateY(y));
});
yokeG.add(new T.Mesh(new T.TorusGeometry(.02,.015,8,16),mBrass).rotateX(Math.PI/2).translateY(slotH/2+.05).translateX(yW/2+.04));
yokeG.add(new T.Mesh(new T.TorusGeometry(.02,.015,8,16),mBrass).rotateX(Math.PI/2).translateY(-slotH/2-.05).translateX(yW/2+.04));

// ── Guide rails ──
[-Cr-.2,Cr+.2].forEach(y=>{
  const rail=new T.Mesh(new T.BoxGeometry(5,.04,.12),mGray);rail.position.y=y;rail.position.z=-.6;S.add(rail);
  S.add(new T.Mesh(new T.CylinderGeometry(.03,.03,.4,8),mGray).translateX(-2.5).translateY(y).translateZ(-.3));
  S.add(new T.Mesh(new T.CylinderGeometry(.03,.03,.4,8),mGray).translateX(2.5).translateY(y).translateZ(-.3));
});

// ── Base ──
S.add(new T.Mesh(new T.BoxGeometry(6,.04,1.8),new T.MeshStandardMaterial({color:'#e5e7eb',metalness:.4,roughness:.6})).translateY(-1).translateZ(-.7).receiveShadow=true);

// ── Animation ──
let ang=0;
function animate(t){requestAnimationFrame(animate);ang+=.02;
  crankG.rotation.z=ang;
  crankPin.position.set(Math.cos(ang)*Cr,Math.sin(ang)*Cr,0);
  yokeG.position.x=Math.cos(ang)*Cr;
  yokeG.position.y=Math.sin(ang)*Cr;
  document.getElementById('va').textContent=Math.round(ang*180/Math.PI%360)+'°';
  document.getElementById('vx').textContent=(Math.cos(ang)*Cr).toFixed(2);
  O.update();R.render(S,C);
}requestAnimationFrame(animate);
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
