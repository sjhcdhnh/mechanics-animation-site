<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单摆 · 简谐运动演示</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a14;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #cdd6f4;
  }
  #title {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 16px; letter-spacing: 1px;
    color: #e0e6f8; pointer-events: none;
    text-shadow: 0 2px 6px #000;
  }
  #hud {
    position: absolute; top: 12px; left: 12px;
    padding: 12px 16px; min-width: 220px;
    background: rgba(20, 22, 38, 0.7);
    border: 1px solid #2a2f4a;
    border-radius: 6px;
    font-size: 13px; line-height: 1.85;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #f5e0dc; font-weight: 600; }
  #hud .v { color: #a6e3a1; font-family: "Consolas", monospace; }
  #legend {
    position: absolute; bottom: 14px; left: 12px;
    padding: 10px 14px;
    background: rgba(20, 22, 38, 0.7);
    border: 1px solid #2a2f4a;
    border-radius: 6px;
    font-size: 12px; line-height: 1.8;
  }
  #legend .sw {
    display: inline-block; width: 14px; height: 10px; margin-right: 6px;
    border-radius: 2px; vertical-align: middle;
    border: 1px solid rgba(255,255,255,0.15);
  }
  #hint {
    position: absolute; bottom: 14px; right: 12px;
    padding: 8px 12px;
    background: rgba(20, 22, 38, 0.5);
    border: 1px solid #2a2f4a;
    border-radius: 6px;
    font-size: 11px; color: #8b95b8;
  }
</style>
</head>
<body>

<div id="title">单摆 · 简谐运动演示</div>

<div id="hud">
  <div><b>实时运动量</b></div>
  <div>摆角 θ : <span id="v_theta" class="v">—</span></div>
  <div>角速度 ω : <span id="v_omega" class="v">—</span></div>
  <div>周期 T : <span id="v_T" class="v">—</span></div>
</div>

<div id="legend">
  <div><b>图例</b></div>
  <div><span class="sw" style="background:#6b7280"></span>悬挂点 / 支架</div>
  <div><span class="sw" style="background:#f5e0dc"></span>摆绳</div>
  <div><span class="sw" style="background:#ff6b35"></span>摆球</div>
</div>

<div id="hint">
  鼠标左键拖拽：旋转视角　|　滚轮：缩放　|　右键拖拽：平移
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 *  参数
 * ============================================================ */
const L = 2.0;        // 摆长 (m)
const g = 9.81;       // 重力加速度 (m/s²)
const theta0 = 0.35;  // 初始摆角 (rad) ≈ 20°

/* ============================================================
 *  场景 / 相机 / 渲染器
 * ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4, 1.5, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -L / 2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 15;
controls.update();

/* ============================================================
 *  灯光
 * ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
keyLight.position.set(5, 8, 5);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.3);
fillLight.position.set(-3, -2, -3);
scene.add(fillLight);

/* ============================================================
 *  地面参考网格
 * ============================================================ */
const grid = new THREE.GridHelper(6, 20, 0x333355, 0x1a1a2e);
grid.position.y = -L - 0.5;
scene.add(grid);

/* ============================================================
 *  支架
 * ============================================================ */
const frameMat = new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.4, roughness: 0.5 });

const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.5, 16), frameMat);
pillar.position.y = 0.75;
scene.add(pillar);

const beam = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.06), frameMat);
beam.position.set(0.1, 1.48, 0);
scene.add(beam);

/* ============================================================
 *  摆绳（用细圆柱 + Group 旋转）
 * ============================================================ */
const ropeGroup = new THREE.Group();
scene.add(ropeGroup);

const ropeGeom = new THREE.CylinderGeometry(0.018, 0.018, L, 8);
const ropeMat = new THREE.MeshStandardMaterial({ color: 0xf5e0dc, metalness: 0.2, roughness: 0.6 });
const rope = new THREE.Mesh(ropeGeom, ropeMat);
rope.position.y = -L / 2;
ropeGroup.add(rope);

/* ============================================================
 *  摆球
 * ============================================================ */
const bobMat = new THREE.MeshStandardMaterial({ color: 0xff6b35, metalness: 0.5, roughness: 0.3 });
const bob = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), bobMat);
ropeGroup.add(bob);

/* ============================================================
 *  悬挂点小球
 * ============================================================ */
const pivot = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xf5e0dc, metalness: 0.7, roughness: 0.2, emissive: 0x332211, emissiveIntensity: 0.3 })
);
pivot.position.set(0, 0, 0);
scene.add(pivot);

/* ============================================================
 *  HUD
 * ============================================================ */
const ui = {
  theta: document.getElementById('v_theta'),
  omega: document.getElementById('v_omega'),
  T:     document.getElementById('v_T'),
};

ui.T.textContent = (2 * Math.PI * Math.sqrt(L / g)).toFixed(3) + ' s';

/* ============================================================
 *  运动学：θ(t) = θ₀ · cos(ωₙ·t)   其中 ωₙ = √(g/L)
 * ============================================================ */
const omega_n = Math.sqrt(g / L);
const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  const theta = theta0 * Math.cos(omega_n * t);
  const omega = -theta0 * omega_n * Math.sin(omega_n * t);

  ropeGroup.rotation.z = theta;
  bob.position.set(0, -L, 0);

  ui.theta.textContent = (theta * 180 / Math.PI).toFixed(2) + ' °';
  ui.omega.textContent = omega.toFixed(3) + ' rad/s';

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
