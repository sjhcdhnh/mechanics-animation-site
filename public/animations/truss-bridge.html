<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>Warren桁架铁路桥 · 内力可视化</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:16px;color:#e0e6f8;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8;backdrop-filter:blur(4px);min-width:200px}
#hud b{color:#f5e0dc;font-weight:600}
#toggle{position:absolute;top:12px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:8px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);user-select:none}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8}
.sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15)}
#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8}
</style></head>
<body>
<div id="title">Warren 桁架铁路桥 · 内力可视化</div>
<div id="hud"><b>Warren 桁架桥</b><br>跨度: <span style="color:#a6e3a1">60 m</span> · 桥宽: <span style="color:#a6e3a1">5 m</span><br>节间: <span style="color:#a6e3a1">8</span> · 杆件: <span id="mc">--</span><br>最大拉力: <span style="color:#3b82f6" id="mt">--</span><br>最大压力: <span style="color:#ef4444" id="mcp">--</span></div>
<div id="toggle" onclick="toggleForces()"><span id="td" style="width:10px;height:10px;border-radius:50%;background:#3b82f6;box-shadow:0 0 6px #3b82f6"></span>内力显示: <span id="tl">开</span></div>
<div id="legend"><span class="sw" style="background:#3b82f6"></span>拉力 <span class="sw" style="background:#ef4444"></span>压力 <span style="margin-left:8px;color:#71717a">杆粗细正比于力值</span></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type="module">
import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#0a0a14');S.fog=new T.Fog('#0a0a14',15,45);
const C=new T.PerspectiveCamera(45,innerWidth/innerHeight,0.5,60);C.position.set(10,4,14);C.lookAt(0,1.5,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.1;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,1.5,0);O.enableDamping=true;O.update();
S.add(new T.AmbientLight('#404060',2.5));const L=new T.DirectionalLight('#fff',6);L.position.set(8,12,6);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.camera.near=0.5;L.shadow.camera.far=50;L.shadow.camera.left=-18;L.shadow.camera.right=18;L.shadow.camera.top=12;L.shadow.camera.bottom=-4;S.add(L);
S.add(new T.DirectionalLight('#8899cc',1.5).position.set(-4,4,-4));
S.add(new T.GridHelper(20,20,'#2a2f4a','#1a1f2e').translateY(-2.5));

const span=12,H=2,width=2,panels=8,pW=span/panels;
// ── 2D solver per truss side ──
function solveSide(){
  const J=[];for(let i=0;i<=panels;i++)J.push({x:-span/2+i*pW,y:0});for(let i=0;i<=panels;i++)J.push({x:-span/2+i*pW,y:H});
  J[0].px=true;J[0].py=true;J[panels].py=true; // pin + roller
  const M=[];for(let i=0;i<panels;i++){
    M.push({a:i,b:i+1});M.push({a:i+panels+1,b:i+panels+2});
    M.push({a:i,b:i+panels+2});
    if(i%2===0)M.push({a:i,b:i+panels+1});else M.push({a:i+1,b:i+panels+1});
  }
  const nM=M.length,nJ=J.length,A=Array.from({length:2*nJ},()=>new Array(nM).fill(0)),b=new Array(2*nJ).fill(0);
  M.forEach((m,i)=>{const j1=J[m.a],j2=J[m.b];const dx=j2.x-j1.x,dy=j2.y-j1.y;const L2=Math.sqrt(dx*dx+dy*dy),cx=dx/L2,cy=dy/L2;
    A[2*m.a][i]=-cx;A[2*m.a+1][i]=-cy;A[2*m.b][i]=cx;A[2*m.b+1][i]=cy;
  });
  for(let i=1;i<panels;i++)b[2*i+1]=25; // half load per side
  const skip=[0,1,2*panels+1];const eqs=[];for(let i=0;i<2*nJ;i++)if(!skip.includes(i))eqs.push(i);
  const sz=eqs.length,mat=Array.from({length:sz},(_,r)=>{const row=[];for(let c=0;c<nM;c++)row.push(A[eqs[r]][c]);row.push(b[eqs[r]]);return row;});
  for(let c=0;c<Math.min(sz,nM);c++){let p=-1;for(let r=c;r<sz;r++)if(Math.abs(mat[r][c])>1e-8){p=r;break;}if(p===-1)continue;[mat[c],mat[p]]=[mat[p],mat[c]];for(let r=c+1;r<sz;r++){const f=mat[r][c]/mat[c][c];for(let k=c;k<=nM;k++)mat[r][k]-=f*mat[c][k];}}
  const F=new Array(nM).fill(0);for(let i=Math.min(sz,nM)-1;i>=0;i--){if(Math.abs(mat[i][i])<1e-8)continue;let s=mat[i][nM];for(let j=i+1;j<nM;j++)s-=mat[i][j]*F[j];F[i]=s/mat[i][i];}
  return {joints:J,members:M,forces:F};
}
const side=solveSide();
document.getElementById('mc').textContent=side.members.length*2; // both sides

// ── Render ──
const gF=new T.Group(),gN=new T.Group();let show=true;S.add(gF);S.add(gN);
const mT=new T.MeshStandardMaterial({color:'#3b82f6',metalness:.15,roughness:.5,emissive:'#3b82f6',emissiveIntensity:.25});
const mC=new T.MeshStandardMaterial({color:'#ef4444',metalness:.15,roughness:.5,emissive:'#ef4444',emissiveIntensity:.25});
const mZ=new T.MeshStandardMaterial({color:'#555566',metalness:.2,roughness:.6});
const mG=new T.MeshStandardMaterial({color:'#71717a',metalness:.3,roughness:.6});
const mJ=new T.MeshStandardMaterial({color:'#e8e8f0',metalness:.6,roughness:.3});

function beam(x1,y1,z1,x2,y2,z2,r,mat){const d=new T.Vector3(x2-x1,y2-y1,z2-z1);const len=d.length();const geo=new T.CylinderGeometry(r,r,len,8);const m=new T.Mesh(geo,mat);m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());m.castShadow=true;return m;}
function ball(x,y,z){const s=new T.Mesh(new T.SphereGeometry(.1,12,12),mJ.clone());s.position.set(x,y,z);s.castShadow=true;return s;}

const maxF=Math.max(...side.forces.map(Math.abs),1);
let mt=0,mc2=0;side.forces.forEach(f=>{if(f>mt)mt=f;if(-f>mc2)mc2=-f;});
[-width/2,width/2].forEach(z=>{
  side.members.forEach((m,i)=>{
    const j1=side.joints[m.a],j2=side.joints[m.b],f=side.forces[i],af=Math.abs(f)/maxF,r=.04+af*.08;
    let mat;if(f>.01*maxF)mat=mT;else if(f<-.01*maxF)mat=mC;else mat=mZ;
    gF.add(beam(j1.x,j1.y,z,j2.x,j2.y,z,r,mat));gN.add(beam(j1.x,j1.y,z,j2.x,j2.y,z,.04,mG));
  });
  side.joints.forEach(j=>{gF.add(ball(j.x,j.y,z));gN.add(ball(j.x,j.y,z));});
});
// Cross-bracing between sides
for(let i=0;i<=panels;i++){const x=-span/2+i*pW;
  [0,H].forEach(y=>{gF.add(beam(x,y,-width/2,x,y,width/2,.04,mZ));gN.add(beam(x,y,-width/2,x,y,width/2,.04,mG));});
}
gN.visible=false;

document.getElementById('mt').textContent=mt.toFixed(1)+' kN';
document.getElementById('mcp').textContent=mc2.toFixed(1)+' kN';

// ── Extras ──
// Deck
const deck=new T.Mesh(new T.BoxGeometry(span+1,.06,width+.3),new T.MeshStandardMaterial({color:'#4a4a58',metalness:.3,roughness:.7}));deck.position.y=-.25;deck.receiveShadow=true;S.add(deck);
// Piers
[-span/2,span/2].forEach(x=>{const p=new T.Mesh(new T.BoxGeometry(.5,3,width+.5),new T.MeshStandardMaterial({color:'#6a6a76',metalness:.4,roughness:.5}));p.position.set(x,-2.2,0);p.castShadow=true;p.receiveShadow=true;S.add(p);});
// Rails
[-width/2+.15,width/2-.15].forEach(z=>{const rail=new T.Mesh(new T.CylinderGeometry(.03,.03,span+.5,8),new T.MeshStandardMaterial({color:'#999',metalness:.8,roughness:.3}));rail.rotation.z=Math.PI/2;rail.position.set(0,-.18,z);rail.castShadow=true;S.add(rail);});
// Load arrows at lower chord nodes
for(let i=1;i<panels;i++){
  [-width/2,width/2].forEach(z=>{const a=new T.Mesh(new T.ConeGeometry(.1,.4,8),new T.MeshStandardMaterial({color:'#f9a8d4',emissive:'#f9a8d4',emissiveIntensity:.3}));a.position.set(-span/2+i*pW,-.75,z);a.rotation.z=Math.PI;S.add(a);});
}

window.toggleForces=function(){show=!show;gF.visible=show;gN.visible=!show;document.getElementById('td').style.background=show?'#3b82f6':'#555';document.getElementById('td').style.boxShadow=show?'0 0 6px #3b82f6':'none';document.getElementById('tl').textContent=show?'开':'关';};

(function a(){requestAnimationFrame(a);O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
