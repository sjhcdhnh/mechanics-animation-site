<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Warren桁架铁路桥 · 内力可视化</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4;}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:16px;color:#e0e6f8;pointer-events:none;text-shadow:0 2px 6px #000;}
#hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8;backdrop-filter:blur(4px);min-width:200px;}
#hud b{color:#f5e0dc;font-weight:600;}
#toggle{position:absolute;top:12px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:8px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);user-select:none;}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8;}
.sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15);}
#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8;}
</style>
</head>
<body>
<div id="title">Warren 桁架铁路桥 · 内力可视化</div>
<div id="hud">
  <b>🌉 Warren 桁架桥</b><br>
  跨度: <span style="color:#a6e3a1">60 m</span> · 高度: <span style="color:#a6e3a1">10 m</span><br>
  节间: <span style="color:#a6e3a1">8</span> · 杆件: <span id="mc">--</span><br>
  最大拉力: <span style="color:#4ecdc4" id="mt">--</span><br>
  最大压力: <span style="color:#f38ba8" id="mc2">--</span>
</div>
<div id="toggle" onclick="toggleForces()"><span id="td" style="width:10px;height:10px;border-radius:50%;background:#4ecdc4;box-shadow:0 0 6px #4ecdc4;"></span>内力显示: <span id="tl">开</span></div>
<div id="legend">
  <span class="sw" style="background:#4ecdc4;"></span>拉力 (Tension)
  <span class="sw" style="background:#f38ba8;"></span>压力 (Compression)
  <span style="margin-left:8px;color:#71717a;">杆粗细正比于内力大小</span>
</div>
<div id="hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#0a0a14');scene.fog=new THREE.Fog('#0a0a14',15,50);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.5,80);cam.position.set(8,5,16);cam.lookAt(0,2,0);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.1;document.body.appendChild(ren.domElement);
const ctrl=new OrbitControls(cam,ren.domElement);ctrl.target.set(0,3,0);ctrl.enableDamping=true;ctrl.update();

scene.add(new THREE.AmbientLight('#404060',2));
const sun=new THREE.DirectionalLight('#fff',6);sun.position.set(8,12,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=0.5;sun.shadow.camera.far=60;sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=15;sun.shadow.camera.bottom=-5;scene.add(sun);
scene.add(new THREE.DirectionalLight('#8899cc',2).position.set(-4,4,-4));
scene.add(new THREE.GridHelper(20,20,'#2a2f4a','#1a1f2e').translateY(-1.5));

// ── Warren Truss Bridge ──
const span=12,height=2,panels=8,panelW=span/panels;
const joints=[],members=[];
// Lower chord joints (j0..j8)
for(let i=0;i<=panels;i++)joints.push({x:-span/2+i*panelW,y:0});
// Upper chord joints (j9..j17)
for(let i=0;i<=panels;i++)joints.push({x:-span/2+i*panelW,y:height});
// Boundary: j0=pin, j8=roller
joints[0].pinned=true; joints[panels].roller=true;
// Members
for(let i=0;i<panels;i++){
  members.push({a:i,b:i+1});          // lower chord
  members.push({a:i+panels+1,b:i+panels+2}); // upper chord
  members.push({a:i,b:i+panels+2});   // diagonal
  if(i%2===0)members.push({a:i,b:i+panels+1}); // vertical (even panels)
  else members.push({a:i+1,b:i+panels+1});     // vertical (odd panels)
}

// ── Solve (2D Method of Joints) ──
function solve(){
  const nJ=joints.length,nM=members.length;
  const A=Array.from({length:2*nJ},()=>new Array(nM).fill(0));
  const b=new Array(2*nJ).fill(0);
  // Equilibrium at each joint
  members.forEach((m,i)=>{const j1=joints[m.a],j2=joints[m.b];const dx=j2.x-j1.x,dy=j2.y-j1.y;const L=Math.sqrt(dx*dx+dy*dy),cx=dx/L,cy=dy/L;
    A[2*m.a][i]=-cx;A[2*m.a+1][i]=-cy;A[2*m.b][i]=cx;A[2*m.b+1][i]=cy;
  });
  // External loads: P=50kN downward at each lower chord joint
  for(let i=1;i<panels;i++)b[2*i+1]=50;
  // Constraints: j0 x,y fixed; j8 y fixed
  const eqs=[];for(let i=0;i<2*nJ;i++){
    if(i===0||i===1||i===2*panels+1)continue; // constrained DOFs
    eqs.push(i);
  }
  const sz=eqs.length,mat=Array.from({length:sz},(_,r)=>{const row=[...A[eqs[r]],b[eqs[r]]];return row;});
  // Gaussian elimination
  for(let c=0;c<Math.min(sz,nM);c++){
    let p=-1;for(let r=c;r<sz;r++)if(Math.abs(mat[r][c])>1e-8){p=r;break;}if(p===-1)continue;
    [mat[c],mat[p]]=[mat[p],mat[c]];
    for(let r=c+1;r<sz;r++){const f=mat[r][c]/mat[c][c];for(let k=c;k<=nM;k++)mat[r][k]-=f*mat[c][k];}
  }
  const forces=new Array(nM).fill(0);
  for(let i=Math.min(sz,nM)-1;i>=0;i--){if(Math.abs(mat[i][i])<1e-8)continue;let s=mat[i][nM];for(let j=i+1;j<nM;j++)s-=mat[i][j]*forces[j];forces[i]=s/mat[i][i];}
  return forces;
}
const forces=solve();
document.getElementById('mc').textContent=members.length;

// ── Build geometry ──
const gForce=new THREE.Group(),gNorm=new THREE.Group();let showForce=true;scene.add(gForce);scene.add(gNorm);
const matT=new THREE.MeshStandardMaterial({color:'#4ecdc4',metalness:0.15,roughness:0.5,emissive:'#4ecdc4',emissiveIntensity:0.25});
const matC=new THREE.MeshStandardMaterial({color:'#f38ba8',metalness:0.15,roughness:0.5,emissive:'#f38ba8',emissiveIntensity:0.25});
const matZ=new THREE.MeshStandardMaterial({color:'#555566',metalness:0.2,roughness:0.6});
const matGray=new THREE.MeshStandardMaterial({color:'#71717a',metalness:0.3,roughness:0.6});
const matJoint=new THREE.MeshStandardMaterial({color:'#e8e8f0',metalness:0.6,roughness:0.3,emissive:'#fff',emissiveIntensity:0.15});

function beam(x1,y1,x2,y2,r,material){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy),midX=(x1+x2)/2,midY=(y1+y2)/2;
  const geo=new THREE.CylinderGeometry(r,r,len,8);const m=new THREE.Mesh(geo,material);
  m.position.set(midX,midY,0);m.rotation.z=Math.atan2(dy,dx);m.castShadow=true;return m;
}
function nodeBall(x,y){const s=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16),matJoint.clone());s.position.set(x,y,0);s.castShadow=true;return s;}

const maxF=Math.max(...forces.map(Math.abs));
let maxT=0,maxC=0;
forces.forEach(f=>{if(f>maxT)maxT=f;if(-f>maxC)maxC=-f;});
members.forEach((m,i)=>{
  const j1=joints[m.a],j2=joints[m.b],f=forces[i],af=Math.abs(f)/maxF,r=0.05+af*0.12;
  let mat;if(f>0.01*maxF)mat=matT;else if(f<-0.01*maxF)mat=matC;else mat=matZ;
  gForce.add(beam(j1.x,j1.y,j2.x,j2.y,r,mat));
  gNorm.add(beam(j1.x,j1.y,j2.x,j2.y,0.05,matGray));
});
joints.forEach(j=>{gForce.add(nodeBall(j.x,j.y));gNorm.add(nodeBall(j.x,j.y));});
gNorm.visible=false;

document.getElementById('mt').textContent=maxT.toFixed(1)+' kN';
document.getElementById('mc2').textContent=maxC.toFixed(1)+' kN';

// ── Bridge extras ──
function addExtras(){
  // Deck slab
  const deck=new THREE.Mesh(new THREE.BoxGeometry(span+1,0.08,1.5),new THREE.MeshStandardMaterial({color:'#4a4a58',metalness:0.3,roughness:0.7}));
  deck.position.y=-0.3;deck.receiveShadow=true;scene.add(deck);
  // Left pier
  const pier=new THREE.Mesh(new THREE.BoxGeometry(0.5,2.5,1.8),new THREE.MeshStandardMaterial({color:'#6a6a76',metalness:0.4,roughness:0.5}));
  pier.position.set(-span/2,-2,0);pier.castShadow=true;pier.receiveShadow=true;scene.add(pier);
  // Right pier
  const pier2=pier.clone();pier2.position.x=span/2;scene.add(pier2);
  // Rails
  [-0.35,0.35].forEach(z=>{const railGeo=new THREE.CylinderGeometry(0.04,0.04,span+1,8);const rail=new THREE.Mesh(railGeo,new THREE.MeshStandardMaterial({color:'#999',metalness:0.8,roughness:0.3}));rail.rotation.z=Math.PI/2;rail.position.set(0,-0.2,z);rail.castShadow=true;scene.add(rail);});
  // Load arrows
  for(let i=1;i<panels;i++){
    const arrow=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.5,8),new THREE.MeshStandardMaterial({color:'#f9a8d4',emissive:'#f9a8d4',emissiveIntensity:0.3}));
    arrow.position.set(-span/2+i*panelW,-0.8,0);arrow.rotation.z=Math.PI;scene.add(arrow);
  }
}
addExtras();

// ── Toggle ──
window.toggleForces=function(){showForce=!showForce;gForce.visible=showForce;gNorm.visible=!showForce;
  document.getElementById('td').style.background=showForce?'#4ecdc4':'#555';document.getElementById('td').style.boxShadow=showForce?'0 0 6px #4ecdc4':'none';
  document.getElementById('tl').textContent=showForce?'开':'关';};

function animate(){requestAnimationFrame(animate);ctrl.update();ren.render(scene,cam);}animate();
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
</script></body></html>
