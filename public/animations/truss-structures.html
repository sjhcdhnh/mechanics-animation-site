<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>桁架结构内力可视化 · 桥梁 · 发射塔 · 输电塔</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4;}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:16px;color:#e0e6f8;pointer-events:none;text-shadow:0 2px 6px #000;}
#tabs{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
  background:rgba(20,22,38,0.8);border:1px solid #2a2f4a;border-radius:8px;padding:3px;backdrop-filter:blur(4px);}
.tab{padding:6px 18px;border-radius:6px;font-size:12px;cursor:pointer;color:#8b95b8;
  transition:all .2s;border:none;background:transparent;white-space:nowrap;}
.tab.active{background:#2a2f5a;color:#e0e6f8;font-weight:600;}
.tab:hover:not(.active){color:#cdd6f4;background:rgba(255,255,255,0.03);}
#hud{position:absolute;top:100px;left:12px;padding:10px 14px;min-width:180px;

#hud b{color:#f5e0dc;font-weight:600;}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;

#legend .sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15);}
#toggle{position:absolute;top:102px;right:16px;display:flex;align-items:center;gap:8px;
  padding:8px 14px;background:rgba(20,22,38,0.7);border:1px solid #2a2f4a;border-radius:8px;
  font-size:12px;cursor:pointer;backdrop-filter:blur(4px);transition:all .2s;}
#toggle:hover{background:rgba(40,42,68,0.8);}
#toggle .dot{width:10px;height:10px;border-radius:50%;transition:all .2s;}

#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;
  background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8;}
</style>
</head>
<body>
<div id="title">桁架结构内力可视化</div>
<div id="tabs">
  <button class="tab active" data-model="0">🌉 铁路桥</button>
  <button class="tab" data-model="1">🚀 发射塔</button>
  <button class="tab" data-model="2">⚡ 输电塔</button>
</div>
<div id="hud">
  <b id="model-name">Warren 桁架铁路桥</b><br>
  杆件总数: <span id="member-count">--</span><br>
  节点总数: <span id="joint-count">--</span><br>
  最大拉力: <span style="color:#4ecdc4" id="max-t">--</span><br>
  最大压力: <span style="color:#f38ba8" id="max-c">--</span>
</div>
<div id="toggle" onclick="toggleForces()">
  <span class="dot on" id="toggle-dot"></span>
  <span id="toggle-label">内力显示: 开</span>
</div>
<div id="legend">
  <span class="sw" style="background:#4ecdc4;"></span> 拉力 (Tension)
  <span class="sw" style="background:#f38ba8;"></span> 压力 (Compression)
  <span class="sw" style="background:#555;"></span> 零杆 (Zero Force)
  <span style="margin-left:8px;color:#71717a;">杆粗细=力大小</span>
</div>
<div id="hint">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 顶栏切换模型</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#0a0a14');
scene.fog=new THREE.Fog('#0a0a14',10,60);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.5,100);cam.position.set(8,6,15);cam.lookAt(0,2,0);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.1;
document.body.appendChild(ren.domElement);
const ctrl=new OrbitControls(cam,ren.domElement);ctrl.target.set(0,2,0);ctrl.enableDamping=true;ctrl.dampingFactor=0.08;ctrl.update();
scene.add(new THREE.AmbientLight('#404060',1.8));
const sun=new THREE.DirectionalLight('#fff',5);sun.position.set(10,15,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=0.5;sun.shadow.camera.far=80;sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-5;scene.add(sun);
scene.add(new THREE.DirectionalLight('#8888cc',1.2).position.set(-5,3,-3));
const grid=new THREE.GridHelper(30,30,'#2a2f4a','#1a1f2e');grid.position.y=-3;scene.add(grid);

// ── State ──
let currentModel=0,showForces=true;
const models=[],forceGroups=[],normalGroups=[];

// ── Solver: Method of Joints ──
function solveTruss(joints,members){
  const n=joints.length,m=members.length;
  const A=Array.from({length:2*n},()=>Array(2*n).fill(0));
  const b=Array(2*n).fill(0);
  // Build equilibrium: ΣFx=0, ΣFy=0 at each free joint
  members.forEach((mem,i)=>{
    const dx=joints[mem.j2].x-joints[mem.j1].x,dy=joints[mem.j2].y-joints[mem.j1].y;
    const len=Math.sqrt(dx*dx+dy*dy),cx=dx/len,cy=dy/len;
    [mem.j1,mem.j2].forEach((j,side)=>{
      const sign=side===0?-1:1;
      const r=2*j;
      if(joints[j].freeX!==false){if(A[r]){A[r][i]=sign*cx;}else{A[r]=[];A[r][i]=sign*cx;}}
      if(joints[j].freeY!==false){if(A[r+1]){A[r+1][i]=sign*cy;}else{A[r+1]=[];A[r+1][i]=sign*cy;}}
    });
  });
  // External loads
  joints.forEach((j,idx)=>{
    if(j.fx&&j.freeX!==false){const r=2*idx;b[r]=-(j.fx||0);}
    if(j.fy&&j.freeY!==false){const r=2*idx+1;b[r]=-(j.fy||0);}
  });
  // Filter active equations
  const activeEqs=[];for(let i=0;i<2*n;i++){const row=A[i];if(row&&Object.keys(row).length>0)activeEqs.push(i);}
  if(activeEqs.length===0||activeEqs.length<m)return members.map(()=>0);
  // Solve via Gaussian elimination (simplified)
  const size=activeEqs.length;
  const mat=Array.from({length:size},(_,r)=>Array(size+1).fill(0));
  for(let r=0;r<size;r++){const eq=activeEqs[r];for(let c=0;c<m;c++)mat[r][c]=A[eq][c]||0;mat[r][size]=b[eq];}
  // Gaussian elimination
  for(let col=0;col<Math.min(size,m);col++){
    let pivot=-1;for(let row=col;row<size;row++)if(Math.abs(mat[row][col])>1e-10){pivot=row;break;}
    if(pivot===-1)continue;
    [mat[col],mat[pivot]]=[mat[pivot],mat[col]];
    for(let row=col+1;row<size;row++){
      const f=mat[row][col]/mat[col][col];
      for(let c=col;c<=size;c++)mat[row][c]-=f*mat[col][c];
    }
  }
  const forces=Array(m).fill(0);
  for(let i=Math.min(size,m)-1;i>=0;i--){
    if(Math.abs(mat[i][i])<1e-10)continue;
    let sum=mat[i][size];
    for(let j=i+1;j<m;j++)sum-=mat[i][j]*forces[j];
    forces[i]=sum/mat[i][i];
  }
  return forces;
}

// ── Geometry helpers ──
function cyl(x1,y1,z1,x2,y2,z2,r,mat){const dx=x2-x1,dy=y2-y1,dz=z2-z1;const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  const geo=new THREE.CylinderGeometry(r,r,len,8);const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
  mesh.rotation.z=Math.PI/2;mesh.rotation.x=Math.atan2(dy,Math.sqrt(dx*dx+dz*dz));mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
function sphere(x,y,z,r,mat){const s=new THREE.Mesh(new THREE.SphereGeometry(r,16,16),mat);s.position.set(x,y,z);s.castShadow=true;return s;}

// ── Force color ──
const matT=new THREE.MeshStandardMaterial({color:'#4ecdc4',metalness:0.2,roughness:0.5,emissive:'#4ecdc4',emissiveIntensity:0.3});
const matC=new THREE.MeshStandardMaterial({color:'#f38ba8',metalness:0.2,roughness:0.5,emissive:'#f38ba8',emissiveIntensity:0.3});
const matZ=new THREE.MeshStandardMaterial({color:'#555566',metalness:0.2,roughness:0.6});
const matGray=new THREE.MeshStandardMaterial({color:'#71717a',metalness:0.3,roughness:0.6});
const matJoint=new THREE.MeshStandardMaterial({color:'#e0e6f8',metalness:0.5,roughness:0.3,emissive:'#fff',emissiveIntensity:0.2});

function renderTruss(joints,members,forces,parentF,parentN){
  parentF.clear();parentN.clear();
  const maxF=Math.max(...forces.map(Math.abs),1);
  members.forEach((mem,i)=>{
    const j1=joints[mem.j1],j2=joints[mem.j2];
    const f=forces[i],af=Math.abs(f)/maxF;
    const r=0.04+af*0.1;
    const p1=new THREE.Vector3(j1.x,j1.y,j1.z||0),p2=new THREE.Vector3(j2.x,j2.y,j2.z||0);
    // Force-colored
    const mat=f>0.01*maxF?matT.clone():f<-0.01*maxF?matC.clone():matZ.clone();
    parentF.add(cyl(p1.x,p1.y,p1.z,p2.x,p2.y,p2.z,r,mat));
    // Gray
    parentN.add(cyl(p1.x,p1.y,p1.z,p2.x,p2.y,p2.z,0.04,matGray));
  });
  // Joints
  joints.forEach(j=>{
    const s=sphere(j.x,j.y,j.z||0,0.12,matJoint.clone());
    parentF.add(s.clone());parentN.add(s.clone());
  });
  const fMax=Math.max(...forces.filter(f=>f>0.01*maxF),0);
  const cMax=Math.abs(Math.min(...forces.filter(f=>f<-0.01*maxF),0));
  document.getElementById('max-t').textContent=fMax.toFixed(1)+' kN';
  document.getElementById('max-c').textContent=cMax.toFixed(1)+' kN';
}

// ═══════════════ MODEL 1: Warren Truss Bridge ═══════════════
function buildBridge(){
  const span=12,h=2;const nPanels=8,panelW=span/nPanels;
  const joints=[],members=[];
  // Bottom chord (y=0)
  for(let i=0;i<=nPanels;i++)joints.push({x:-span/2+i*panelW,y:0,freeX:i>0&&i<nPanels,freeY:i>0,fy:(i>0&&i<nPanels)?-50:0});
  // Top chord (y=h)
  for(let i=0;i<=nPanels;i++)joints.push({x:-span/2+i*panelW,y:h,freeX:i<nPanels,freeY:i<nPanels});
  joints[0].freeX=false;joints[0].freeY=false; // left pin
  joints[nPanels].freeY=false; // right roller
  // Diagonals + verticals + chords
  for(let i=0;i<nPanels;i++){
    members.push({j1:i,j2:i+1}); // bottom chord
    members.push({j1:i+nPanels+1,j2:i+nPanels+2}); // top chord
    if(i%2===0)members.push({j1:i,j2:i+nPanels+2}); // diagonal up
    else members.push({j1:i+1,j2:i+nPanels+1}); // diagonal down
    members.push({j1:i+1,j2:i+nPanels+2}); // vertical
  }
  // Deck
  const deckGeo=new THREE.BoxGeometry(span+1,0.05,1.2);
  const deck=new THREE.Mesh(deckGeo,new THREE.MeshStandardMaterial({color:'#5a5a6e',metalness:0.4,roughness:0.6}));
  deck.position.y=-0.35;deck.receiveShadow=true;
  // End supports
  const supGeo=new THREE.BoxGeometry(0.3,0.4,1);
  const sup=new THREE.Mesh(supGeo,new THREE.MeshStandardMaterial({color:'#666',metalness:0.6,roughness:0.3}));
  sup.position.set(-span/2,-0.5,0);sup.castShadow=true;
  const sup2=new THREE.Mesh(supGeo.clone(),sup.material.clone());sup2.position.set(span/2,-0.5,0);
  // Rail
  const railGeo=new THREE.CylinderGeometry(0.04,0.04,span+1,8);
  const rail=new THREE.Mesh(railGeo,new THREE.MeshStandardMaterial({color:'#888',metalness:0.8,roughness:0.3}));
  rail.rotation.z=Math.PI/2;rail.position.set(0,-0.35,0.3);
  const rail2=rail.clone();rail2.position.z=-0.3;
  return {joints,members,extras:[deck,sup,sup2,rail,rail2],center:[0,h/2,0]};
}

// ═══════════════ MODEL 2: Rocket Launch Tower ═══════════════
function buildTower(){
  const joints=[],members=[];
  const H=8,nLevels=6,dh=H/(nLevels-1);
  const baseW=1.5,topW=0.6;
  // 4 corner columns
  for(let l=0;l<nLevels;l++){
    const y=l*dh,w=baseW+(topW-baseW)*l/(nLevels-1),hw=w/2;
    const col=[{x:-hw,y,z:-hw},{x:hw,y,z:-hw},{x:hw,y,z:hw},{x:-hw,y,z:hw}];
    col.forEach(c=>joints.push({...c,freeX:l>0,freeY:l>0}));
  }
  // Base fixed
  for(let i=0;i<4;i++){joints[i].freeX=false;joints[i].freeY=false;joints[i].freeZ=false;}
  // Vertical columns
  for(let l=0;l<nLevels-1;l++)for(let c=0;c<4;c++)members.push({j1:l*4+c,j2:(l+1)*4+c});
  // Horizontal beams each level
  for(let l=0;l<nLevels;l++){const b=l*4;
    members.push({j1:b,j2:b+1});members.push({j1:b+1,j2:b+2});members.push({j1:b+2,j2:b+3});members.push({j1:b+3,j2:b});
  }
  // X-bracing between levels
  for(let l=0;l<nLevels-1;l++){const b0=l*4,b1=(l+1)*4;
    members.push({j1:b0,j2:b1+1});members.push({j1:b0+1,j2:b1});
    members.push({j1:b0+1,j2:b1+2});members.push({j1:b0+2,j2:b1+1});
    members.push({j1:b0+2,j2:b1+3});members.push({j1:b0+3,j2:b1+2});
    members.push({j1:b0+3,j2:b1});members.push({j1:b0,j2:b1+3});
  }
  // Top wind + arm load
  const top=nLevels*4-4;for(let c=0;c<4;c++)joints[top+c].fx=(c<2?8:-8);
  // Umbilical arms
  const armGeo=new THREE.BoxGeometry(0.08,0.08,2);
  [2,3].forEach(l=>{for(let s of[-1,1]){const a=new THREE.Mesh(armGeo,new THREE.MeshStandardMaterial({color:'#7a7a8e',metalness:0.5,roughness:0.4}));a.position.set(s*1.2,l*dh,0);a.castShadow=true;}});
  // Rocket placeholder
  const rockGeo=new THREE.CylinderGeometry(0.3,0.35,3,16);
  const rocket=new THREE.Mesh(rockGeo,new THREE.MeshStandardMaterial({color:'#e0e6f8',metalness:0.3,roughness:0.5}));
  rocket.position.set(1.2,H/2,0);rocket.castShadow=true;
  return {joints,members,extras:[rocket],center:[0,H/2,0]};
}

// ═══════════════ MODEL 3: Transmission Tower ═══════════════
function buildTransmission(){
  const joints=[],members=[];
  const H=7,baseW=2,midW=0.8,topW=1.1;
  // 4 legs: base->waist->cross-arm
  const levels=[{y:0,w:baseW},{y:3,w:midW},{y:4.5,w:midW},{y:5.5,w:topW},{y:H,w:0.6}];
  levels.forEach((lv,i)=>{const hw=lv.w/2;
    [{x:-hw,y:lv.y,z:-hw},{x:hw,y:lv.y,z:-hw},{x:hw,y:lv.y,z:hw},{x:-hw,y:lv.y,z:hw}].forEach(c=>joints.push({...c,freeX:i>0,freeY:i>0}));
  });
  for(let i=0;i<4;i++){joints[i].freeX=false;joints[i].freeY=false;joints[i].freeZ=false;}
  // Legs
  for(let l=0;l<levels.length-1;l++)for(let c=0;c<4;c++)members.push({j1:l*4+c,j2:(l+1)*4+c});
  // Horizontals each level
  for(let l=0;l<levels.length;l++){const b=l*4;
    members.push({j1:b,j2:b+1});members.push({j1:b+1,j2:b+2});members.push({j1:b+2,j2:b+3});members.push({j1:b+3,j2:b});
  }
  // X-bracing
  for(let l=0;l<levels.length-1;l++){const b0=l*4,b1=(l+1)*4;
    members.push({j1:b0,j2:b1+1});members.push({j1:b0+1,j2:b1});
    members.push({j1:b0+1,j2:b1+2});members.push({j1:b0+2,j2:b1+1});
    members.push({j1:b0+2,j2:b1+3});members.push({j1:b0+3,j2:b1+2});
    members.push({j1:b0+3,j2:b1});members.push({j1:b0,j2:b1+3});
  }
  // Cross arms (3 levels)
  const caY=[4.5,5.5,H];caY.forEach(y=>{const caGeo=new THREE.BoxGeometry(4,0.06,0.08);
    const ca=new THREE.Mesh(caGeo,new THREE.MeshStandardMaterial({color:'#7a7a8e',metalness:0.5,roughness:0.4}));ca.position.y=y;ca.castShadow=true;});
  return {joints,members,extras:[],center:[0,H/2,0]};
}

// ── Build all ──
const builders=[buildBridge,buildTower,buildTransmission];
const forceParents=[new THREE.Group(),new THREE.Group(),new THREE.Group()];
const normalParents=[new THREE.Group(),new THREE.Group(),new THREE.Group()];
const modelData=builders.map((fn,i)=>{
  const groupF=new THREE.Group(),groupN=new THREE.Group(),extrasG=new THREE.Group();
  const data=fn();data.extras.forEach(e=>extrasG.add(e));
  scene.add(groupF);scene.add(groupN);scene.add(extrasG);
  const forces=solveTruss(data.joints,data.members);
  renderTruss(data.joints,data.members,forces,groupF,groupN);
  groupN.visible=!showForces;groupF.visible=showForces;
  data._groupF=groupF;data._groupN=groupN;data._extrasG=extrasG;data._forces=forces;
  return data;
});
document.getElementById('member-count').textContent=modelData[0].members.length;
document.getElementById('joint-count').textContent=modelData[0].joints.length;

// ── Switch model ──
function switchModel(i){
  currentModel=i;
  modelData.forEach((d,idx)=>{d._groupF.visible=idx===i&&showForces;d._groupN.visible=idx===i&&!showForces;d._extrasG.visible=idx===i;});
  const names=['Warren 桁架铁路桥','火箭发射塔','输电塔'];
  document.getElementById('model-name').textContent=names[i];
  document.getElementById('member-count').textContent=modelData[i].members.length;
  document.getElementById('joint-count').textContent=modelData[i].joints.length;
  const f=modelData[i]._forces;const mf=Math.max(...f.map(Math.abs),1);
  document.getElementById('max-t').textContent=Math.max(...f.filter(v=>v>0.01*mf),0).toFixed(1)+' kN';
  document.getElementById('max-c').textContent=Math.abs(Math.min(...f.filter(v=>v<-0.01*mf),0)).toFixed(1)+' kN';
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.model===i));
  ctrl.target.set(...modelData[i].center,0);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchModel(+t.dataset.model)));
switchModel(0);

// ── Toggle forces ──
window.toggleForces=function(){
  showForces=!showForces;
  const d=modelData[currentModel];
  d._groupF.visible=showForces;d._groupN.visible=!showForces;
  document.getElementById('toggle-dot').className='dot '+(showForces?'on':'off');
  document.getElementById('toggle-label').textContent='内力显示: '+(showForces?'开':'关');
};

// ── Loop ──
function animate(){requestAnimationFrame(animate);ctrl.update();ren.render(scene,cam);}animate();
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
</script>
</body>
