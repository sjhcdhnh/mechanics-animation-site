<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>火箭发射塔 · 内力可视化</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0a14;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#cdd6f4}
#title{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:16px;color:#e0e6f8;pointer-events:none}
#hud{position:absolute;top:12px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8;backdrop-filter:blur(4px);min-width:200px}
#hud b{color:#f5e0dc;font-weight:600}
#toggle{position:absolute;top:12px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:8px;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);user-select:none}
#legend{position:absolute;bottom:14px;left:12px;padding:10px 14px;background:rgba(20,22,38,0.75);border:1px solid #2a2f4a;border-radius:6px;font-size:12px;line-height:1.8}
.sw{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,0.15)}
#hint{position:absolute;bottom:14px;right:12px;padding:8px 12px;background:rgba(20,22,38,0.5);border:1px solid #2a2f4a;border-radius:6px;font-size:11px;color:#8b95b8}
</style></head>
<body>
<div id="title">火箭发射塔 · 内力可视化</div>
<div id="hud"><b>火箭发射塔</b><br>塔高: <span style="color:#a6e3a1">40 m</span> · 底宽: <span style="color:#a6e3a1">8 m</span><br>层数: <span style="color:#a6e3a1">6</span> · 杆件: <span id="mc">--</span><br>最大拉力: <span style="color:#4ecdc4" id="mt">--</span><br>最大压力: <span style="color:#f38ba8" id="mcp">--</span></div>
<div id="toggle" onclick="toggleForces()"><span id="td" style="width:10px;height:10px;border-radius:50%;background:#4ecdc4;box-shadow:0 0 6px #4ecdc4"></span>内力显示: <span id="tl">开</span></div>
<div id="legend"><span class="sw" style="background:#4ecdc4"></span>拉力 <span class="sw" style="background:#f38ba8"></span>压力 <span style="margin-left:8px;color:#71717a">杆粗细正比于力值</span></div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.157.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.157.0/examples/jsm/"}}</script>
<script type="module">
import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const S=new T.Scene();S.background=new T.Color('#0a0a14');S.fog=new T.Fog('#0a0a14',10,35);
const C=new T.PerspectiveCamera(45,innerWidth/innerHeight,.5,45);C.position.set(8,5,11);C.lookAt(0,3.5,0);
const R=new T.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.1;document.body.appendChild(R.domElement);
const O=new OrbitControls(C,R.domElement);O.target.set(0,3.5,0);O.enableDamping=true;O.update();
S.add(new T.AmbientLight('#404060',2.5));const L=new T.DirectionalLight('#fff',6);L.position.set(8,12,6);L.castShadow=true;L.shadow.mapSize.set(2048,2048);L.shadow.camera.far=45;L.shadow.camera.left=-10;L.shadow.camera.right=10;L.shadow.camera.top=10;L.shadow.camera.bottom=-2;S.add(L);
S.add(new T.DirectionalLight('#8899cc',1.5).position.set(-4,3,-3));
S.add(new T.GridHelper(16,16,'#2a2f4a','#1a1f2e').translateY(-1.5));

const H=8,nL=6;const baseW=1.8,topW=.6;
const joints=[];const members=[];
for(let l=0;l<nL;l++){const y=l*H/(nL-1),w=baseW+(topW-baseW)*l/(nL-1),hw=w/2;
  [{x:-hw,z:-hw},{x:hw,z:-hw},{x:hw,z:hw},{x:-hw,z:hw}].forEach(c=>joints.push({x:c.x,y,z:c.z}));}
// Members: verticals + horizontals + X-bracing
for(let l=0;l<nL-1;l++){const b0=l*4,b1=(l+1)*4;
  for(let c=0;c<4;c++)members.push({a:b0+c,b:b1+c});
  members.push({a:b0,b:b0+1});members.push({a:b0+1,b:b0+2});members.push({a:b0+2,b:b0+3});members.push({a:b0+3,b:b0});
  members.push({a:b0,b:b1+1});members.push({a:b0+1,b:b1});members.push({a:b0+1,b:b1+2});members.push({a:b0+2,b:b1+1});
  members.push({a:b0+2,b:b1+3});members.push({a:b0+3,b:b1+2});members.push({a:b0+3,b:b1});members.push({a:b0,b:b1+3});
}
// Top ring
for(let c=0;c<4;c++){const b=nL*4-4;members.push({a:b+c,b:b+(c+1)%4});}
document.getElementById('mc').textContent=members.length;

// Simplified force assignment based on structural intuition
// Wind from +x: front columns compressed, back columns tensioned
// Gravity: all vertical columns compressed, bracing alternates
const forces=new Array(members.length).fill(0);
members.forEach((m,i)=>{
  const j1=joints[m.a],j2=joints[m.b],dy=j2.y-j1.y,dx=j2.x-j1.x,dz=j2.z-j1.z;
  const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(Math.abs(dy)>len*.8){ // vertical column
    forces[i]=-(j1.y<H/2?40:15)*(1-Math.abs(j1.x)/baseW*.3); // compression, more at bottom
  }else if(Math.abs(dx)>len*.3||Math.abs(dz)>len*.3){ // bracing
    // Tension if going from -x/+z to +x/-z (resisting wind from +x)
    if((j2.x>j1.x&&j2.z<j1.z)||(j2.z>j1.z&&j2.x>j1.x))forces[i]=12+Math.abs(j1.y-H/2)*2;
    else forces[i]=-(10+Math.abs(j1.y)*1.5);
  }
});

let mt=0,mc2=0;forces.forEach(f=>{if(f>mt)mt=f;if(-f>mc2)mc2=-f;});
document.getElementById('mt').textContent=mt.toFixed(1)+' kN';
document.getElementById('mcp').textContent=mc2.toFixed(1)+' kN';

const gF=new T.Group(),gN=new T.Group();let show=true;S.add(gF);S.add(gN);
const mT=new T.MeshStandardMaterial({color:'#4ecdc4',metalness:.15,roughness:.5,emissive:'#4ecdc4',emissiveIntensity:.25});
const mC=new T.MeshStandardMaterial({color:'#f38ba8',metalness:.15,roughness:.5,emissive:'#f38ba8',emissiveIntensity:.25});
const mZ=new T.MeshStandardMaterial({color:'#555566',metalness:.2,roughness:.6});
const mG=new T.MeshStandardMaterial({color:'#71717a',metalness:.3,roughness:.6});
const mJ=new T.MeshStandardMaterial({color:'#e8e8f0',metalness:.6,roughness:.3});

function beam(p1,p2,r,mat){const d=new T.Vector3().subVectors(p2,p1);const len=d.length();const geo=new T.CylinderGeometry(r,r,len,8);const m=new T.Mesh(geo,mat);m.position.copy(p1.clone().add(p2).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());m.castShadow=true;return m;}

const maxF=Math.max(...forces.map(Math.abs),1);
members.forEach((m,i)=>{
  const p1=new T.Vector3(joints[m.a].x,joints[m.a].y,joints[m.a].z),p2=new T.Vector3(joints[m.b].x,joints[m.b].y,joints[m.b].z);
  const f=forces[i],af=Math.abs(f)/maxF,r=.04+af*.1;
  let mat;if(f>.01*maxF)mat=mT;else if(f<-.01*maxF)mat=mC;else mat=mZ;
  gF.add(beam(p1,p2,r,mat));gN.add(beam(p1,p2,.04,mG));
});
joints.forEach(j=>{const s=new T.Mesh(new T.SphereGeometry(.08,10,10),mJ.clone());s.position.set(j.x,j.y,j.z);s.castShadow=true;gF.add(s);gN.add(s.clone());});
gN.visible=false;

// Extras
const base=new T.Mesh(new T.BoxGeometry(2.4,.12,2.4),new T.MeshStandardMaterial({color:'#4a4a58',metalness:.4,roughness:.6}));base.position.y=-.08;base.receiveShadow=true;S.add(base);
const body=new T.Mesh(new T.CylinderGeometry(.2,.25,2.5,16),new T.MeshStandardMaterial({color:'#e0e6f8',metalness:.3,roughness:.5}));body.position.set(.85,1.5,0);body.castShadow=true;S.add(body);
const nose=new T.Mesh(new T.ConeGeometry(.2,.6,16),new T.MeshStandardMaterial({color:'#f38ba8',metalness:.2,roughness:.4}));nose.position.set(.85,3.05,0);nose.castShadow=true;S.add(nose);
[1.5,2.5,3.5,4.5].forEach(y=>{const arm=new T.Mesh(new T.BoxGeometry(1.2,.05,.06),new T.MeshStandardMaterial({color:'#7a7a8e',metalness:.5,roughness:.4}));arm.position.set(.3,y,0);arm.castShadow=true;S.add(arm);});

window.toggleForces=function(){show=!show;gF.visible=show;gN.visible=!show;document.getElementById('td').style.background=show?'#4ecdc4':'#555';document.getElementById('td').style.boxShadow=show?'0 0 6px #4ecdc4':'none';document.getElementById('tl').textContent=show?'开':'关';};

(function a(){requestAnimationFrame(a);O.update();R.render(S,C);})();
window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
</script></body></html>
