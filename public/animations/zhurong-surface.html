  #title { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:18px;

  #hud .v { color:#a6e3a1; font-family:Consolas,monospace; }

    background:rgba(10,10,20,0.75); border:1px solid #2a2f4a; border-radius:6px; font-size:11px; line-height:1.8; }
  #controls-help .key { display:inline-block; background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25); border-radius:3px; padding:1px 6px;
    font-family:Consolas,monospace; font-size:11px; color:#ffe066; }
  #legend { position:absolute; top:80px; right:16px; padding:12px 16px;
    background:rgba(10,10,20,0.75); border:1px solid #2a2f4a; border-radius:6px; font-size:12px; line-height:1.8; }

</head>
<body>
<div id="title">祝融号 · 火星表面巡游演示</div>
<div id="subtitle">Zhurong Rover — Utopia Planitia · 乌托邦平原 · 25.1°N, 109.9°E</div>

<div id="hud">
  <div><b>火星车遥测</b></div>
  <div>速度 : <span id="v_speed" class="v">0.0</span> m/h</div>
  <div>里程 : <span id="v_dist" class="v">0.00</span> m</div>
  <div>倾角 : <span id="v_tilt" class="v">0.0°</span></div>
  <div>模式 : <span id="v_mode" class="v">自动巡游</span></div>
</div>

  <div><b>部件图例</b></div>
  <div><span class="sw" style="background:#c49564"></span>车体主结构</div>
  <div><span class="sw" style="background:#1a4a7a"></span>蝶形太阳翼×4</div>
  <div><span class="sw" style="background:#a0a0a0"></span>车轮×6+摇臂</div>
  <div><span class="sw" style="background:#d4a574"></span>桅杆/相机NTC</div>
  <div><span class="sw" style="background:#ffd700"></span>科学载荷</div>
</div>

  <div><span class="key">Q</span><span class="key">E</span> 蟹行</div>
  <div><span class="key">C</span> 视角 <span class="key">R</span> 复位</div>

</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 *  场景
 * ============================================================ */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color('#c49060'), 60, 220);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 400);
camera.position.set(6, 5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

function createWarmEnvTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#1a0d05');
  g.addColorStop(0.42, '#7c4a2b');
  g.addColorStop(0.55, '#d39a68');
  g.addColorStop(1, '#28140a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  const sg = ctx.createRadialGradient(392, 56, 0, 392, 56, 120);
  sg.addColorStop(0, 'rgba(255,246,226,1)');
  sg.addColorStop(0.24, 'rgba(255,210,150,0.55)');
  sg.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = sg; ctx.fillRect(250, 0, 262, 180);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return tex;
}
scene.environment = createWarmEnvTexture();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.minDistance = 1.5; controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI*0.72; controls.update();

/* ============================================================
 *  增强星空背景 (Canvas — 8000+ 星 + 银河)
 * ============================================================ */
function createStarfield(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000105'; ctx.fillRect(0, 0, w, h);
  // 淡银河带
  const mwGrad = ctx.createLinearGradient(0, h*0.32, 0, h*0.68);
  mwGrad.addColorStop(0, 'rgba(8,10,25,0)'); mwGrad.addColorStop(0.5, 'rgba(18,22,45,0.04)');
  mwGrad.addColorStop(1, 'rgba(8,10,25,0)');
  ctx.fillStyle = mwGrad; ctx.fillRect(0, 0, w, h);
  const bandGrad = ctx.createLinearGradient(0, 0, w, 0);
  bandGrad.addColorStop(0, 'rgba(10,12,30,0.04)'); bandGrad.addColorStop(0.5, 'rgba(25,28,55,0.08)');
  bandGrad.addColorStop(1, 'rgba(10,12,30,0.04)');
  ctx.fillStyle = bandGrad;
  ctx.beginPath(); ctx.ellipse(w/2, h*0.47, w*0.55, h*0.06, -0.15, 0, Math.PI*2); ctx.fill();
  // 12000颗小星（92%暗淡微星 + 8%亮点）
  for (let i = 0; i < 12000; i++) {
    const x = Math.random()*w, y = Math.random()*h;
    const mag = Math.random();
    const r = mag < 0.92 ? 0.08 + Math.random()*0.35 : 0.3 + Math.random()*0.7;
    const alpha = mag < 0.92 ? 0.08 + Math.random()*0.32 : 0.35 + Math.random()*0.35;
    const temp = Math.random();
    let hue = temp < 0.55 ? 215 : temp < 0.82 ? 45 : temp < 0.94 ? 25 : 0;
    const sat = temp < 0.55 ? 3+Math.random()*8 : 15+Math.random()*20;
    const lum = 75+Math.random()*25;
    ctx.fillStyle = `hsla(${hue},${sat}%,${lum}%,${alpha})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

const starSphere = new THREE.Mesh(
  new THREE.SphereGeometry(145, 64, 32),
  new THREE.MeshBasicMaterial({ map: createStarfield(2048, 1024), side: THREE.BackSide })
);
starSphere.position.y = -10; scene.add(starSphere);

/* ============================================================
 *  火星天空渐变（替代纯色背景）
 *  地平线琥珀 → 天顶深棕
 * ============================================================ */
function createSkyGrad(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#1a0e06'); g.addColorStop(0.2, '#362012'); g.addColorStop(0.4, '#6e3d22');
  g.addColorStop(0.5, '#b07040'); g.addColorStop(0.54, '#deb080');
  g.addColorStop(0.58, '#c08858'); g.addColorStop(0.75, '#804828'); g.addColorStop(1, '#201008');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // 大气条纹
  for (let i = 0; i < 25; i++) {
    const y = h*0.52 + i*8;
    ctx.fillStyle = `rgba(190,150,110,${0.02+Math.random()*0.03})`;
    ctx.fillRect(0, y, w, 2+Math.random()*5);
  }
  return new THREE.CanvasTexture(c);
}
// 火星天空穹顶（渐变 + 大气散射）
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(130, 48, 24),
  new THREE.MeshBasicMaterial({ map: createSkyGrad(1024, 1024), side: THREE.BackSide, transparent: true, opacity: 0.85, depthWrite: false })
);
skyDome.position.y = -10;
scene.add(skyDome);

/* ============================================================
 *  尝试加载真实火星纹理，失败则用 Canvas 程序化纹理
 * ============================================================ */
// Canvas 生成高质量火星地表纹理
function createMarsGroundTex(size) {
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const base = ctx.createLinearGradient(0, 0, size, size);
  base.addColorStop(0, '#9f6847');
  base.addColorStop(0.45, '#b77a55');
  base.addColorStop(1, '#7f5035');
  ctx.fillStyle = base; ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 34000; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = Math.random() * 0.9 + 0.08;
    const t = Math.random();
    const red = 120 + t * 70;
    const green = 72 + t * 46;
    const blue = 44 + t * 28;
    ctx.fillStyle = `rgba(${red},${green},${blue},${0.16 + Math.random() * 0.28})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(215,165,115,0.18)';
  ctx.lineWidth = 1.0;
  for (let i = 0; i < 80; i++) {
    const y = Math.random() * size;
    ctx.beginPath();
    for (let x = -20; x <= size + 20; x += 22) {
      const yy = y + Math.sin(x * 0.02 + i) * (2 + Math.random() * 3);
      if (x < 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = Math.random() * 2.2 + 0.35;
    ctx.fillStyle = `rgba(70,45,32,${0.08 + Math.random() * 0.18})`;
    ctx.beginPath(); ctx.ellipse(x, y, r * (1 + Math.random()), r * 0.55, Math.random() * Math.PI, 0, Math.PI * 2); ctx.fill();
  }
  return c;
}

/* ============================================================
 *  地形
 * ============================================================ */
const TS = 200, TSEG = 256;

function terrainH(wx, wz) {
  let h = 0;
  h += Math.sin(wx * 0.015) * Math.cos(wz * 0.018) * 1.45;
  h += Math.sin(wx * 0.035 + wz * 0.028) * Math.cos(wz * 0.032 - wx * 0.022) * 0.72;
  h += Math.sin(wx * 0.08 + wz * 0.06) * 0.24;
  h += Math.sin(wx * 0.18) * Math.cos(wz * 0.2) * 0.1;
  return h;
}

const tGeom = new THREE.PlaneGeometry(TS, TS, TSEG, TSEG);
tGeom.rotateX(-Math.PI/2);
const tp = tGeom.attributes.position.array;
for(let i=0;i<tp.length;i+=3) tp[i+1]=terrainH(tp[i],tp[i+2]);
tGeom.computeVertexNormals();

// 地面纹理 — 统一底色无缝平铺
const groundTexCanvas = createMarsGroundTex(2048);
const groundTex = new THREE.CanvasTexture(groundTexCanvas);
groundTex.wrapS = groundTex.wrapT = THREE.ClampToEdgeWrapping; groundTex.repeat.set(1, 1);
groundTex.colorSpace = THREE.SRGBColorSpace;
groundTex.anisotropy = 8;

const terrain = new THREE.Mesh(tGeom, new THREE.MeshStandardMaterial({
  map: groundTex,
  roughness: 0.92, metalness: 0.0,
  color: new THREE.Color('#a96f4d'),
}));
terrain.receiveShadow=true; scene.add(terrain);

// 散布石块（避开出生点 5 单位）
const RC2 = [0x6f4b35,0x7a5339,0x835d43,0x5e4030,0x8d674a,0x73513b,0x9a7353,0x654631];
const rockContactMat = new THREE.MeshBasicMaterial({
  color: 0x3b2418,
  transparent: true,
  opacity: 0.18,
  depthWrite: false,
});
for(let i=0;i<260;i++){
  let rx,rz;
  do{rx=(Math.random()-0.5)*TS*0.9;rz=(Math.random()-0.5)*TS*0.9;}
  while(Math.sqrt(rx*rx+rz*rz)<5);
  const rh=terrainH(rx,rz);
  const sr=Math.random();let cr;
  if(sr<0.62)cr=0.035+Math.random()*0.16;
  else if(sr<0.86)cr=0.16+Math.random()*0.34;
  else if(sr<0.97)cr=0.35+Math.random()*0.75;
  else cr=0.9+Math.random()*1.35;
  const gt=Math.floor(Math.random()*3);let g;
  if(gt===0)g=new THREE.IcosahedronGeometry(cr,Math.random()<0.3?0:1);
  else if(gt===1)g=new THREE.DodecahedronGeometry(cr,0);
  else g=new THREE.TetrahedronGeometry(cr,Math.random()<0.5?0:1);
  const ap=g.attributes.position.array;
  const distort=0.05+Math.random()*0.35;
  for(let j=0;j<ap.length;j+=3){const sc=1+(Math.random()-0.5)*distort;ap[j]*=sc;ap[j+1]*=sc;ap[j+2]*=sc;}
  g.computeVertexNormals();
  g.computeBoundingBox();
  const r=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
    color:RC2[Math.floor(Math.random()*RC2.length)],roughness:0.78+Math.random()*0.16,metalness:0.0,flatShading:true}));
  r.scale.y = 0.55 + Math.random() * 0.75;
  r.rotation.set((Math.random()-0.5)*0.9,Math.random()*6.28,(Math.random()-0.5)*0.9);
  r.position.set(rx, rh + 0.25, rz);
  r.updateMatrixWorld(true);
  const rockBox = new THREE.Box3().setFromObject(r);
  r.position.y += rh - Math.min(cr * 0.16, 0.08) - rockBox.min.y;
  r.castShadow=r.receiveShadow=true;scene.add(r);

  const contact = new THREE.Mesh(new THREE.CircleGeometry(cr * (1.15 + Math.random() * 0.45), 18), rockContactMat);
  contact.rotation.x = -Math.PI / 2;
  contact.position.set(rx, rh + 0.004, rz);
  contact.scale.y = 0.55 + Math.random() * 0.3;
  scene.add(contact);
}

// === 远山贴图板（Canvas绘制山形剪影，布置在地形边缘）===
function makeMountainTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  // 天空色渐变（底部透明 → 顶部山色）
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, 'rgba(140,100,70,0.92)');
  grd.addColorStop(0.45, 'rgba(150,108,75,0.7)');
  grd.addColorStop(0.75, 'rgba(160,115,80,0.25)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  // 画锯齿山脊
  ctx.fillStyle = grd; ctx.beginPath();
  ctx.moveTo(0, h);
  let px = 0;
  while (px < w) {
    const peakH = h * (0.15 + Math.random() * 0.7);
    const segW = 20 + Math.random() * 80;
    const cpX = px + segW / 2;
    ctx.lineTo(cpX, h - peakH);
    px += segW;
    if (px >= w) break;
    const valleyH = h * (0.05 + Math.random() * 0.3);
    const vW = 10 + Math.random() * 40;
    ctx.lineTo(px, h - valleyH);
    px += vW;
  }
  ctx.lineTo(w, h); ctx.closePath(); ctx.fill();
  return new THREE.CanvasTexture(c);
}
// 8面山板围成一圈
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  const dist = TS * 0.44;
  const mx = Math.cos(angle) * dist;
  const mz = Math.sin(angle) * dist;
  const mtnTex = makeMountainTex(512, 256);
  const mtnPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(dist * 0.7, 18),
    new THREE.MeshBasicMaterial({ map: mtnTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
  );
  mtnPlane.position.set(mx, 7, mz);
  mtnPlane.lookAt(new THREE.Vector3(0, 0, mz > 0 ? mz + 0.1 : mz - 0.1));
  scene.add(mtnPlane);
}

// 3D 近丘（中等距离，部分可见轮廓）
const hm = new THREE.MeshStandardMaterial({ color: 0x9a7050, roughness: 0.9, metalness: 0.01, flatShading: true });
for (let i = 0; i < 6; i++) {
  const hx = (Math.random() - 0.5) * TS * 0.7, hz = (Math.random() - 0.5) * TS * 0.7;
  const hl = new THREE.Mesh(new THREE.SphereGeometry(5 + Math.random() * 16, 10, 5, 0, Math.PI * 2, 0, Math.PI / 3.5), hm);
  hl.position.set(hx, -1, hz); hl.scale.y = 0.12 + Math.random() * 0.25;
  hl.receiveShadow = true; scene.add(hl);
}

/* ============================================================
 *  祝融号火星车
 *  真实参考数据:
 *  - 尺寸: 2.6m(L) × 3.0m(W) × 1.85m(H) 完全展开
 *  - 6轮独立驱动, 主动摇臂-转向架悬架
 *  - 4片蝶形太阳翼 (车顶, 向外上方展开)
 *  - 20条履刺/轮
 * 场景比例: 1 unit = 1 meter
 * 坐标系: X=前, Y=上, Z=左
 * ============================================================ */

/* ---- 材料 ---- */
const matB  = new THREE.MeshStandardMaterial({color:0xc49564,roughness:0.42,metalness:0.38});
const matBD = new THREE.MeshStandardMaterial({color:0x8b6b4a,roughness:0.48,metalness:0.32});
const matSol = new THREE.MeshStandardMaterial({color:0x1a3a6c,roughness:0.3,metalness:0.65});
const matSF = new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:0.28,metalness:0.82});
const matWh = new THREE.MeshStandardMaterial({color:0xb8b8b8,roughness:0.28,metalness:0.72});
const matWT = new THREE.MeshStandardMaterial({color:0x555555,roughness:0.75,metalness:0.15});
const matTire = new THREE.MeshStandardMaterial({color:0x1f1f1c,roughness:0.86,metalness:0.04});
const matS  = new THREE.MeshStandardMaterial({color:0x7a7a7a,roughness:0.3,metalness:0.68});
const matM  = new THREE.MeshStandardMaterial({color:0xa0a0a0,roughness:0.28,metalness:0.62});
const matA  = new THREE.MeshStandardMaterial({color:0xd0c8b0,roughness:0.22,metalness:0.78});
const matSci = new THREE.MeshStandardMaterial({color:0xffd700,roughness:0.28,metalness:0.52,emissive:0x221100,emissiveIntensity:0.3});
const matFl = new THREE.MeshStandardMaterial({color:0xc04040,roughness:0.45,metalness:0.1});
const matCL = new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:0.15,metalness:0.9});
const matDeck = new THREE.MeshStandardMaterial({color:0xb89060,roughness:0.4,metalness:0.4});

/* ---- 火星车根节点 ---- */
const rover = new THREE.Group(); scene.add(rover);

/* ---- 车体主结构：核心舱紧凑，侧梁作为悬架真实连接点 ---- */
const bodyBox = new THREE.Mesh(new THREE.BoxGeometry(1.72,0.50,0.92),matB);
bodyBox.position.y=0.82;bodyBox.castShadow=bodyBox.receiveShadow=true;rover.add(bodyBox);
const deck = new THREE.Mesh(new THREE.BoxGeometry(1.62,0.07,0.82),matDeck);
deck.position.y=1.11;deck.castShadow=true;rover.add(deck);
const underDeck = new THREE.Mesh(new THREE.BoxGeometry(1.52,0.16,0.74),matBD);
underDeck.position.y=0.50;underDeck.castShadow=true;rover.add(underDeck);
[-0.62,0.62].forEach(z=>{
  const sideRail=new THREE.Mesh(new THREE.BoxGeometry(1.96,0.16,0.08),matS);
  sideRail.position.set(0,0.58,z);sideRail.castShadow=true;rover.add(sideRail);
  const upperRail=new THREE.Mesh(new THREE.BoxGeometry(1.72,0.08,0.07),matBD);
  upperRail.position.set(0,0.98,z*0.92);upperRail.castShadow=true;rover.add(upperRail);

/* ============================================================
 *  摇臂-转向架悬架 (Rocker-Bogie)
 *
 *  关键: 每根臂从体 pivot EXACTLY 连接到轮心
 *
 *  Body pivot: (0.1, 0.55, ±1.28) — 摇臂与车体连接点
 *  Bogie pivot: (-0.35, 0.42, ±1.28) — 摇臂后端与转向架连接点
 *  Wheels at y=0.15 (轮心)
 * ============================================================ */
const WR = 0.31; // 轮半径，按火星车比例放大以保证侧视可见
const WW = 0.24; // 轮宽
const BODY_PIVOT = { x: 0.24, y: 0.62 };
const BOGIE_PIVOT = { x: -0.32, y: 0.48 };
const WHEELS = [
  {name:'FL',x:1.10,z:1.45,s:'L',p:'front'},
  {name:'FR',x:1.10,z:-1.45,s:'R',p:'front'},
  {name:'ML',x:0.08,z:1.45,s:'L',p:'mid'},
  {name:'MR',x:0.08,z:-1.45,s:'R',p:'mid'},
  {name:'RL',x:-0.94,z:1.45,s:'L',p:'rear'},
  {name:'RR',x:-0.94,z:-1.45,s:'R',p:'rear'},
];

// 辅助: from A to B
function cylinderBetween(pA, pB, radius, material) {
  const dir = new THREE.Vector3().subVectors(pB, pA);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
  const geom = new THREE.CylinderGeometry(radius, radius, len, 10);
  const mesh = new THREE.Mesh(geom, material);
  mesh.position.copy(mid);
  // 默认 Cylinder 沿 Y, 需要旋转到 dir 方向
  const up = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, dir.normalize());
  mesh.setRotationFromQuaternion(quat);
  mesh.castShadow = true;
  return mesh;
}

// 创建单侧悬架
function createSideSusp(z) {
  const side = new THREE.Group();

  // === 摇臂: Body pivot → Front wheel (直达) + Body pivot → Bogie pivot ===
  const bp = new THREE.Vector3(BODY_PIVOT.x, BODY_PIVOT.y, z);
  const fw = new THREE.Vector3(1.10, WR, z);
  const bgp = new THREE.Vector3(BOGIE_PIVOT.x, BOGIE_PIVOT.y, z);

  // 摇臂前段: body pivot → front wheel
  side.add(cylinderBetween(bp, fw, 0.055, matS));

  // 摇臂后段: body pivot → bogie pivot
  side.add(cylinderBetween(bp, bgp, 0.055, matS));

  // 从车体侧梁伸出的短轴，让悬架铰点和车身明确相连
  const inboard = new THREE.Vector3(BODY_PIVOT.x, BODY_PIVOT.y, z > 0 ? 0.68 : -0.68);
  side.add(cylinderBetween(inboard, bp, 0.052, matS));

  // 摇臂 pivot 球
  const bodyPivotSphere = new THREE.Mesh(new THREE.SphereGeometry(0.085,18,12),matS);
  bodyPivotSphere.position.copy(bp);side.add(bodyPivotSphere);

  // === 转向架: Bogie pivot → Mid wheel + Bogie pivot → Rear wheel ===
  const mw = new THREE.Vector3(0.08, WR, z);
  const rw = new THREE.Vector3(-0.94, WR, z);

  side.add(cylinderBetween(bgp, mw, 0.045, matS));
  side.add(cylinderBetween(bgp, rw, 0.045, matS));

  // Bogie pivot 球
  const bogiePivotSphere = new THREE.Mesh(new THREE.SphereGeometry(0.065,16,10),matS);
  bogiePivotSphere.position.copy(bgp);side.add(bogiePivotSphere);

  // === 车轮 ===
  const wheelObjs = [];
  WHEELS.filter(w=>w.z===z).forEach(def => {
    const wheelMount = new THREE.Group();
    wheelMount.name = `${def.name}_mount`;
    const wg = new THREE.Group();
    wg.name = def.name;
    wheelMount.add(wg);

    // 黑色轮胎：Cylinder 默认沿Y，旋转后轴线沿Z，保证轮子从侧面清楚可见
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, WW, 64, 1, false), matTire);
    tire.rotation.x = Math.PI/2; tire.castShadow=tire.receiveShadow=true; wg.add(tire);

    // 双侧金属轮毂
    [-WW*0.52, WW*0.52].forEach(zoff=>{
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(WR*0.48,WR*0.48,0.035,36),matWh);
      hub.rotation.x = Math.PI/2; hub.position.z = zoff; hub.castShadow=true; wg.add(hub);
    });

    // 轮辋
    const rim = new THREE.Mesh(new THREE.TorusGeometry(WR*0.82,WR*0.11,12,48),
      new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.2,metalness:0.85}));
    wg.add(rim);

    // 辐条×6
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      const spk=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,WR*1.55,8),
        new THREE.MeshStandardMaterial({color:0xdddddd,roughness:0.2,metalness:0.85}));
      spk.position.set(Math.cos(a)*WR*0.34,Math.sin(a)*WR*0.34,WW*0.54);
      spk.rotation.z=a+Math.PI/2;spk.rotation.x=Math.PI/2;wg.add(spk);
    }

    // 24条横向履刺，贴在轮胎外圈
    for(let i=0;i<24;i++){
      const a=i/24*Math.PI*2;
      const gr=new THREE.Mesh(new THREE.BoxGeometry(0.045,0.018,WW+0.055),matWT);
      gr.position.set(Math.cos(a)*WR*1.02,Math.sin(a)*WR*1.02,0);
      gr.rotation.z=a;wg.add(gr);
    }

    wheelMount.position.set(def.x, WR, def.z);
    wheelMount.userData = {posType:def.p};
    side.add(wheelMount);
    wheelObjs.push({mesh:wg, steer:wheelMount, name:def.name, posType:def.p, side:def.s, roll:0});
  });

  side.userData = {wheelObjs};
  return side;
}

/* ============================================================
 *  自动巡游
 * ============================================================ */
function autoCruise(dt){
  if(!rs.autoCruise)return;
  rs.autoTimer+=dt;rs.autoChangeTimer-=dt;
  rs.crabAngle=0;
  if(rs.autoChangeTimer<=0){
    // 随机改变朝向
    rs._steerTarget=(Math.random()-0.5)*0.6; // 转向速率 rad/s
    rs.autoChangeTimer=4+Math.random()*10;
  }
  rs.heading+=rs._steerTarget*dt;
  rs.speed=0.22;
  const lim=TS*0.42;
  if(Math.abs(rs.pos.x)>lim||Math.abs(rs.pos.z)>lim){
    // 朝向中心
    const toCenter=Math.atan2(-rs.pos.z,-rs.pos.x);
    rs._steerTarget=Math.sign(toCenter-rs.heading)*0.8;
    rs.autoChangeTimer=2;
  }
  rs.steerAngle=0;
}

function manualControl(dt){
  if(rs.autoCruise)return;
  // W/S 前进后退
  const ts=keys.w?rs.SPEED_MAX:keys.s?-rs.SPEED_MAX*0.5:0;
  rs.speed+=Math.sign(ts-rs.speed)*Math.min(Math.abs(ts-rs.speed),0.7*dt);
  // A/D 直接转向（改变车头朝向）
  const turnRate=1.0;
  if(keys.a)rs.heading+=turnRate*dt;
  if(keys.d)rs.heading-=turnRate*dt;
  // Q/E 蟹行
  if(keys.q)rs.crabAngle=Math.min(rs.crabAngle+0.8*dt,0.50);
  else if(keys.e)rs.crabAngle=Math.max(rs.crabAngle-0.8*dt,-0.50);
  else rs.crabAngle*=Math.exp(-5*dt);
  // 重置转向值（手动模式不用 skid-steer）
  rs.steerAngle=0;rs._steerTarget=0;
}

/* ============================================================
 *  运动学
 * ============================================================ */
function updateKinematics(dt){
  // === 先更新车身朝向 ===
  rover.rotation.y = rs.heading;

  // === 从车身实际朝向取前方向量 ===
  const fwd = new THREE.Vector3(1, 0, 0);
  fwd.applyQuaternion(rover.quaternion);
  fwd.y = 0; fwd.normalize();

  // 右向量（用于蟹行侧移）
  const rgt = new THREE.Vector3(0, 0, -1);
  rgt.applyQuaternion(rover.quaternion);
  rgt.y = 0; rgt.normalize();

  // 前进 + 蟹行侧移
  const crabSide = rs.crabAngle * rs.speed * 0.5;
  const delta = fwd.clone().multiplyScalar(rs.speed * dt)
    .add(rgt.clone().multiplyScalar(crabSide * dt));

  const np = rs.pos.clone().add(delta);
  const lim = TS * 0.44;
  if(Math.abs(np.x) < lim && Math.abs(np.z) < lim) rs.pos.copy(np);
  rs.totalDist += delta.length();

  const th = terrainH(rs.pos.x, rs.pos.z);
  rover.position.set(rs.pos.x, th, rs.pos.z);
  rover.updateMatrixWorld();

  // 车轮滚动
  const rollRate = rs.speed / WR;
  allWheels.forEach(w => {
    w.roll += rollRate * dt;
    w.mesh.rotation.z = w.roll;
    w.steer.rotation.y = rs.crabAngle; // 只有蟹行才偏转车轮安装架
  });

  // 车体倾角
  const fh2 = terrainH(rs.pos.x+Math.cos(rs.heading)*0.9, rs.pos.z-Math.sin(rs.heading)*0.9);
  const rh2 = terrainH(rs.pos.x-Math.cos(rs.heading)*0.7, rs.pos.z+Math.sin(rs.heading)*0.7);
  const lh2 = terrainH(rs.pos.x-Math.sin(rs.heading)*0.6, rs.pos.z-Math.cos(rs.heading)*0.6);
  const rrh = terrainH(rs.pos.x+Math.sin(rs.heading)*0.6, rs.pos.z+Math.cos(rs.heading)*0.6);
  const pa = Math.atan2(fh2-rh2, 1.6)*0.35, ra2 = Math.atan2(rrh-lh2, 1.2)*0.35;
  rover.rotation.x = pa; rover.rotation.z = ra2;

  const vFwd = rs.speed;
  ui.speed.textContent = (Math.abs(vFwd)*rs.SPEED_TO_REAL).toFixed(1);
  ui.dist.textContent = rs.totalDist.toFixed(2);
  ui.tilt.textContent = ((Math.abs(pa)+Math.abs(ra2))*180/Math.PI).toFixed(1)+'°';
  const isCrab = Math.abs(rs.crabAngle) > 0.03;
  ui.mode.textContent = rs.autoCruise ? '自动巡游' : (isCrab ? '蟹行' : (vFwd>0.01?'前进':vFwd<-0.01?'后退':'静止'));
  ui.cam.textContent = ['后跟','俯瞰','自由'][camMode];
}

function updateTracks(){
  if(Math.abs(rs.speed)<0.015)return;
  allWheels.forEach(w=>{
    if(Math.random()>0.3)return;
    const wp=new THREE.Vector3();w.mesh.getWorldPosition(wp);
    wp.y=terrainH(wp.x,wp.z)+0.003;
    const dot=new THREE.Mesh(new THREE.PlaneGeometry(0.06,0.1),
      new THREE.MeshBasicMaterial({color:0x704828,transparent:true,opacity:0.3,side:THREE.DoubleSide,depthWrite:false}));
    dot.position.copy(wp);dot.rotation.x=-Math.PI/2;
    dot.userData={life:12+Math.random()*18,age:0};
    trackGrp.add(dot);tracks.push(dot);
  });
  for(let i=tracks.length-1;i>=0;i--){
    tracks[i].userData.age+=0.016;
    tracks[i].material.opacity=0.3*(1-tracks[i].userData.age/tracks[i].userData.life);
    if(tracks[i].userData.age>=tracks[i].userData.life){trackGrp.remove(tracks[i]);tracks.splice(i,1);}
  }
  while(tracks.length>350){const p=tracks.shift();trackGrp.remove(p);}
}

sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;sun.shadow.bias=-0.00015;
scene.add(sun);
const fillLight = new THREE.DirectionalLight(0xaaccff, 0.35);
fillLight.position.set(-14, 8, 10);
scene.add(fillLight);
const sg2=new THREE.Mesh(new THREE.SphereGeometry(0.8,32,32),new THREE.MeshBasicMaterial({color:0xffeedd}));
sg2.position.copy(sun.position).normalize().multiplyScalar(130);scene.add(sg2);

/* ============================================================
 *  主循环
 * ============================================================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1);

  autoCruise(dt);manualControl(dt);updateKinematics(dt);updateTracks();

  dustGrp.children.forEach(d3=>{
    d3.position.y=d3.userData.by+Math.sin(Date.now()*0.001*d3.userData.fs)*d3.userData.fa;
    d3.position.x+=Math.cos(d3.userData.da)*d3.userData.ds*dt*0.1;
    d3.position.z+=Math.sin(d3.userData.da)*d3.userData.ds*dt*0.1;
  });
  const sp2=Math.sin(Date.now()*0.0008)*0.012;
  solarPanels.forEach((p,i)=>{
    p.rotation.copy(p.userData.baseRotation);
    p.rotation.z += sp2*(i%2?1:-1);
  });

  const rwp2=rover.position.clone();rwp2.y+=1.6;
  if(camMode===0){
    const bh=new THREE.Vector3(-Math.cos(rs.heading)*7,4.5,-Math.sin(rs.heading)*7);
    camera.position.lerp(rwp2.clone().add(bh),0.045);
    controls.target.lerp(rwp2,0.06);
  }else if(camMode===1){
    camera.position.lerp(rwp2.clone().add(new THREE.Vector3(0,18,0.1)),0.04);
    controls.target.lerp(rwp2,0.06);
  }
  controls.update();renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
