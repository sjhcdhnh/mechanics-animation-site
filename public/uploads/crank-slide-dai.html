<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>参数化探究：曲柄滑道连杆机构 | 多组对比·冲击分析·数据导出</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', monospace;
        }
        /* UI 面板整体布局 */
        .ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            pointer-events: none;
            z-index: 20;
        }
        .dashboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
            color: white;
            font-family: monospace;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .dashboard h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #ffaa66;
        }
        .param-group {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .param-card {
            flex: 1;
            background: rgba(30,30,50,0.7);
            border-radius: 12px;
            padding: 8px 12px;
        }
        .param-card label {
            font-size: 12px;
            color: #ccc;
        }
        input[type="range"] {
            width: 100%;
            margin: 6px 0;
            background: #333;
            height: 3px;
            border-radius: 3px;
        }
        .value-display {
            font-size: 14px;
            font-weight: bold;
            color: #ffaa66;
        }
        .stats-grid {
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            padding: 10px;
            margin: 12px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #444;
            padding: 4px 0;
        }
        .warning {
            color: #ff8888;
            font-size: 12px;
            margin-top: 8px;
            padding: 6px;
            background: rgba(255,80,80,0.2);
            border-radius: 8px;
        }
        .curve-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 520px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .curve-toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .curve-buttons {
            display: flex;
            gap: 8px;
        }
        button {
            background: #2a2a3a;
            border: none;
            color: #eee;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
            font-family: monospace;
        }
        button.active {
            background: #ffaa66;
            color: #1e1e2a;
        }
        button:hover {
            background: #ffaa66;
            color: #111;
        }
        .canvas-wrapper {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 5px;
        }
        canvas {
            width: 100%;
            height: 200px;
            display: block;
            border-radius: 8px;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin: 8px 0;
            font-size: 10px;
            justify-content: center;
        }
        .legend span {
            display: inline-block;
            width: 16px;
            height: 2px;
            vertical-align: middle;
            margin-right: 4px;
        }
        .snapshot-bar {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .snapshot-btn {
            background: #3a3a5a;
            font-size: 10px;
        }
        .export-btn {
            background: #2a6a4a;
        }
        .compare-note {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-top: 6px;
        }
        @media (max-width: 900px) {
            .dashboard { width: 280px; }
            .curve-panel { width: 400px; }
        }
        @media (max-width: 750px) {
            .curve-panel { width: 360px; right: 10px; bottom: 10px; }
            .dashboard { top: 10px; left: 10px; width: 260px; }
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <div class="dashboard">
            <h2>📐 参数化探究 | 曲柄滑道连杆机构</h2>
            <div class="param-group">
                <div class="param-card">
                    <label>曲柄长度 r (m)</label>
                    <input type="range" id="r-slider" min="0.4" max="1.8" step="0.01" value="1.0">
                    <div><span id="r-val" class="value-display">1.00</span> m</div>
                </div>
                <div class="param-card">
                    <label>角速度 ω (rad/s)</label>
                    <input type="range" id="omega-slider" min="0.8" max="4.5" step="0.05" value="2.2">
                    <div><span id="omega-val" class="value-display">2.20</span> rad/s</div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-item"><span>📏 最大行程 (2r):</span><span id="max-disp">2.00</span> m</div>
                <div class="stat-item"><span>⚡ 最大速度 (ω·r):</span><span id="max-vel">2.20</span> m/s</div>
                <div class="stat-item"><span>💥 最大加速度 (ω²·r):</span><span id="max-acc">4.84</span> m/s²</div>
                <div class="stat-item"><span>⏱️ 运动周期 T:</span><span id="period">2.86</span> s</div>
            </div>
            <div class="warning" id="impact-warning">
                ⚠️ 冲击风险分析：加速度峰值较高，机构振动明显，建议降低 ω 或 r。
            </div>
        </div>

        <div class="curve-panel">
            <div class="curve-toolbar">
                <div class="curve-buttons">
                    <button id="btn-disp" class="active">📈 位移 x(t)</button>
                    <button id="btn-vel">📉 速度 v(t)</button>
                    <button id="btn-acc">📊 加速度 a(t)</button>
                </div>
                <div>
                    <button id="snapshot-btn" class="snapshot-btn">📸 保存当前曲线快照</button>
                    <button id="export-csv" class="export-btn">📎 导出数据(CSV)</button>
                </div>
            </div>
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" width="600" height="200" style="width:100%; height:200px;"></canvas>
            </div>
            <div class="legend">
                <span style="background: #ffaa44;"></span> 理论解析解 &nbsp;&nbsp;
                <span style="background: #44aaff;"></span> 仿真数值解 &nbsp;&nbsp;
                <span style="background: #ff66cc;" id="snapshot-legend-add"></span> <span id="snapshot-text">快照对比(无)</span>
            </div>
            <div class="snapshot-bar" id="snapshot-list">
                <!-- 动态添加快照标签 -->
            </div>
            <div class="compare-note">
                💡 提示：改变 r 或 ω 后曲线自动更新；点击「保存快照」可对比不同参数组的运动特性，分析高速/大尺寸下的冲击风险。
            </div>
        </div>
    </div>

    <!-- 引入Three.js和相关库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ======================= 机构参数 =======================
        let r = 1.0;            // 曲柄长度 (m)
        let omega = 2.2;        // 角速度 (rad/s)
        let currentTheta = 0;
        
        // 理论公式: 滑道位移 x = r * cosθ
        function getTheoryDisplacement(theta) { return r * Math.cos(theta); }
        function getTheoryVelocity(theta) { return -omega * r * Math.sin(theta); }
        function getTheoryAcceleration(theta) { return -omega * omega * r * Math.cos(theta); }
        
        // 仿真数值解 (基于微小扰动)
        let lastTheta = 0;
        function getSimVelocity(theta, dt) {
            if (dt < 1e-6) return 0;
            const x1 = r * Math.cos(theta);
            const x0 = r * Math.cos(theta - omega * dt);
            return (x1 - x0) / dt;
        }
        function getSimAcceleration(theta, dt) {
            if (dt < 1e-6) return 0;
            const v1 = getSimVelocity(theta, dt);
            const v0 = getSimVelocity(theta - omega * dt, dt);
            return (v1 - v0) / dt;
        }
        
        // ======================= Three.js 场景 (对标课本图8-11a) =======================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2f8);
        scene.fog = new THREE.FogExp2(0xeef2f8, 0.01);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.2, 2.4, 4.8);
        camera.lookAt(0.5, 0.2, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // 光照
        const ambient = new THREE.AmbientLight(0x404060, 0.65);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(2, 4, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.PointLight(0x88aaff, 0.4);
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);
        
        const grid = new THREE.GridHelper(8, 20, 0x888888, 0xbbbbbb);
        grid.position.y = -1.0;
        grid.material.transparent = true;
        grid.material.opacity = 0.4;
        scene.add(grid);
        
        // 机构构件
        const pivotMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, metalness: 0.7 });
        const pivotO = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), pivotMat);
        pivotO.position.set(0, 0, 0);
        scene.add(pivotO);
        
        const crankMat = new THREE.MeshStandardMaterial({ color: 0xdd4444, metalness: 0.6 });
        const crankCyl = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1, 12), crankMat);
        crankCyl.castShadow = true;
        scene.add(crankCyl);
        
        const sliderMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x004466 });
        const sliderBall = new THREE.Mesh(new THREE.SphereGeometry(0.14, 32, 32), sliderMat);
        sliderBall.castShadow = true;
        scene.add(sliderBall);
        
        const bcLength = 1.8;
        const bcMat = new THREE.MeshStandardMaterial({ color: 0xcad2e0, metalness: 0.5 });
        const bcBar = new THREE.Mesh(new THREE.BoxGeometry(bcLength, 0.2, 0.45), bcMat);
        bcBar.castShadow = true;
        scene.add(bcBar);
        
        // 竖直滑道MN (固连于BC左端)
        const railMat = new THREE.MeshStandardMaterial({ color: 0x8a9bb0 });
        const movingRail = new THREE.Mesh(new THREE.BoxGeometry(0.28, 2.4, 0.5), railMat);
        movingRail.position.set(-bcLength/2, 0, 0);
        bcBar.add(movingRail);
        const slotVis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.12, 0.1), new THREE.MeshStandardMaterial({ color: 0xc0d0e8, transparent: true, opacity: 0.6 }));
        slotVis.position.set(0, 0, 0.32);
        movingRail.add(slotVis);
        
        // 装饰端头
        const capMat = new THREE.MeshStandardMaterial({ color: 0xffaa77 });
        const leftCap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), capMat);
        const rightCap = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), capMat);
        bcBar.add(leftCap);
        bcBar.add(rightCap);
        leftCap.position.set(-bcLength/2 + 0.12, 0, 0.2);
        rightCap.position.set(bcLength/2 - 0.12, 0, 0.2);
        
        // 文字标注
        function makeLabel(text, color) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '12px';
            div.style.fontWeight = 'bold';
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            return new CSS2DObject(div);
        }
        const labelO = makeLabel('O', '#ffaa66');
        labelO.position.set(0, -0.35, 0);
        scene.add(labelO);
        const labelA = makeLabel('滑块 A', '#88ccff');
        scene.add(labelA);
        const labelBC = makeLabel('滑道 BC', '#aaddff');
        scene.add(labelBC);
        
        // 轨迹虚线
        let orbitLine;
        function updateOrbitLine() {
            if (orbitLine) scene.remove(orbitLine);
            const points = [];
            for (let i = 0; i <= 100; i++) {
                const th = (i/100)*Math.PI*2;
                points.push(new THREE.Vector3(r*Math.cos(th), r*Math.sin(th), 0.02));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            orbitLine = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color: 0xff8866, transparent: true, opacity: 0.5 }));
            scene.add(orbitLine);
        }
        updateOrbitLine();
        
        // ======================= 数据记录与曲线绘制 =======================
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        let timeHistory = [];
        let theoryDisp = [], theoryVel = [], theoryAcc = [];
        let simDisp = [], simVel = [], simAcc = [];
        const MAX_POINTS = 180;
        let currentCurve = 'disp';
        
        // 快照存储: 每个快照包含 { label, color, time, theoryData, simData, curveType 实际保存理论数据数组? 为了简化，存快照时的理论加速度曲线用于对比 }
        // 为简单实现对比效果，保存的是当前显示曲线的理论数据快照（加速度曲线最能体现冲击）
        let snapshots = []; // 存储 { name, color, dataArray } dataArray为理论加速度值数组 (对应时间轴)
        
        function updateStatsAndWarning() {
            const maxDisp = 2 * r;
            const maxVel = omega * r;
            const maxAcc = omega * omega * r;
            const period = (2 * Math.PI / omega).toFixed(3);
            document.getElementById('max-disp').innerText = maxDisp.toFixed(3);
            document.getElementById('max-vel').innerText = maxVel.toFixed(3);
            document.getElementById('max-acc').innerText = maxAcc.toFixed(3);
            document.getElementById('period').innerText = period;
            const warningDiv = document.getElementById('impact-warning');
            if (maxAcc > 6.0) warningDiv.innerHTML = '⚠️ 高风险：加速度峰值极大 (>6 m/s²)，冲击剧烈，易造成振动损坏！建议降低 ω 或 r。';
            else if (maxAcc > 3.5) warningDiv.innerHTML = '⚠️ 中风险：加速度峰值较高，机构振动明显，注意疲劳与噪声。';
            else warningDiv.innerHTML = '✅ 风险较低：加速度峰值适中，机构运行平稳。';
        }
        
        function drawCurve() {
            if (!ctx) return;
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            canvas.width = w;
            canvas.height = h;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(0, 0, w, h);
            
            if (timeHistory.length < 2) return;
            
            let theoryData, simData, yLabel;
            if (currentCurve === 'disp') {
                theoryData = theoryDisp;
                simData = simDisp;
                yLabel = '位移 x (m)';
            } else if (currentCurve === 'vel') {
                theoryData = theoryVel;
                simData = simVel;
                yLabel = '速度 v (m/s)';
            } else {
                theoryData = theoryAcc;
                simData = simAcc;
                yLabel = '加速度 a (m/s²)';
            }
            
            let maxVal = -1e9, minVal = 1e9;
            for (let i=0; i<timeHistory.length; i++) {
                maxVal = Math.max(maxVal, theoryData[i], simData[i]);
                minVal = Math.min(minVal, theoryData[i], simData[i]);
            }
            const range = Math.max(Math.abs(maxVal), Math.abs(minVal)) * 1.1;
            const yZero = h/2;
            const scaleY = (h/2) / (range + 0.001);
            
            // 绘制理论 (橙)
            ctx.beginPath();
            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 2;
            let first = true;
            for (let i=0; i<timeHistory.length; i++) {
                const x = (i / (timeHistory.length-1)) * w;
                const y = yZero - theoryData[i] * scaleY;
                if (first) { ctx.moveTo(x, y); first=false; }
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // 绘制仿真 (蓝)
            ctx.beginPath();
            ctx.strokeStyle = '#44aaff';
            ctx.lineWidth = 2;
            first = true;
            for (let i=0; i<timeHistory.length; i++) {
                const x = (i / (timeHistory.length-1)) * w;
                const y = yZero - simData[i] * scaleY;
                if (first) { ctx.moveTo(x, y); first=false; }
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // 绘制快照对比曲线 (若存在加速度快照)
            if (currentCurve === 'acc' && snapshots.length > 0) {
                snapshots.forEach(snap => {
                    if (snap.dataArray && snap.dataArray.length === timeHistory.length) {
                        ctx.beginPath();
                        ctx.strokeStyle = snap.color;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([5, 5]);
                        let firstSnap = true;
                        for (let i=0; i<timeHistory.length; i++) {
                            const x = (i / (timeHistory.length-1)) * w;
                            const y = yZero - snap.dataArray[i] * scaleY;
                            if (firstSnap) { ctx.moveTo(x, y); firstSnap=false; }
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }
            
            // 零线
            ctx.beginPath();
            ctx.strokeStyle = '#aaaaff';
            ctx.lineWidth = 0.6;
            ctx.moveTo(0, yZero);
            ctx.lineTo(w, yZero);
            ctx.stroke();
            
            ctx.fillStyle = '#dddddd';
            ctx.font = '10px monospace';
            ctx.fillText(yLabel, w-70, 20);
        }
        
        // 更新机构运动 + 记录数据
        let lastTime = performance.now();
        function updateMechanism(thetaRad, dt) {
            const cosT = Math.cos(thetaRad);
            const sinT = Math.sin(thetaRad);
            const ax = r * cosT;
            const ay = r * sinT;
            const bcX = ax;
            const bcCenterX = bcX + bcLength/2;
            bcBar.position.set(bcCenterX, -0.08, 0);
            sliderBall.position.set(ax, ay, 0.08);
            
            const start = new THREE.Vector3(0,0,0);
            const end = new THREE.Vector3(ax, ay, 0);
            const dir = new THREE.Vector3().subVectors(end, start);
            const crankLen = dir.length();
            crankCyl.position.copy(start.clone().add(end).multiplyScalar(0.5));
            if (crankLen > 0.001) {
                const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
                crankCyl.quaternion.copy(quat);
            }
            if (Math.abs(crankLen - r) > 0.02) {
                crankCyl.geometry.dispose();
                crankCyl.geometry = new THREE.CylinderGeometry(0.09, 0.09, crankLen, 12);
            }
            labelA.position.set(ax, ay + 0.32, 0);
            labelBC.position.set(bcCenterX, -0.32, 0.25);
            
            // 数据记录
            const thDisp = getTheoryDisplacement(thetaRad);
            const thVel = getTheoryVelocity(thetaRad);
            const thAcc = getTheoryAcceleration(thetaRad);
            const simV = getSimVelocity(thetaRad, dt);
            const simA = getSimAcceleration(thetaRad, dt);
            const t = performance.now() / 1000;
            timeHistory.push(t);
            theoryDisp.push(thDisp);
            theoryVel.push(thVel);
            theoryAcc.push(thAcc);
            simDisp.push(ax);
            simVel.push(simV);
            simAcc.push(simA);
            
            if (timeHistory.length > MAX_POINTS) {
                timeHistory.shift(); theoryDisp.shift(); theoryVel.shift(); theoryAcc.shift();
                simDisp.shift(); simVel.shift(); simAcc.shift();
            }
            updateStatsAndWarning();
            drawCurve();
        }
        
        // 重新初始化曲线 (当参数变化时清空，保证曲线平滑)
        function resetCurveData() {
            timeHistory = [];
            theoryDisp = []; theoryVel = []; theoryAcc = [];
            simDisp = []; simVel = []; simAcc = [];
            // 重置当前转角避免跳跃
            currentTheta = 0;
        }
        
        // 快照功能 (保存当前加速度曲线理论值)
        function addSnapshot() {
            if (timeHistory.length < 10) return;
            const snapshotData = [...theoryAcc]; // 深拷贝加速度理论数据
            const colors = ['#ff66cc', '#66ff66', '#ffaa44'];
            const idx = snapshots.length;
            const color = colors[idx % colors.length];
            const name = `参数 r=${r.toFixed(2)} ω=${omega.toFixed(2)}`;
            snapshots.push({ name, color, dataArray: snapshotData });
            updateSnapshotList();
            drawCurve(); // 重绘包含快照曲线
        }
        
        function updateSnapshotList() {
            const container = document.getElementById('snapshot-list');
            container.innerHTML = '';
            const legendSpan = document.getElementById('snapshot-legend-add');
            const legendText = document.getElementById('snapshot-text');
            if (snapshots.length === 0) {
                legendText.innerText = '快照对比(无)';
                legendSpan.style.background = 'transparent';
            } else {
                legendText.innerText = `快照对比 (${snapshots.length}组)`;
                legendSpan.style.background = '#ff66cc';
            }
            snapshots.forEach((snap, idx) => {
                const btn = document.createElement('button');
                btn.innerText = `🗑️ ${snap.name}`;
                btn.style.background = '#4a4a6a';
                btn.style.fontSize = '9px';
                btn.onclick = () => {
                    snapshots.splice(idx, 1);
                    updateSnapshotList();
                    drawCurve();
                };
                container.appendChild(btn);
            });
        }
        
        // 导出CSV (当前实时数据)
        function exportCSV() {
            if (timeHistory.length === 0) return;
            let csvRows = [["t(s)", "理论位移", "仿真位移", "理论速度", "仿真速度", "理论加速度", "仿真加速度"]];
            for (let i=0; i<timeHistory.length; i++) {
                csvRows.push([
                    timeHistory[i].toFixed(4),
                    theoryDisp[i].toFixed(6),
                    simDisp[i].toFixed(6),
                    theoryVel[i].toFixed(6),
                    simVel[i].toFixed(6),
                    theoryAcc[i].toFixed(6),
                    simAcc[i].toFixed(6)
                ]);
            }
            const csvContent = csvRows.map(row => row.join(",")).join("\n");
            const blob = new Blob([csvContent], {type: "text/csv"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `crank_slider_data_r${r}_w${omega}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
        
        // 参数监听
        const rSlider = document.getElementById('r-slider');
        const omegaSlider = document.getElementById('omega-slider');
        const rVal = document.getElementById('r-val');
        const omegaVal = document.getElementById('omega-val');
        rSlider.addEventListener('input', (e) => { r = parseFloat(e.target.value); rVal.innerText = r.toFixed(2); resetCurveData(); updateOrbitLine(); updateStatsAndWarning(); });
        omegaSlider.addEventListener('input', (e) => { omega = parseFloat(e.target.value); omegaVal.innerText = omega.toFixed(2); resetCurveData(); updateStatsAndWarning(); });
        
        // 曲线切换
        document.getElementById('btn-disp').addEventListener('click', () => { currentCurve='disp'; drawCurve(); });
        document.getElementById('btn-vel').addEventListener('click', () => { currentCurve='vel'; drawCurve(); });
        document.getElementById('btn-acc').addEventListener('click', () => { currentCurve='acc'; drawCurve(); });
        document.getElementById('snapshot-btn').addEventListener('click', addSnapshot);
        document.getElementById('export-csv').addEventListener('click', exportCSV);
        
        // 相机控制
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = true;
        controls.target.set(0.5, 0.2, 0);
        
        // 动画循环
        let lastFrame = performance.now();
        function animate() {
            const now = performance.now();
            let dt = Math.min(0.033, (now - lastFrame) / 1000);
            lastFrame = now;
            currentTheta += omega * dt;
            if (currentTheta > Math.PI*2) currentTheta -= Math.PI*2;
            updateMechanism(currentTheta, dt);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        resetCurveData();
        updateStatsAndWarning();
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            drawCurve();
        });
        
        console.log('%c==== 参数化探究强化版 ====', 'color: #88ffaa');
        console.log('自变量: r(曲柄长度), ω(角速度); 因变量: 最大行程/速度/加速度/周期');
        console.log('加速度最大值 a_max = ω²·r，与r和ω平方成正比。高速/大尺寸导致冲击剧烈，可通过快照对比不同参数曲线。');
    </script>
</body>
</html>
