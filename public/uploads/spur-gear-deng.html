<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js - 外啮合直齿圆柱齿轮传动（无穿模版）</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #eee;
            padding: 8px 15px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            border-left: 4px solid #ffaa33;
        }
        #controls-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: #ccc;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">⚙️ 外啮合直齿圆柱齿轮 | 中心距增大至1.35 | 齿高减小 | 无穿模 | 主动轮(金)逆时针 | 从动轮(银)顺时针</div>
    <div id="controls-note">🖱️ 鼠标拖拽旋转视角 | 右键平移 | 滚动缩放</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 场景 (淡米色) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf8f3e8);
        scene.fog = new THREE.FogExp2(0xf8f3e8, 0.008);

        // --- 相机 ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.8, 2.2, 3.8);
        camera.lookAt(0, 0, 0);

        // --- 渲染器 ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- CSS2渲染文字 ---
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 轨道控制 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.target.set(0, 0.1, 0);

        // ========== 光照系统 ==========
        const ambientLight = new THREE.AmbientLight(0x404060, 0.65);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffcc88, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        const pointLight = new THREE.PointLight(0xaa8866, 0.6);
        pointLight.position.set(1, 2, 2);
        scene.add(pointLight);
        const fillLight = new THREE.PointLight(0x88aaff, 0.3);
        fillLight.position.set(0, -1.5, 1);
        scene.add(fillLight);
        const rimLight = new THREE.PointLight(0xffaa66, 0.4);
        rimLight.position.set(1.5, 1, 2);
        scene.add(rimLight);

        // 辅助地面网格 (半透明)
        const gridHelper = new THREE.GridHelper(6, 20, 0xccccaa, 0xddddbb);
        gridHelper.position.y = -0.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);

        // ========== 齿轮参数 (修正中心距和齿高，避免穿模) ==========
        // 中心距增大至 1.35，确保齿顶圆不相交
        const centerDistance = 1.35;
        const posActiveX = -centerDistance / 2;   // -0.675
        const posDrivenX = centerDistance / 2;     // 0.675
        const gearThickness = 0.22;
        
        // 减小齿高至0.045，齿顶圆半径 = 分度圆半径 + 齿高
        const toothHeight = 0.045;
        const toothDepth = gearThickness * 0.9;
        const radiusActive = 0.5;
        const radiusDriven = 0.75;
        const teethActive = 20;
        const teethDriven = 30;
        
        // 计算每个齿的切向宽度 (占弧长比例，避免密集穿插)
        const getToothWidth = (radius, teethCount) => {
            const arcLen = (2 * Math.PI * radius) / teethCount;
            return arcLen * 0.6;
        };
        
        // 材质
        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xdfaa40, emissive: 0x221100, metalness: 0.85, roughness: 0.28, emissiveIntensity: 0.12
        });
        const silverMaterial = new THREE.MeshStandardMaterial({
            color: 0xc0d0e0, emissive: 0x111122, metalness: 0.92, roughness: 0.25, emissiveIntensity: 0.08
        });
        
        // 创建齿轮函数 (优化齿形位置，从分度圆表面向外延伸)
        function createGear(radius, teethCount, material, positionX, toothHeightVal, thickness) {
            const group = new THREE.Group();
            
            // 圆柱主体
            const cylinderGeo = new THREE.CylinderGeometry(radius, radius, thickness, 48, 32);
            const mainBody = new THREE.Mesh(cylinderGeo, material);
            mainBody.castShadow = true;
            group.add(mainBody);
            
            // 轮毂
            const hubGeo = new THREE.CylinderGeometry(radius * 0.4, radius * 0.4, thickness * 1.05, 24);
            const hubMat = new THREE.MeshStandardMaterial({ color: material.color, metalness: 0.9, roughness: 0.3 });
            const hub = new THREE.Mesh(hubGeo, hubMat);
            hub.castShadow = true;
            group.add(hub);
            
            // 齿形: 长方体从分度圆表面向外延伸 (齿根在分度圆上，齿顶在 radius+toothHeight)
            const toothWidthVal = getToothWidth(radius, teethCount);
            const toothCenterRadius = radius + toothHeightVal / 2;  // 长方体中心位于分度圆径向外侧 halfHeight
            
            for (let i = 0; i < teethCount; i++) {
                const angle = (i / teethCount) * Math.PI * 2;
                const px = Math.cos(angle) * toothCenterRadius;
                const pz = Math.sin(angle) * toothCenterRadius;
                
                const toothGeo = new THREE.BoxGeometry(toothHeightVal, toothWidthVal, toothDepth);
                const toothMesh = new THREE.Mesh(toothGeo, material);
                toothMesh.position.set(px, 0, pz);
                toothMesh.rotation.y = angle;
                toothMesh.castShadow = true;
                group.add(toothMesh);
            }
            
            // 装饰环
            const rimGeo = new THREE.TorusGeometry(radius + 0.02, 0.025, 32, 100);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xffdd99, metalness: 0.7, roughness: 0.4 });
            const rimRing = new THREE.Mesh(rimGeo, rimMat);
            rimRing.rotation.x = Math.PI / 2;
            rimRing.position.y = thickness/2 + 0.01;
            group.add(rimRing);
            
            const rimRingBottom = new THREE.Mesh(rimGeo, rimMat);
            rimRingBottom.rotation.x = Math.PI / 2;
            rimRingBottom.position.y = -thickness/2 - 0.01;
            group.add(rimRingBottom);
            
            group.position.set(positionX, 0, 0);
            return group;
        }
        
        // 创建齿轮
        const activeGear = createGear(radiusActive, teethActive, goldMaterial, posActiveX, toothHeight, gearThickness);
        const drivenGear = createGear(radiusDriven, teethDriven, silverMaterial, posDrivenX, toothHeight, gearThickness);
        scene.add(activeGear);
        scene.add(drivenGear);
        
        // 初始相位偏移: 让齿交错，避免对顶 (主动轮旋转0.2，从动轮旋转0.65)
        activeGear.rotation.y = 0.25;
        drivenGear.rotation.y = 0.8;
        
        // ========== 白色贯穿轴 ==========
        const shaftRadius = 0.045;
        const shaftLength = centerDistance;
        const shaftGeo = new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 12);
        const shaftMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeff, metalness: 0.4, roughness: 0.6, emissive: 0x224466, emissiveIntensity: 0.1 });
        const shaft = new THREE.Mesh(shaftGeo, shaftMaterial);
        shaft.rotation.z = Math.PI / 2;
        shaft.position.set(0, 0, 0);
        shaft.castShadow = true;
        scene.add(shaft);
        
        // 轴承盖
        const bearingMat = new THREE.MeshStandardMaterial({ color: 0xccaa88, metalness: 0.7, roughness: 0.4 });
        const capGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.05, 16);
        const leftCap = new THREE.Mesh(capGeo, bearingMat);
        leftCap.position.set(posActiveX, 0, 0);
        const rightCap = new THREE.Mesh(capGeo, bearingMat);
        rightCap.position.set(posDrivenX, 0, 0);
        scene.add(leftCap);
        scene.add(rightCap);
        
        // 轴端
        const endShaftGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.25, 8);
        const endMat = new THREE.MeshStandardMaterial({ color: 0xbbaa99, metalness: 0.5 });
        const leftEnd = new THREE.Mesh(endShaftGeo, endMat);
        leftEnd.position.set(posActiveX - 0.13, 0, 0);
        const rightEnd = new THREE.Mesh(endShaftGeo, endMat);
        rightEnd.position.set(posDrivenX + 0.13, 0, 0);
        scene.add(leftEnd);
        scene.add(rightEnd);
        
        // ========== CSS2D文字标签 ==========
        function makeLabel(text, color, position, fontSize = '0.85rem') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = fontSize;
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0px rgba(0,0,0,0.3)';
            div.style.background = 'rgba(30,30,40,0.7)';
            div.style.padding = '2px 10px';
            div.style.borderRadius = '20px';
            div.style.borderLeft = `3px solid ${color}`;
            div.style.fontFamily = 'monospace';
            div.style.backdropFilter = 'blur(4px)';
            const label = new CSS2DObject(div);
            label.position.copy(position);
            scene.add(label);
        }
        makeLabel('⚙️ 主动轮  ω₁ = 2.0 rad/s', '#ffaa55', new THREE.Vector3(posActiveX - 0.25, 0.6, 0));
        makeLabel('⚙️ 从动轮  ω₂ = 1.333 rad/s', '#aaccff', new THREE.Vector3(posDrivenX + 0.25, 0.6, 0));
        
        // 中心距辅助线
        const points = [new THREE.Vector3(posActiveX, -0.3, 0), new THREE.Vector3(posDrivenX, -0.3, 0)];
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const centerLine = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: 0xaa9988 }));
        scene.add(centerLine);
        
        // 粒子装饰
        const particleCount = 400;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            particlePositions[i*3] = (Math.random() - 0.5) * 4;
            particlePositions[i*3+1] = (Math.random() - 0.5) * 2;
            particlePositions[i*3+2] = (Math.random() - 0.5) * 3;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0xddaa66, size: 0.012, transparent: true, opacity: 0.4 });
        const particles = new THREE.Points(particlesGeometry, particleMat);
        scene.add(particles);
        
        function animateParticles() {
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        
        // ========== 动画速度控制 (比例严格 2:1.333，主动逆时针，从动顺时针) ==========
        const activeAngularSpeed = 1.5;   // rad/s
        const drivenAngularSpeed = 1.0;   // rad/s (顺时针旋转，代码中用减号)
        let lastTime = performance.now();
        
        // 啮合点光球
        const contactGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xffaa77, emissive: 0xff4411, emissiveIntensity: 0.6 })
        );
        scene.add(contactGlow);
        
        // 动画循环
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTime) / 1000);
            if (delta <= 0) delta = 0.016;
            lastTime = now;
            
            activeGear.rotation.y += activeAngularSpeed * delta;
            drivenGear.rotation.y -= drivenAngularSpeed * delta;
            
            // 动态啮合点光球 (沿啮合区附近浮动)
            const t = performance.now() * 0.008;
            const contactX = 0;
            const contactY = 0.1 + Math.sin(t) * 0.08;
            const contactZ = 0.45 + Math.cos(t * 1.2) * 0.2;
            contactGlow.position.set(contactX, contactY, contactZ);
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 显示分度圆辅助线 (半透明，增强教学性)
        const addPitchCircle = (xCenter, radius, color) => {
            const points = [];
            const segments = 64;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const x = xCenter + Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                points.push(new THREE.Vector3(x, -0.35, z));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
            const circle = new THREE.LineLoop(geo, mat);
            scene.add(circle);
        };
        addPitchCircle(posActiveX, radiusActive, 0xddaa66);
        addPitchCircle(posDrivenX, radiusDriven, 0xaaccff);
        
        console.log('齿轮传动修正版：中心距1.35，齿高0.045，无穿模');
    </script>
</body>
</html>
